<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiprintt | Tú Imagen Viva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        body { background-color: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        
        .view-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(15px); overflow-y: auto; overflow-x: hidden; }
        .view-slide.active-slide { opacity: 1; pointer-events: auto; transform: translateY(0); z-index: 10; }
        
        .builder-active .editable-node { outline: 1px dashed rgba(37,216,255,0.4); cursor: pointer; transition: all 0.2s; position: relative; }
        .builder-active .editable-node:hover { outline: 2px solid #25d8ff; background: rgba(37,216,255,0.05); z-index: 50; }
        .builder-active .selected-node { outline: 2px solid #f59e0b !important; background: rgba(245,158,11,0.1) !important; z-index: 60; box-shadow: 0 0 20px rgba(245,158,11,0.2); }
        .drag-active .editable-node { cursor: grab !important; }
        .drag-active .editable-node:active { cursor: grabbing !important; }
        
        .glass-nav { background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Filtros Seamless Minimalistas */
        .filter-btn { position: relative; font-weight: 500; }
        .filter-btn.active { color: white; font-weight: 700; }
        .filter-btn::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background: var(--hover-color); opacity: 0; transition: 0.3s; z-index: -1; }
        .filter-btn.active::after { opacity: 0.15; box-shadow: inset 0 -2px 10px rgba(0,0,0,0.5); }
        .filter-btn.active::before { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--hover-color); box-shadow: 0 0 10px var(--hover-color); }
        
        .tiktok-mask { -webkit-mask-image: -webkit-radial-gradient(white, black); }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-100">

    <header class="fixed top-0 w-full z-[100] flex flex-col shadow-[0_10px_30px_rgba(0,0,0,0.3)]" id="main-header">
        <div class="h-1 w-full bg-gradient-to-r from-cyan-500 via-pink-500 to-yellow-500"></div>
        
        <nav class="glass-nav h-[56px] px-4 md:px-8 flex items-center justify-between">

                    <img src="https://multiprintt.web.app/recursos/imagenes/logo.png" alt="Logo" class="w-full h-full object-cover rounded-full" onerror="this.style.display='none'">
                </div>
                <div class="flex flex-col items-start">
                    <span class="text-white font-bold text-[13px] tracking-wide leading-none">MULTIPRINTT</span>
                    <span class="text-[9px] text-zinc-500 tracking-widest font-medium uppercase mt-0.5">Tú Imagen Viva</span>
                </div>
            </button>

            <div class="hidden md:flex items-center bg-[#050507]/80 rounded-full border border-white/5 p-1">
                <button onclick="window.navigate('catalog')" id="nav-btn-catalog" class="px-5 py-1.5 rounded-full text-xs font-semibold text-white bg-white/10 transition-all nav-item">Catálogo</button>
                <button onclick="window.navigate('academia')" id="nav-btn-academia" class="px-5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white transition-all nav-item">Academia</button>
                <button onclick="window.navigate('about')" id="nav-btn-about" class="px-5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white transition-all nav-item">Nosotros</button>
            </div>

            <!-- Botón Modo Proxy (WhatsApp General sin URL) -->
            <button onclick="openWhatsAppGral()" class="w-8 h-8 bg-zinc-900 border border-white/10 rounded-full flex items-center justify-center text-zinc-400 hover:text-[#25D366] hover:border-[#25D366]/30 transition-all shadow-lg editable-node group">
                <i class="fa-brands fa-whatsapp text-sm group-hover:scale-110 transition-transform"></i>
            </button>
        </nav>

        <!-- Submenú de Filtros Minimalista -->
        <div id="catalog-subnav" class="w-full bg-[#0a0a0c]/95 backdrop-blur-xl border-b border-white/5 flex transition-all duration-300 transform origin-top h-[34px] md:h-[45px] overflow-hidden md:justify-center">
            <button onclick="setFilter('Top')" id="filter-Top" class="filter-btn active flex-1 md:flex-none flex justify-center items-center md:px-8 text-[8px] md:text-xs text-white transition-all" style="--hover-color: #e11d48;">

            </button>
            <button onclick="setFilter('Promocionales')" id="filter-Promocionales" class="filter-btn flex-1 md:flex-none flex justify-center items-center md:px-8 text-[8px] md:text-xs text-zinc-400 hover:text-white transition-all" style="--hover-color: #f97316;">
                <span class="block md:hidden uppercase tracking-wider">Promos</span><span class="hidden md:block">Promocionales</span>
            </button>
            <button onclick="setFilter('Textil')" id="filter-Textil" class="filter-btn flex-1 md:flex-none flex justify-center items-center md:px-8 text-[8px] md:text-xs text-zinc-400 hover:text-white transition-all" style="--hover-color: #06b6d4;">
                <span class="block md:hidden uppercase tracking-wider">Textil</span><span class="hidden md:block">Textil y Moda</span>
            </button>
            <button onclick="setFilter('Jarros')" id="filter-Jarros" class="filter-btn flex-1 md:flex-none flex justify-center items-center md:px-8 text-[8px] md:text-xs text-zinc-400 hover:text-white transition-all" style="--hover-color: #ec4899;">
                <span class="block md:hidden uppercase tracking-wider">Jarros</span><span class="hidden md:block">Jarros & Thermos</span>
            </button>
            <button onclick="setFilter('General')" id="filter-General" class="filter-btn flex-1 md:flex-none flex justify-center items-center md:px-8 text-[8px] md:text-xs text-zinc-400 hover:text-white transition-all" style="--hover-color: #8b5cf6;">
                <span class="block md:hidden uppercase tracking-wider">General</span><span class="hidden md:block">Imp. General</span>
            </button>
            <button onclick="setFilter('Packs')" id="filter-Packs" class="filter-btn flex-1 md:flex-none flex justify-center items-center md:px-8 text-[8px] md:text-xs text-zinc-400 hover:text-white transition-all" style="--hover-color: #10b981;">

    </header>

    <main class="relative w-full h-[100dvh] overflow-hidden">

        <section id="view-about" class="view-slide pb-24 md:pb-8">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-[80px] md:pt-[100px] relative flex flex-col min-h-[calc(100vh-160px)] editable-section">
                <div class="text-center mb-10 editable-node">
                    <h1 class="text-3xl md:text-5xl font-extrabold text-white">Nuestra Esencia</h1>
                    <div class="w-16 h-1 bg-cyan-500 mx-auto mt-4 rounded-full"></div>
                </div>

                <div class="grid md:grid-cols-2 gap-8 items-center editable-node">
                    <div class="space-y-4 text-zinc-300 text-sm md:text-base leading-relaxed">
                        <p>En Multiprintt, no solo imprimimos, damos vida a tus ideas. Líderes en calidad visual.</p>
                    </div>
                    <button class="relative group cursor-pointer text-left w-full" onclick="openVideoModal()">

                            <img src="https://placehold.co/600x400/111/444?text=Ver+Testimonio" alt="Video" class="w-full h-full object-cover opacity-60">
                            <div class="absolute w-14 h-14 bg-cyan-500 rounded-full flex items-center justify-center text-black text-xl shadow-[0_0_30px_rgba(37,216,255,0.6)] group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-play ml-1"></i>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
        </section>
        
        <!-- Navbar Móvil Inferior -->
        <div class="md:hidden fixed bottom-0 left-0 w-full glass-nav border-t border-white/5 pb-safe z-50">
            <div class="flex justify-around items-center h-[65px] px-2">
                <button onclick="window.navigate('catalog')" class="flex flex-col items-center justify-center w-16 gap-1 text-white transition-colors" id="mob-nav-catalog">
                    <i class="fa-solid fa-store text-lg"></i><span class="text-[9px] font-medium">Tienda</span>
                </button>
                <button onclick="window.navigate('academia')" class="flex flex-col items-center justify-center w-16 gap-1 text-zinc-500 hover:text-yellow-400 transition-colors" id="mob-nav-academia">
                    <i class="fa-solid fa-graduation-cap text-lg"></i><span class="text-[9px] font-medium">Academia</span>
                </button>
                <button onclick="window.navigate('about')" class="flex flex-col items-center justify-center w-16 gap-1 text-zinc-500 hover:text-pink-400 transition-colors" id="mob-nav-about">
                    <i class="fa-solid fa-users text-lg"></i><span class="text-[9px] font-medium">Nosotros</span>
                </button>
            </div>
        </div>
    </main>

    <div id="videoModal" class="hidden fixed inset-0 z-[99999] bg-black/95 backdrop-blur-lg flex items-center justify-center transition-opacity duration-300 opacity-0">
        <button onclick="closeVideoModal()" class="absolute top-4 right-4 md:top-8 md:right-8 w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-white hover:bg-white/20 transition-all z-50 shadow-lg">
            <i class="fa-solid fa-xmark text-xl"></i>

        <!-- Forzado 9:16 Tiktok -->
        <div id="videoModalContent" style="aspect-ratio: 9/16;" class="w-[90vw] max-w-[360px] bg-black rounded-[2rem] overflow-hidden relative shadow-2xl flex flex-col editable-node tiktok-mask border border-white/10">
            <video id="testimonialVideo" src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" playsinline loop class="w-full h-full object-cover"></video>
            <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black/90 via-black/50 to-transparent z-10 pointer-events-none">

                <button onclick="toggleVideoSound(this)" class="mt-4 bg-white/20 backdrop-blur px-3 py-1.5 rounded-full text-[10px] text-white flex items-center gap-2 hover:bg-white/30 pointer-events-auto shadow-lg">
                    <i class="fa-solid fa-volume-xmark"></i> Activar Audio

        </div>

    <div id="adminDBModal" class="hidden fixed inset-0 z-[100000] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#0a0a0c] border border-white/10 rounded-2xl shadow-2xl p-6">
            <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3">
                <h3 class="text-white font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-database text-cyan-400"></i> Editor Base de Datos</h3>
                <button onclick="document.getElementById('adminDBModal').classList.add('hidden')" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="db-error-msg" class="hidden mb-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-2 rounded-lg text-center"></div>
            <div class="space-y-4">
                <input type="hidden" id="db-id">
                <input type="hidden" id="db-type">
                
                <div id="db-cat-group">
                    <label class="block text-[10px] text-zinc-500 uppercase font-bold mb-1">Categoría Principal</label>
                    <select id="db-category" class="w-full bg-[#121215] border border-white/10 p-2.5 rounded-lg text-sm text-white focus:border-cyan-400 outline-none">
                        <option value="Top">Más Vendidos (Automático)</option>
                        <option value="Promocionales">Promocionales</option>
                        <option value="Textil">Textil y Moda</option>
                        <option value="Jarros">Jarros & Thermos</option>
                        <option value="General">Imp. General</option>
                        <option value="Packs">Packs Especiales</option>
                    </select>
                </div>
                
                <div id="db-promo-group" class="flex items-center gap-2 bg-orange-500/10 p-3 rounded-lg border border-orange-500/20 cursor-pointer" onclick="const cb = document.getElementById('db-ispromo'); cb.checked = !cb.checked;">
                    <input type="checkbox" id="db-ispromo" class="w-4 h-4 accent-orange-500 cursor-pointer pointer-events-none">
                    <label class="text-xs text-orange-400 font-medium cursor-pointer pointer-events-none">🔥 Marcar también como Promocional</label>
                </div>

                <div>
                    <label class="block text-[10px] text-zinc-500 uppercase font-bold mb-1">Nombre Corto</label>
                    <input type="text" id="db-name" class="w-full bg-[#121215] border border-white/10 p-2.5 rounded-lg text-sm text-white focus:border-cyan-400 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-500 uppercase font-bold mb-1">Precio ($)</label>
                    <input type="number" id="db-price" step="0.01" class="w-full bg-[#121215] border border-white/10 p-2.5 rounded-lg text-sm text-white focus:border-cyan-400 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-500 uppercase font-bold mb-1">URL Imagen</label>
                    <input type="text" id="db-img" class="w-full bg-[#121215] border border-white/10 p-2.5 rounded-lg text-sm text-white focus:border-cyan-400 outline-none">
                </div>
                <div id="db-desc-group" class="hidden">
                    <label class="block text-[10px] text-zinc-500 uppercase font-bold mb-1">Descripción (Cursos)</label>
                    <textarea id="db-desc" rows="3" class="w-full bg-[#121215] border border-white/10 p-2.5 rounded-lg text-sm text-white focus:border-cyan-400 outline-none"></textarea>
                </div>
                
                <div class="flex gap-3 pt-2">
                    <button id="db-btn-delete" onclick="dbAskDelete()" class="hidden bg-red-500/10 border border-red-500/20 text-red-500 p-2.5 rounded-lg hover:bg-red-500 hover:text-white transition-colors" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    <button id="db-btn-confirm-delete" onclick="dbDeleteRecord()" class="hidden bg-red-600 text-white font-bold p-2.5 rounded-lg flex-1 text-sm">¿Borrar Definitivamente?</button>
                    <button onclick="dbSaveRecord()" id="db-btn-save" class="flex-1 bg-cyan-500 text-black font-bold py-2.5 rounded-lg hover:bg-cyan-400 transition-colors text-sm">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, query, orderBy, limit, increment, updateDoc, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", authDomain: "multiprintt-cc0f1.firebaseapp.com", projectId: "multiprintt-cc0f1", storageBucket: "multiprintt-cc0f1.firebasestorage.app", messagingSenderId: "626369594335", appId: "1:626369594335:web:711aac8c65197a0dceba6a" };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentCategory = 'Top';
        let isAdminMode = false;
        const WASA_NUMBER = "593988358485";

        // Protección AuthState para asegurar carga perfecta
        auth.authStateReady().then(async () => {
            if (!auth.currentUser) {
                try { await signInAnonymously(auth); } catch (e) { console.warn("Anon Auth Warning:", e); }
            }
            window.setFilter('Top');
            window.loadCourses();
            if(window.parent !== window) window.parent.postMessage({ type: 'APP_READY' }, '*');
        });

        // Modo Proxy - Marketing Rich Text
        window.openWhatsAppGral = () => {
            let text = "¡Hola! 👋 Vengo de su página web y necesito ayuda general o contactarme con un asesor.";
            window.open(`https://wa.me/${WASA_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
        }

        window.incrementAndOrder = async (id, name, price, img, isCourse) => {
            if(!isAdminMode) {
                try {
                    const ref = doc(db, isCourse ? 'cursos' : 'productos', id);
                    await updateDoc(ref, { clicks: increment(1) });
                } catch(e) { console.warn("Contador analítico silencioso falló.", e); }
            }
            
            let text = "";
            if(isCourse) {
                text = `¡Hola! 👋 Estoy muy interesado en potenciar mis habilidades y me gustaría inscribirme en este curso:%0A%0A📚 *${name}*%0A💵 *${price}*%0A%0A📸 *Referencia Visual:* ${img}%0A%0A¿Me podrían ayudar con los métodos de pago disponibles?`;
            } else {
                text = `¡Hola! 👋 Me encantó su catálogo y me interesa hacer un pedido de este producto:%0A%0A🛍️ *${name}*%0A💵 *${price}*%0A%0A📸 *Referencia Visual:* ${img}%0A%0A¿Me podrían ayudar con más información, disponibilidad y formas de pago?`;
            }
            window.open(`https://wa.me/${WASA_NUMBER}?text=${text}`, '_blank');
        }

        // Navegación Segura
        window.navigate = function(viewId) {
            document.querySelectorAll('.view-slide').forEach(el => el.classList.remove('active-slide'));
            const targetView = document.getElementById('view-' + viewId);
            if(targetView) targetView.classList.add('active-slide');
            
            document.querySelectorAll('.nav-item').forEach(el => { el.className = 'px-5 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-white transition-all nav-item'; });
            const pBtn = document.getElementById('nav-btn-' + viewId);
            if(pBtn) pBtn.className = 'px-5 py-1.5 rounded-full text-xs font-semibold text-white bg-white/10 transition-all nav-item';
            
            ['catalog', 'academia', 'about'].forEach(v => {
                const b = document.getElementById('mob-nav-' + v);
                if(b) b.className = `flex flex-col items-center justify-center w-16 gap-1 transition-colors ${v === viewId ? 'text-white' : 'text-zinc-500 hover:text-zinc-300'}`;
            });

            const subnav = document.getElementById('catalog-subnav');
            if (subnav) {
                if (viewId === 'catalog') {
                    subnav.style.height = window.innerWidth < 768 ? '34px' : '45px';
                    subnav.style.opacity = '1'; subnav.style.pointerEvents = 'auto';
                } else {
                    subnav.style.height = '0px';
                    subnav.style.opacity = '0';
                    subnav.style.pointerEvents = 'none';
                }
            }
        };

        const colorMap = { 'Top': '#e11d48', 'Promocionales': '#f97316', 'Textil': '#06b6d4', 'Jarros': '#ec4899', 'General': '#8b5cf6', 'Packs': '#10b981' };

        window.setFilter = function(category) {
            currentCategory = category;
            const buttons = document.querySelectorAll('.filter-btn');
            
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if(btn.id === 'filter-' + category) {
                    btn.classList.add('active');
                    if(!isAdminMode) loadProducts(category);
                }
            });
        };

        async function loadProducts(cat) {
            const grid = document.getElementById('product-grid');
            if(!grid) return;
            
            const btnColor = colorMap[cat] || '#25d8ff';
            grid.innerHTML = '<div class="col-span-full flex justify-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-3xl" style="color:'+btnColor+'"></i></div>';
            
            try {
                let q;
                const colRef = collection(db, "productos");
                
                if (cat === 'Top') {
                    q = query(colRef, orderBy("clicks", "desc"), limit(8));
                } else if (cat === 'Promocionales') {
                    const q1 = await getDocs(query(colRef, where("category", "==", "Promocionales")));
                    const q2 = await getDocs(query(colRef, where("isPromo", "==", true)));
                    
                    let map = new Map();
                    q1.forEach(d => map.set(d.id, d));
                    q2.forEach(d => map.set(d.id, d));
                    
                    renderProductGrid(Array.from(map.values()), btnColor);
                    return;
                } else {
                    q = query(colRef, where("category", "==", cat));
                }
                
                const snap = await getDocs(q);
                renderProductGrid(snap.docs, btnColor);

            } catch (error) {
                console.error("Firebase Error:", error);
                if (error.code === 'permission-denied' || error.message.includes('permission')) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center text-red-500 text-xs py-10 bg-red-500/10 border border-red-500/20 rounded-xl">
                            <i class="fa-solid fa-lock text-3xl mb-3"></i><br>
                            <b class="font-bold text-sm">Bloqueo de Seguridad Firebase</b><br>
                            <span class="text-zinc-400 mt-2 block px-4">
                                Firebase está bloqueando la base de datos.<br>Ve a Firestore Database -> Reglas y pega:<br>
                                <code class="bg-black/50 text-red-300 p-2 mt-2 rounded block mx-auto text-left w-fit text-[10px]">allow read: if true;<br>allow write: if request.auth != null;</code>
                            </span>
                        </div>`;
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 text-xs py-8">No hay productos aquí.</div>';
                }
                if(isAdminMode) grid.innerHTML += `<button onclick="dbOpenModal('productos', null)" class="mt-4 bg-[#121215] border border-white/10 px-4 py-2 rounded-lg text-white hover:border-cyan-400 text-xs mx-auto block"><i class="fa-solid fa-plus"></i> Añadir Producto</button>`;
            }
        }

        function renderProductGrid(docs, color) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            if(docs.length === 0) grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 text-xs py-8">Aún no hay productos en esta categoría.</div>';

            docs.forEach(doc => {
                const p = doc.data ? doc.data() : doc; // Soporta map.values() o docSnapshot
                const id = doc.id || p.id || Date.now().toString(); // Fallback id
                
                const div = document.createElement('div');
                div.className = `group relative bg-[#0a0a0c] border border-white/5 rounded-2xl overflow-hidden hover:border-white/20 transition-all shadow-lg flex flex-col justify-between`;
                div.style.setProperty('--hover-glow', color);
                
                let adminHtml = isAdminMode ? `<div class="absolute top-2 right-2 z-20 flex gap-1"><button onclick="dbOpenModal('productos', '${id}')" class="w-7 h-7 bg-black/80 backdrop-blur rounded-md border border-white/20 text-cyan-400 flex items-center justify-center hover:bg-cyan-500 hover:text-black transition-colors"><i class="fa-solid fa-pen text-[10px]"></i></button></div>` : '';
                let promoBadge = p.isPromo && currentCategory !== 'Promocionales' ? `<span class="absolute top-2 left-2 z-20 bg-orange-500 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow-lg uppercase tracking-wider">Promo</span>` : '';

                div.innerHTML = `
                    ${adminHtml}
                    ${promoBadge}
                    <div class="aspect-square bg-[#050507] relative overflow-hidden flex items-center justify-center p-4">
                        <div class="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-500" style="background: radial-gradient(circle, var(--hover-glow) 0%, transparent 70%);"></div>
                        <img src="${p.img || 'https://placehold.co/400x400/111/444?text=Foto'}" alt="${p.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500 drop-shadow-xl relative z-10" onerror="this.src='https://placehold.co/400x400/111/444?text=Error'">
                    </div>
                    <div class="p-3.5 flex flex-col flex-grow border-t border-white/5">
                        <h3 class="text-zinc-200 font-semibold text-xs md:text-sm line-clamp-2 leading-tight">${p.name || 'Sin Nombre'}</h3>
                        <div class="flex justify-between items-center mt-auto pt-3">
                            <span class="text-white font-bold text-sm">$${parseFloat(p.price||0).toFixed(2)}</span>
                            <button onclick="incrementAndOrder('${id}', '${p.name}', '$${parseFloat(p.price||0).toFixed(2)}', '${p.img}', false)" class="bg-[#121215] border border-white/10 hover:bg-white/10 text-white px-3 py-1.5 rounded-lg text-[10px] font-medium transition-colors shadow-sm cursor-pointer">Pedir</button>
                        </div>
                    </div>
                `;
                
                div.addEventListener('mouseenter', () => div.style.borderColor = color);
                div.addEventListener('mouseleave', () => div.style.borderColor = 'rgba(255,255,255,0.05)');
                
                grid.appendChild(div);
            });

            if(isAdminMode) {
                grid.innerHTML += `<div onclick="dbOpenModal('productos', null)" class="group relative bg-[#0a0a0c]/50 border border-dashed border-white/10 rounded-2xl flex flex-col items-center justify-center min-h-[220px] cursor-pointer hover:border-cyan-400 hover:bg-cyan-500/5 transition-all text-zinc-500 hover:text-cyan-400"><i class="fa-solid fa-circle-plus text-3xl mb-2"></i><span class="text-xs font-medium">Añadir Producto</span></div>`;
            }
        }

        window.loadCourses = async function() {
            const grid = document.getElementById('course-grid');
            if(!grid) return;
            
            grid.innerHTML = '<div class="col-span-full flex justify-center py-12"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-yellow-400"></i></div>';
            try {
                const snap = await getDocs(collection(db, "cursos"));
                grid.innerHTML = '';
                
                if(snap.empty) grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 text-xs py-8">No hay cursos disponibles.</div>';

                snap.forEach(doc => {
                    const c = doc.data();
                    const div = document.createElement('div');
                    div.className = 'bg-[#0a0a0c] border border-white/10 rounded-2xl overflow-hidden flex flex-col md:flex-row group hover:border-yellow-500/30 transition-all shadow-xl relative';
                    
                    let adminHtml = isAdminMode ? `<div class="absolute top-2 right-2 z-20 flex gap-1"><button onclick="dbOpenModal('cursos', '${doc.id}')" class="w-8 h-8 bg-black/80 backdrop-blur rounded-md border border-white/20 text-yellow-400 flex items-center justify-center hover:bg-yellow-500 hover:text-black transition-colors cursor-pointer"><i class="fa-solid fa-pen"></i></button></div>` : '';

                    div.innerHTML = `
                        ${adminHtml}
                        <div class="w-full md:w-2/5 aspect-video md:aspect-square bg-[#050507] overflow-hidden relative border-b md:border-b-0 md:border-r border-white/5">
                            <img src="${c.img || 'https://placehold.co/400x400/111/444?text=Curso'}" alt="Curso" class="w-full h-full object-cover opacity-80 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500">
                        </div>
                        <div class="w-full md:w-3/5 p-5 flex flex-col justify-center">
                            <span class="text-[9px] font-bold text-yellow-400 uppercase tracking-widest mb-1">Academia</span>
                            <h3 class="text-white font-bold text-base md:text-lg mb-2 leading-tight">${c.name || 'Curso'}</h3>
                            <p class="text-zinc-400 text-xs line-clamp-2 mb-4 leading-relaxed">${c.desc || ''}</p>
                            <div class="flex items-center justify-between mt-auto">
                                <span class="bg-white/5 px-3 py-1.5 rounded-lg border border-white/10 text-white font-semibold text-sm">$${parseFloat(c.price||0).toFixed(2)}</span>
                                <button onclick="openCourseDetails('${doc.id}', \`${c.name}\`, \`${c.desc}\`, '$${parseFloat(c.price||0).toFixed(2)}', \`${c.img}\`)" class="bg-gradient-to-r from-yellow-500 to-pink-500 text-black font-bold px-4 py-1.5 rounded-lg text-xs shadow-lg hover:shadow-yellow-500/25 transition-all cursor-pointer">Ver más</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(div);
                });
                if(isAdminMode) {
                    grid.innerHTML += `<button onclick="dbOpenModal('cursos', null)" class="bg-[#0a0a0c]/50 border border-dashed border-white/10 rounded-2xl flex flex-col items-center justify-center min-h-[150px] cursor-pointer hover:border-yellow-400 hover:bg-yellow-500/5 transition-all text-zinc-500 hover:text-yellow-400 w-full"><i class="fa-solid fa-graduation-cap text-3xl mb-2"></i><span class="text-xs font-medium">Añadir Curso</span></button>`;
                }
            } catch (error) { 
                grid.innerHTML = '<div class="col-span-full text-center text-red-500 text-xs py-8">Error cargando cursos. Revisa Firebase.</div>'; 
            }
        }

        // Modales Secundarios
        window.openCourseDetails = function(id, name, desc, price, img) {
            document.getElementById('cm-title').innerText = name;
            document.getElementById('cm-desc').innerText = desc;
            document.getElementById('cm-price').innerText = price;
            document.getElementById('cm-img').src = img;
            document.getElementById('cm-btn').onclick = () => window.incrementAndOrder(id, name, price, img, true);
            
            const m = document.getElementById('courseModal');
            const c = document.getElementById('courseModalContent');
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }, 10);
        }
        window.closeCourseModal = function() {
            const m = document.getElementById('courseModal');
            const c = document.getElementById('courseModalContent');
            m.classList.add('opacity-0');
            c.classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        window.openVideoModal = function() {
            const m = document.getElementById('videoModal');
            const v = document.getElementById('testimonialVideo');
            
            v.muted = true; // Auto-play seguro
            m.classList.remove('hidden');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
            v.play().catch(e => console.warn("Auto-play requirió mute.", e));
        }
        
        window.closeVideoModal = function() {
            const m = document.getElementById('videoModal');
            const v = document.getElementById('testimonialVideo');
            v.pause(); v.muted = true;
            m.classList.add('opacity-0');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        window.toggleVideoSound = function(btn) {
            const v = document.getElementById('testimonialVideo');
            const icon = btn.querySelector('i');
            if(v.muted) {
                v.muted = false;
                icon.classList.replace('fa-volume-xmark', 'fa-volume-high');
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Silenciar';
            } else {
                v.muted = true;
                icon.classList.replace('fa-volume-high', 'fa-volume-xmark');
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> Activar Audio';
            }
        }

        // --- SISTEMA ADMIN SEGURO (SIN ALERTS) ---
        window.dbOpenModal = async function(type, id) {
            if(!isAdminMode) return;
            document.getElementById('db-type').value = type;
            document.getElementById('db-id').value = id || '';
            document.getElementById('db-promo-group').style.display = type === 'productos' ? 'flex' : 'none';
            document.getElementById('db-cat-group').style.display = type === 'productos' ? 'block' : 'none';
            document.getElementById('db-desc-group').style.display = type === 'cursos' ? 'block' : 'none';
            
            document.getElementById('db-btn-delete').classList.toggle('hidden', !id);
            document.getElementById('db-btn-confirm-delete').classList.add('hidden');
            document.getElementById('db-btn-delete').classList.remove('hidden');
            document.getElementById('db-error-msg').classList.add('hidden');

            document.getElementById('db-name').value = '';
            document.getElementById('db-price').value = '';
            document.getElementById('db-img').value = '';
            document.getElementById('db-desc').value = '';
            document.getElementById('db-ispromo').checked = false;
            
            if(type === 'productos') document.getElementById('db-category').value = currentCategory === 'Top' ? 'Promocionales' : currentCategory;

            if(id) {
                const docSnap = await getDocs(query(collection(db, type)));
                let data = null;
                docSnap.forEach(d => { if(d.id === id) data = d.data(); });
                
                if(data) {
                    document.getElementById('db-name').value = data.name || '';
                    document.getElementById('db-price').value = data.price || '';
                    document.getElementById('db-img').value = data.img || '';
                    if(type === 'cursos') document.getElementById('db-desc').value = data.desc || '';
                    if(type === 'productos') {
                        document.getElementById('db-category').value = data.category || 'General';
                        document.getElementById('db-ispromo').checked = !!data.isPromo;
                    }
                }
            }
            document.getElementById('adminDBModal').classList.remove('hidden');
        }

        window.dbSaveRecord = async function() {
            const btn = document.getElementById('db-btn-save');
            const err = document.getElementById('db-error-msg');
            const type = document.getElementById('db-type').value;
            const id = document.getElementById('db-id').value || Date.now().toString();
            
            const data = {
                name: document.getElementById('db-name').value,
                price: parseFloat(document.getElementById('db-price').value || 0),
                img: document.getElementById('db-img').value
            };
            
            if(type === 'cursos') data.desc = document.getElementById('db-desc').value;
            if(type === 'productos') {
                data.category = document.getElementById('db-category').value;
                data.isPromo = document.getElementById('db-ispromo').checked;
            }

            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            try {
                await setDoc(doc(db, type, id), data, {merge: true});
                document.getElementById('adminDBModal').classList.add('hidden');
                if(type === 'productos') loadProducts(currentCategory); else loadCourses();
            } catch (e) { 
                err.innerText = "Error: " + e.message;
                err.classList.remove('hidden');
            }
            btn.innerHTML = 'Guardar Cambios';
        }

        window.dbAskDelete = function() {
            document.getElementById('db-btn-delete').classList.add('hidden');
            document.getElementById('db-btn-confirm-delete').classList.remove('hidden');
        }

        window.dbDeleteRecord = async function() {
            const btn = document.getElementById('db-btn-confirm-delete');
            const err = document.getElementById('db-error-msg');
            const type = document.getElementById('db-type').value;
            const id = document.getElementById('db-id').value;
            
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            try {
                await deleteDoc(doc(db, type, id));
                document.getElementById('adminDBModal').classList.add('hidden');
                if(type === 'productos') loadProducts(currentCategory); else loadCourses();
            } catch(e) { 
                err.innerText = "Error eliminando: " + e.message;
                err.classList.remove('hidden');
                btn.innerHTML = '¿Borrar Definitivamente?';
            }
        }

        // Listener Comunicador (Iframe Builder)
        window.addEventListener('message', async (e) => {
            if (e.data.type === 'ENABLE_BUILDER') { 
                isAdminMode = false; document.body.classList.add('builder-active'); 
                document.getElementById('product-grid').innerHTML = '<div class="col-span-full text-center text-cyan-400 p-8 border border-dashed border-cyan-500/30 rounded-xl bg-cyan-500/10">Catálogo Oculto.<br><span class="text-xs text-zinc-400">Usa "Navegar / Usar" en el panel para gestionar la DB.</span></div>';
                document.getElementById('course-grid').innerHTML = '<div class="col-span-full text-center text-yellow-400 p-8 border border-dashed border-yellow-500/30 rounded-xl bg-yellow-500/10">Cursos Ocultos.<br><span class="text-xs text-zinc-400">Usa "Navegar / Usar" en el panel.</span></div>';
            }
            if (e.data.type === 'DISABLE_BUILDER') { 
                document.body.classList.remove('builder-active'); document.body.classList.remove('drag-active');
                isAdminMode = true; 
                setFilter(currentCategory); loadCourses(); 
            }
        });
    </script>
</body>
</html>
