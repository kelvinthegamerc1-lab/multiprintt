<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Multiprintt | Visual Builder Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    body { background-color: #030303; color: #e5e5e5; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(37,216,255,0.5); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* AUTH SCREEN */
    #auth-screen { position: fixed; inset: 0; background: #030303; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
    .glass-panel { background: #0a0a0c; border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; box-shadow: 0 40px 80px -20px rgba(0,0,0,1); }
    
    /* HUD QUIRÚRGICO */
    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; background: #030303;}
    
    /* TOPBAR COMPACTA */
    .topbar { height: 50px; background: rgba(10,10,12,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 50;}
    
    .workspace { display: flex; flex: 1; overflow: hidden; }
    
    /* SIDEBAR IZQUIERDA MINIMALISTA */
    .sidebar { width: 220px; background: #070709; border-right: 1px solid rgba(255,255,255,0.04); padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; z-index:10; }
    
    /* SIDEBAR DERECHA (PROPIEDADES) */
    .sidebar-right { width: 280px; background: #070709; border-left: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; overflow-y: auto; z-index:10; }
    
    /* IFRAME CANVAS (EFECTO LIENZO FLOTANTE) */
    #preview-container { flex: 1; background: #030303; display: flex; align-items: center; justify-content: center; position: relative; padding: 24px; overflow: hidden; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 20px 20px; }
    #preview-wrapper { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); background: #070709; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.8); display: flex; flex-direction: column; transform-origin: top center;}
    .device-desktop { width: 100% !important; min-width: 1024px; height: 100% !important; border-radius: 12px; }
    .device-tablet { width: 820px !important; height: 1180px !important; border-radius: 20px; margin: auto; border: 8px solid #141414 !important;}
    .device-mobile { width: 390px !important; height: 844px !important; border-radius: 32px; margin: auto; border: 10px solid #141414 !important;}
    #site-frame { width: 100%; height: 100%; border: none; flex-grow: 1; background: #070709; border-radius: inherit;}
    
    /* BOTONES HUD */
    .device-btn { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #555; transition: all 0.2s; cursor: pointer; font-size: 13px;}
    .device-btn.active { background: rgba(37,216,255,0.1); color: #25d8ff; box-shadow: inset 0 0 0 1px rgba(37,216,255,0.2);}
    .device-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }

    .tool-btn { background: transparent; border: 1px solid rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; color: #a1a1aa; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; }
    .tool-btn:hover { background: #121215; border-color: rgba(255,255,255,0.1); color: white;}
    .btn-action { background: #121215; border: 1px solid rgba(255,255,255,0.06); font-weight: 600; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .btn-action:hover { background: #1a1a1e; border-color: rgba(37,216,255,0.4); color: #25d8ff; }
    
    .panel-header { font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: #555; font-weight: 800; margin: 12px 0 6px 4px; display: flex; align-items: center; gap: 6px; }
    .divider { height: 1px; background: rgba(255,255,255,0.03); width: 100%; margin: 8px 0; }
    
    /* ACORDEÓN PROPIEDADES */
    .acc-item { border-bottom: 1px solid rgba(255,255,255,0.03); }
    .acc-header { padding: 14px 16px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #888; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: transparent; transition: all 0.2s;}
    .acc-header:hover { color: #fff; }
    .acc-item.active .acc-header { color: #25d8ff; background: rgba(37,216,255,0.02);}
    .acc-content { padding: 16px; display: none; background: #070709; flex-direction: column; gap: 14px; }
    .acc-item.active .acc-content { display: flex; }
    .acc-item.active .acc-header i.fa-chevron-down { transform: rotate(180deg); color: #25d8ff; }
    
    .inspector-label { font-size: 9px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;}
    .inspector-input { width: 100%; background: #030303; border: 1px solid rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 6px; color: #e5e5e5; outline: none; font-size: 11px; transition: all 0.2s; font-family: 'Inter', sans-serif;}
    .inspector-input:focus { border-color: #25d8ff; background: #000; box-shadow: 0 0 0 2px rgba(37,216,255,0.1);}
    
    .input-group { display: flex; background: #030303; border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; overflow: hidden; transition: all 0.2s;}
    .input-group:focus-within { border-color: #25d8ff; box-shadow: 0 0 0 2px rgba(37,216,255,0.1); }
    .input-group input { width: 100%; background: transparent; border: none; padding: 8px 10px; color: #e5e5e5; outline: none; font-size: 11px; font-family: monospace;}
    
    .color-picker { width: 100%; height: 32px; padding: 2px; background: #030303; border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; cursor: pointer; transition: 0.2s;}
    .color-picker:hover { border-color: rgba(255,255,255,0.2); }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: none; border-radius: 4px; }
    
    .align-btn { flex: 1; padding: 6px; border-radius: 4px; color: #666; transition: all 0.2s; border: 1px solid transparent; display: flex; justify-content: center; align-items: center;}
    .align-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .align-btn.active { background: rgba(37,216,255,0.1); color: #25d8ff; border-color: rgba(37,216,255,0.2); box-shadow: 0 2px 10px rgba(37,216,255,0.1);}

    /* MODALES HUD */
    .hud-modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center; transition: opacity 0.3s; opacity: 0; }
    .hud-modal.show { display: flex; opacity: 1; }
    .hud-modal-content { background: #0a0a0c; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .hud-modal.show .hud-modal-content { transform: scale(1); }

    .db-input { width: 100%; background: #030303; border: 1px solid rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 10px; color: white; outline: none; font-size: 12px; transition: all 0.2s; }
    .db-input:focus { border-color: #25d8ff; box-shadow: 0 0 0 2px rgba(37,216,255,0.15); }
    .db-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: bold; color: #777; margin-bottom: 4px; display: block; }

    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .custom-toast { background: #0a0a0c; border: 1px solid rgba(255,255,255,0.06); border-left: 3px solid #25d8ff; color: #e5e5e5; padding: 14px 20px; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; }
    .custom-toast.show { transform: translateX(0); opacity: 1; }
    .custom-toast.error { border-left-color: #ef4444; }
    .custom-toast.warning { border-left-color: #f59e0b; }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- PANTALLA AUTH -->
<div id="auth-screen">
    <div class="glass-panel p-10 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-500/20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(37,216,255,0.15)]">
            <i class="fa-solid fa-bolt text-2xl text-cyan-400"></i>
        </div>
        <h1 class="text-xl font-extrabold mb-1 tracking-tight">System <span class="text-cyan-400 font-light">HUD</span></h1>
        <p class="text-zinc-600 text-[10px] uppercase tracking-widest mb-8 font-bold">Autenticación Requerida</p>
        <div class="space-y-3">
            <input type="email" id="loginUser" placeholder="Admin Email" class="w-full bg-[#030303] border border-white/5 p-3 rounded-xl text-xs text-white outline-none focus:border-cyan-400 transition-colors">
            <input type="password" id="loginPass" placeholder="Password" class="w-full bg-[#030303] border border-white/5 p-3 rounded-xl text-xs text-white outline-none focus:border-cyan-400 transition-colors">
            <button onclick="window.attemptLogin()" id="btn-login" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-zinc-200 transition-colors text-xs mt-2 shadow-[0_0_15px_rgba(255,255,255,0.1)]">Inicializar Enlace</button>
        </div>
    </div>
</div>

<!-- INTERFAZ PRINCIPAL HUD -->
<div id="builder-ui">
    <div class="topbar">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 bg-white text-black rounded-lg flex items-center justify-center shadow-md">
                <i class="fa-solid fa-code text-[11px]"></i>
            </div>
            <span class="font-bold text-xs tracking-wide">Multiprintt <span class="text-zinc-500 font-normal">Core</span></span>
        </div>
        
        <div class="flex items-center gap-1 bg-[#030303] p-1 border border-white/5 rounded-lg">
            <button class="device-btn active" onclick="window.setDevice('desktop', this)" title="Escritorio"><i class="fa-solid fa-desktop"></i></button>
            <button class="device-btn" onclick="window.setDevice('tablet', this)" title="Tablet"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button class="device-btn" onclick="window.setDevice('mobile', this)" title="Móvil"><i class="fa-solid fa-mobile-screen-button"></i></button>
        </div>

        <div class="flex items-center gap-2.5">
            <button class="tool-btn hover:bg-pink-500/10 hover:text-pink-400 hover:border-pink-500/30" id="btn-drag" onclick="window.toggleDragMode(this)">
                <i class="fa-solid fa-arrows-up-down-left-right"></i> <span>Mover Elementos</span>
            </button>
            <button class="tool-btn hover:bg-amber-500/10 hover:text-amber-400 hover:border-amber-500/30" onclick="window.resetTemplateConfirm()" title="Restaura la web a sus valores de fábrica">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button class="tool-btn btn-action" id="publish-btn" onclick="window.publishChanges()">
                <i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span>Desplegar Cambios</span>
            </button>
            <button class="tool-btn hover:bg-red-500/10 hover:text-red-500 hover:border-red-500/30 px-3" onclick="window.logout()" title="Cerrar Sesión"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
    
    <div class="workspace">
        <!-- SIDEBAR IZQUIERDA -->
        <div class="sidebar hide-scrollbar">
            <div class="panel-header"><i class="fa-solid fa-route"></i> Navegación</div>
            <button class="tool-btn w-full" onclick="window.callIframeFunction('navigate', 'catalog')"><i class="fa-solid fa-store w-4 text-center text-zinc-500"></i> Tienda</button>
            <button class="tool-btn w-full" onclick="window.callIframeFunction('navigate', 'courses')"><i class="fa-solid fa-graduation-cap w-4 text-center text-zinc-500"></i> Academia</button>
            <button class="tool-btn w-full" onclick="window.callIframeFunction('navigate', 'about')"><i class="fa-solid fa-circle-info w-4 text-center text-zinc-500"></i> Nosotros</button>
            <button class="tool-btn w-full" onclick="window.callIframeFunction('navigate', 'contact')"><i class="fa-regular fa-envelope w-4 text-center text-zinc-500"></i> Contacto</button>
            
            <div class="divider my-2"></div>
            
            <div class="panel-header"><i class="fa-solid fa-database text-cyan-500"></i> Base de Datos</div>
            <button class="tool-btn w-full hover:border-cyan-500/30 hover:bg-cyan-500/5 hover:text-cyan-400" onclick="window.openEditorHUD('product')"><i class="fa-solid fa-box-open w-4 text-center"></i> Añadir Producto</button>
            <button class="tool-btn w-full hover:border-violet-500/30 hover:bg-violet-500/5 hover:text-violet-400" onclick="window.openEditorHUD('course')"><i class="fa-solid fa-laptop-file w-4 text-center"></i> Añadir Curso</button>
            
            <div class="mt-auto bg-[#0a0a0c] border border-white/5 p-3 rounded-lg text-[9px] text-zinc-500 leading-relaxed">
                <span class="block text-white font-bold mb-1"><i class="fa-solid fa-terminal text-cyan-400 mr-1"></i> HUD Tips</span>
                Haz clic en cualquier elemento del lienzo para inspeccionarlo. Activa "Mover" para reorganizar etiquetas y redes sociales.
            </div>
        </div>
        
        <!-- LIENZO CENTRAL -->
        <div id="preview-container">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src=""></iframe>
            </div>
        </div>
        
        <!-- SIDEBAR DERECHA -->
        <div class="sidebar-right hide-scrollbar">
            <div id="properties-panel" class="w-full h-full flex flex-col items-center justify-center text-zinc-600 text-[10px] text-center p-6 bg-[#070709]">
                <div class="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/5">
                    <i class="fa-solid fa-crosshairs text-lg text-zinc-500"></i>
                </div>
                <p class="font-medium text-zinc-400">Selecciona un nodo<br>en el lienzo.</p>
            </div>
        </div>
    </div>
</div>

<!-- MODAL EDITOR DE BASE DE DATOS (HUD) -->
<div id="db-editor-modal" class="hud-modal">
    <div class="hud-modal-content w-full max-w-[420px] p-6 max-h-[85vh] overflow-y-auto hide-scrollbar flex flex-col relative">
        <button onclick="window.closeEditorHUD()" class="absolute top-4 right-4 text-zinc-500 hover:text-white w-8 h-8 flex items-center justify-center rounded-full bg-black border border-white/5 transition-colors"><i class="fa-solid fa-xmark"></i></button>
        <h3 id="db-modal-title" class="text-white font-bold text-sm mb-5 tracking-wide flex items-center gap-2 uppercase"></h3>
        
        <div id="db-form-container" class="flex flex-col gap-3.5">
            <!-- Inyectado via JS -->
        </div>
        
        <div class="flex gap-2 mt-6 pt-4 border-t border-white/5">
            <button onclick="window.saveDbItem()" id="db-save-btn" class="flex-1 bg-white text-black font-bold py-2.5 rounded-lg hover:bg-zinc-200 transition-colors text-xs shadow-[0_0_15px_rgba(255,255,255,0.1)]">Guardar en Nube</button>
        </div>
    </div>
</div>

<!-- MODAL EXPLORADOR DE GALERÍA -->
<div id="gallery-modal" class="hud-modal z-[10000]">
    <div class="hud-modal-content w-full max-w-3xl p-6 h-[75vh] flex flex-col">
        <div class="flex justify-between items-center mb-4 shrink-0">
            <h3 class="text-white font-bold text-sm uppercase tracking-wider"><i class="fa-solid fa-images text-cyan-400 mr-2"></i> Repositorio Visual</h3>
            <button onclick="window.closeGallery()" class="text-zinc-500 hover:text-white w-7 h-7 bg-[#030303] border border-white/5 rounded-md flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>
        <div id="gallery-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 overflow-y-auto hide-scrollbar flex-1 p-3 rounded-xl border border-white/5 bg-[#030303]">
            <!-- Inyectado via JS -->
        </div>
    </div>
</div>

<!-- MODAL DE ICONOS SOCIALES -->
<div id="icon-picker-modal" class="hud-modal">
    <div class="hud-modal-content w-full max-w-[340px] p-6">
        <h3 class="text-white font-bold text-xs mb-4 uppercase tracking-wider"><i class="fa-solid fa-icons text-cyan-400 mr-2"></i> Añadir Red Social</h3>
        <div class="grid grid-cols-4 gap-2.5 mb-5" id="social-grid">
            <button onclick="window.selectSocialIcon('fa-brands fa-facebook-f', 'facebook', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-[#1877f2] hover:text-[#1877f2] transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(24,119,242,0.2)]"><i class="fa-brands fa-facebook-f text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-instagram', 'instagram', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-[#e1306c] hover:text-[#e1306c] transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(225,48,108,0.2)]"><i class="fa-brands fa-instagram text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-whatsapp', 'whatsapp', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-[#25d366] hover:text-[#25d366] transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(37,211,102,0.2)]"><i class="fa-brands fa-whatsapp text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-tiktok', 'tiktok', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-white hover:text-white transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(255,255,255,0.2)]"><i class="fa-brands fa-tiktok text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-youtube', 'youtube', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-[#ff0000] hover:text-[#ff0000] transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(255,0,0,0.2)]"><i class="fa-brands fa-youtube text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-x-twitter', 'twitter', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-white hover:text-white transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(255,255,255,0.2)]"><i class="fa-brands fa-x-twitter text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-linkedin-in', 'linkedin', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-[#0a66c2] hover:text-[#0a66c2] transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(10,102,194,0.2)]"><i class="fa-brands fa-linkedin-in text-lg pointer-events-none"></i></button>
            <button onclick="window.selectSocialIcon('fa-brands fa-telegram', 'telegram', this)" class="social-opt p-3 bg-[#030303] border border-white/5 rounded-lg hover:border-[#0088cc] hover:text-[#0088cc] transition-all text-zinc-500 hover:shadow-[0_0_10px_rgba(0,136,204,0.2)]"><i class="fa-brands fa-telegram text-lg pointer-events-none"></i></button>
        </div>
        <label class="text-[9px] text-zinc-500 font-bold mb-1.5 block uppercase tracking-wider">URL de Enlace</label>
        <input type="text" id="social-url-input" placeholder="Ej: https://..." class="w-full bg-[#030303] border border-white/5 p-2.5 rounded-lg text-white mb-5 outline-none focus:border-cyan-400 text-xs font-mono">
        <button onclick="window.confirmAddSocial()" class="w-full bg-white text-black font-bold py-2.5 rounded-lg hover:bg-zinc-200 transition-colors text-xs shadow-md">Acoplar al HUD</button>
    </div>
</div>

<script type="module">
    // Control de versiones (Hard Reset Automático)
    const BUILDER_VERSION = '7.1.0'; 
    if (localStorage.getItem('admin_builder_version') !== BUILDER_VERSION) {
        localStorage.clear(); sessionStorage.clear();
        localStorage.setItem('admin_builder_version', BUILDER_VERSION);
        window.location.href = window.location.pathname + '?v=' + new Date().getTime();
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signInWithCustomToken, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", authDomain: "multiprintt-cc0f1.firebaseapp.com", projectId: "multiprintt-cc0f1", storageBucket: "multiprintt-cc0f1.firebasestorage.app", messagingSenderId: "626369594335", appId: "1:626369594335:web:711aac8c65197a0dceba6a" };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = "multiprintt-web";

    // Variables Estado DB Editor
    window.currentEditorState = { type: null, id: null, data: null };
    window.targetGalleryInput = null;

    window.showToast = function(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        let icon = '<i class="fa-solid fa-check text-cyan-400 text-sm"></i>';
        toast.className = 'custom-toast';
        if (type === 'error') { toast.classList.add('error'); icon = '<i class="fa-solid fa-xmark text-red-500 text-sm"></i>'; } 
        else if (type === 'warning') { toast.classList.add('warning'); icon = '<i class="fa-solid fa-exclamation text-amber-500 text-sm"></i>'; }
        toast.innerHTML = `${icon} <span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3500);
    }

    window.saveDbItem = async function() {
        const { type, id } = window.currentEditorState;
        const btn = document.getElementById('db-save-btn');
        let originalText = btn.innerText;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Operando...';
        
        if (type === 'testimonial') {
            let newData = {
                src: document.getElementById('db-t-vid').value,
                name: document.getElementById('db-t-name').value,
                role: document.getElementById('db-t-role').value,
                quote: document.getElementById('db-t-quote').value
            };
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_TESTIMONIAL', data: newData }, '*');
            window.closeEditorHUD();
            btn.innerText = originalText;
            window.showToast('Nodo Testimonio Inyectado en Layout.');
            return;
        }

        try {
            let docId = id || 'item_' + Date.now();
            let dataToSave = {};
            
            if (type === 'product') {
                dataToSave = {
                    name: document.getElementById('db-p-name').value,
                    category: document.getElementById('db-p-cat').value,
                    price: parseFloat(document.getElementById('db-p-price').value) || 0,
                    image: document.getElementById('db-p-img').value,
                    images: document.getElementById('db-p-img').value.split(',').map(s=>s.trim()).filter(s=>s),
                    isPromo: document.getElementById('db-p-promo').checked
                };
            } else if (type === 'course') {
                dataToSave = {
                    title: document.getElementById('db-c-title').value,
                    desc: document.getElementById('db-c-desc').value,
                    schedule: document.getElementById('db-c-schedule').value,
                    price: document.getElementById('db-c-price').value,
                    image: document.getElementById('db-c-img').value,
                    isMasterclass: document.getElementById('db-c-master').checked
                };
            }
            
            const collectionName = type === 'product' ? 'products' : 'courses';
            await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', collectionName, docId), dataToSave, { merge: true });
            
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_UPDATED', itemType: type, id: docId, data: dataToSave }, '*');
            
            window.showToast(`Entidad ${type.toUpperCase()} sincronizada en Nube.`);
            window.closeEditorHUD();
        } catch (error) {
            window.showToast('Error de DB: ' + error.message, 'error');
        }
        btn.innerText = originalText;
    }

    window.addEventListener('message', async (event) => {
        const data = event.data;
        if (data.type === 'APP_READY') { document.getElementById('site-frame').contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, '*'); }
        if (data.type === 'ELEMENT_SELECTED') { renderPropertiesPanel(data); }
        if (data.type === 'CLEAR_SELECTION') { document.getElementById('properties-panel').innerHTML = '<div class="w-full h-full flex flex-col items-center justify-center text-zinc-600 text-[10px] text-center p-6 bg-[#070709]"><div class="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/5"><i class="fa-solid fa-crosshairs text-lg text-zinc-500"></i></div><p class="font-medium text-zinc-400">Selecciona un nodo<br>en el lienzo.</p></div>'; }
        
        if (data.type === 'OPEN_ICON_PICKER') { document.getElementById('icon-picker-modal').classList.add('show'); }
        if (data.type === 'OPEN_EDITOR') { window.openEditorHUD(data.editorType, data.itemId, data.itemData); }
        
        if (data.type === 'DELETE_DB_ITEM') {
            if(!confirm('⚠️ PURGA DE DATOS: ¿Eliminar entidad permanentemente de la nube?')) return;
            try {
                const collectionName = data.itemType === 'product' ? 'products' : 'courses';
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', collectionName, data.itemId));
                document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_DELETED_SUCCESS', itemType: data.itemType, id: data.itemId }, '*');
                window.showToast(`Entidad eliminada de DB.`);
            } catch (e) { window.showToast('Error DB: ' + e.message, 'error'); }
        }

        if (data.type === 'RESIZE_UPDATE') {
            const wInput = document.getElementById('inp-width'); if(wInput) wInput.value = data.width;
            const hInput = document.getElementById('inp-height'); if(hInput) hInput.value = data.height;
        }
        if (data.type === 'SAVE_DONE') { 
            const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span>Desplegar Cambios</span>'; 
            window.showToast(data.msg || 'Despliegue estructural exitoso.'); 
            const iframe = document.getElementById('site-frame');
            let baseSrc = iframe.src.split('?')[0];
            iframe.src = baseSrc + '?v=' + new Date().getTime();
        }
        if (data.type === 'SAVE_ERROR') { 
            const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span>Desplegar Cambios</span>'; 
            window.showToast('Fallo en despliegue: ' + data.msg, 'error'); 
        }

        // GUARDADO PROXY LAYOUT
        if (data.type === 'SAVE_FULL_LAYOUT') {
            try { 
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'layout'), { zones: data.layoutData, prodOrder: data.prodOrder, courseOrder: data.courseOrder }, { merge: true }); 
                const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span>Desplegar Cambios</span>'; 
                window.showToast('Layout Desplegado Exitosamente.'); 
            } 
            catch(e) { window.showToast('Fallo escritura Layout: ' + e.message, 'error'); }
        }
        // RESET PROXY LAYOUT
        if (data.type === 'RESET_TEMPLATE') {
            try { 
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'layout')); 
                window.showToast('Layout Purgado a Default. Reiniciando Iframe...'); 
                document.getElementById('site-frame').contentWindow.location.reload();
            } 
            catch(e) { window.showToast('Fallo Purga: ' + e.message, 'error'); }
        }
    });

                    <label class="inspector-label">Tamaño</label>
                    <select onchange="window.updateStyle('textSize', this.value)" class="inspector-input">
                        <option value="">Heredado</option><option value="text-xs">Extra Pequeño</option><option value="text-sm">Pequeño</option><option value="text-base">Normal</option><option value="text-lg">Grande</option><option value="text-xl">XL</option><option value="text-2xl">2XL</option><option value="text-4xl">4XL</option><option value="text-6xl">6XL</option>
                    </select>
                </div>
                <div>
                    <label class="inspector-label">Grosor</label>
                    <select onchange="window.updateStyle('fontWeight', this.value)" class="inspector-input">
                        <option value="">Heredado</option><option value="font-light">Ligero</option><option value="font-normal">Normal</option><option value="font-medium">Medio</option><option value="font-bold">Negrita</option><option value="font-extrabold">Extra Negrita</option>
                    </select>
                </div>
                <div>
                    <label class="inspector-label">Alineación</label>
                    <div class="flex bg-[#030303] p-1 rounded-md border border-white/5 gap-0.5">
                        <button onclick="window.updateStyle('textAlign', 'text-left'); this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active')); this.classList.add('active');" class="align-btn active"><i class="fa-solid fa-align-left text-[10px]"></i></button>
                        <button onclick="window.updateStyle('textAlign', 'text-center'); this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active')); this.classList.add('active');" class="align-btn"><i class="fa-solid fa-align-center text-[10px]"></i></button>
                        <button onclick="window.updateStyle('textAlign', 'text-right'); this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active')); this.classList.add('active');" class="align-btn"><i class="fa-solid fa-align-right text-[10px]"></i></button>
                    </div>
                </div>
            </div>
        </div>`;

        html += `<div class="acc-item">
            <div class="acc-header" onclick="window.toggleAccordion(this)"><span><i class="fa-solid fa-ruler-combined w-4 text-center mr-1 text-zinc-600"></i> Caja / Layout</span> <i class="fa-solid fa-chevron-down"></i></div>
            <div class="acc-content">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="inspector-label">Ancho (W)</label><div class="input-group"><input type="text" id="inp-width" oninput="window.updateStyle('width', this.value)" value="${initialStyles.width || ''}" placeholder="auto"></div></div>
                    <div><label class="inspector-label">Alto (H)</label><div class="input-group"><input type="text" id="inp-height" oninput="window.updateStyle('height', this.value)" value="${initialStyles.height || ''}" placeholder="auto"></div></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="inspector-label">Padding</label><div class="input-group"><input type="text" oninput="window.updateStyle('padding', this.value)" value="${initialStyles.padding || ''}" placeholder="0px"></div></div>
                    <div><label class="inspector-label">Margen</label><div class="input-group"><input type="text" oninput="window.updateStyle('margin', this.value)" value="${initialStyles.margin || ''}" placeholder="0 auto"></div></div>
                </div>
            </div>
        </div>`;

        let rgbToHex = (rgbStr) => { if(!rgbStr || !rgbStr.includes('rgb')) return '#ffffff'; let a = rgbStr.split("(")[1].split(")")[0].split(","); return "#" + a.map(x => { x = parseInt(x).toString(16); return (x.length==1) ? "0"+x : x; }).join("").slice(0,6); };
        let initColor = rgbToHex(initialStyles.color); let initBg = initialStyles.bg && initialStyles.bg.includes('rgb') ? rgbToHex(initialStyles.bg) : '#000000';

        html += `<div class="acc-item">
            <div class="acc-header" onclick="window.toggleAccordion(this)"><span><i class="fa-solid fa-palette w-4 text-center mr-1 text-zinc-600"></i> Diseño Visual</span> <i class="fa-solid fa-chevron-down"></i></div>
            <div class="acc-content">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="inspector-label">Color Text</label><input type="color" value="${initColor}" oninput="window.updateStyle('color', this.value)" class="color-picker"></div>
                    <div><label class="inspector-label">Fondo (Bg)</label><input type="color" value="${initBg}" oninput="window.updateStyle('bg', this.value)" class="color-picker"></div>
                </div>`;
                
        if (data.hasTheme) {
            html += `<div><label class="inspector-label">Color Glow (Tema)</label>
                <select onchange="window.updateStyle('theme', this.value)" class="inspector-input font-bold" style="color: ${data.currentTheme === 'pink' ? '#ff2da8' : data.currentTheme === 'violet' ? '#735cff' : data.currentTheme === 'amber' ? '#f59e0b' : '#25d8ff'}">
                    <option value="cyan" ${data.currentTheme === 'cyan' ? 'selected' : ''}>Cyan</option>
                    <option value="pink" ${data.currentTheme === 'pink' ? 'selected' : ''}>Rosa</option>
                    <option value="violet" ${data.currentTheme === 'violet' ? 'selected' : ''}>Violeta</option>
                    <option value="amber" ${data.currentTheme === 'amber' ? 'selected' : ''}>Ámbar</option>
                    <option value="emerald" ${data.currentTheme === 'emerald' ? 'selected' : ''}>Esmeralda</option>
                </select>
            </div>`;
        }
        html += `<div><label class="inspector-label">Radio de Borde (px)</label><div class="input-group"><input type="text" oninput="window.updateStyle('radius', this.value)" value="${initialStyles.radius || ''}" placeholder="0px"></div></div>
            </div>
        </div>`;
        html += `<div class="p-4 mt-2"><button onclick="window.deleteElement()" class="w-full py-2.5 rounded-lg bg-red-500/10 text-red-500 border border-red-500/20 text-[10px] font-bold hover:bg-red-500 hover:text-white transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-trash-can"></i> Purgar Nodo</button></div>`;

        panel.innerHTML = html;
        panel.className = "w-full flex-1 overflow-y-auto hide-scrollbar bg-transparent rounded-none border-none max-h-none p-0";
    }
</script>
</body>
</html>
