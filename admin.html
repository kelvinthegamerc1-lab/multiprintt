<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Multiprintt | Visual Builder Premium</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    body { background-color: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(37,216,255,0.5); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    #auth-screen { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .glass-panel { background: #0a0a0c; border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; box-shadow: 0 40px 80px -20px rgba(0,0,0,1); }
    
    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    .topbar { height: 56px; background: #0a0a0c; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 50;}
    
    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 220px; background: #0a0a0c; border-right: 1px solid rgba(255,255,255,0.04); padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; z-index:10; }
    .sidebar-right { width: 280px; background: #0a0a0c; border-left: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; overflow-y: auto; z-index:10; }
    
    #preview-container { flex: 1; background: #020202; display: flex; align-items: center; justify-content: center; position: relative; padding: 24px; overflow: auto; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
    #preview-wrapper { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); background: #070709; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 30px 60px rgba(0,0,0,0.9); display: flex; flex-direction: column;}
    
    .device-desktop { width: 100% !important; min-width: 900px; height: 100% !important; border-radius: 16px !important; }
    .device-tablet { width: 820px !important; height: 1180px !important; border-radius: 24px; margin: auto; border: 12px solid #1a1a1a !important;}
    .device-mobile { width: 390px !important; height: 844px !important; border-radius: 40px; margin: auto; border: 14px solid #1a1a1a !important;}
    #site-frame { width: 100%; height: 100%; border: none; flex-grow: 1; background: #070709; border-radius: inherit;}
    
    .device-btn { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #737373; transition: all 0.2s; cursor: pointer; font-size: 14px;}
    .device-btn.active { background: rgba(37,216,255,0.1); color: #25d8ff; box-shadow: inset 0 0 0 1px rgba(37,216,255,0.2);}
    .device-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }

    .tool-btn { background: #121215; border: 1px solid rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 8px; color: #d4d4d8; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500;}
    .tool-btn:hover { background: #1a1a1e; border-color: rgba(37,216,255,0.3); color: white; transform: translateY(-1px);}
    
    .panel-header { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: #737373; font-weight: 800; margin-bottom: 8px; margin-top: 12px; display: flex; align-items: center; gap: 8px; }
    
    .inspector-label { font-size: 9px; font-weight: 600; color: #737373; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;}
    .inspector-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 6px; color: white; outline: none; font-size: 11px; transition: all 0.2s; font-family: 'Inter', sans-serif;}
    .inspector-input:focus { border-color: #25d8ff; background: #050505; box-shadow: 0 0 0 2px rgba(37,216,255,0.15);}
    
    .acc-item { border-bottom: 1px solid rgba(255,255,255,0.03); }
    .acc-header { padding: 14px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #a1a1aa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #0d0d11; transition: all 0.2s; border-left: 2px solid transparent;}
    .acc-header:hover { background: #141419; color: #fff; }
    .acc-item.active .acc-header { color: #25d8ff; border-left-color: #25d8ff; background: rgba(37,216,255,0.02);}
    .acc-content { padding: 16px; display: none; background: #0a0a0c; flex-direction: column; gap: 12px; }
    .acc-item.active .acc-content { display: flex; }

    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .custom-toast { background: #121215; border: 1px solid rgba(255,255,255,0.08); border-left: 3px solid #25d8ff; color: white; padding: 14px 20px; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500; transform: translateX(120%); opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; }
    .custom-toast.show { transform: translateX(0); opacity: 1; }
    .custom-toast.error { border-left-color: #ef4444; }
</style>
</head>
<body>

<div id="toast-container"></div>

<div id="auth-screen">
    <div class="glass-panel p-8 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-500/30 rounded-[16px] flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(37,216,255,0.15)]">
            <i class="fa-solid fa-fingerprint text-2xl text-cyan-400"></i>
        </div>
        <h1 class="text-xl font-extrabold mb-1 tracking-tight">Acceso Restringido <span class="text-cyan-400 text-[8px] bg-cyan-500/10 border border-cyan-500/20 px-2 py-0.5 rounded ml-1 align-top uppercase tracking-widest">Admin</span></h1>
        <p class="text-zinc-500 text-[11px] mb-6">Persistencia de sesión segura.</p>
        <div class="space-y-3">
            <input type="email" id="loginUser" placeholder="Correo Administrativo" class="w-full bg-black border border-white/10 p-3 rounded-lg text-xs text-white outline-none focus:border-cyan-400 transition-colors">
            <input type="password" id="loginPass" placeholder="Contraseña" class="w-full bg-black border border-white/10 p-3 rounded-lg text-xs text-white outline-none focus:border-cyan-400 transition-colors">
            <button onclick="window.attemptLogin()" id="btn-login" class="w-full bg-white text-black font-bold py-3 rounded-lg hover:bg-zinc-200 transition-colors text-xs mt-2">Iniciar Sesión</button>
        </div>
    </div>
</div>

<div id="db-modal" class="hidden fixed inset-0 z-[9999] bg-black/90 backdrop-blur-md items-center justify-center opacity-0 transition-opacity duration-300">
    <div id="db-content" class="bg-[#0a0a0c] border border-white/10 w-full max-w-lg rounded-2xl shadow-2xl p-6 transform scale-95 transition-transform duration-300 flex flex-col">
        <h3 id="db-modal-title" class="text-white font-bold text-lg mb-5 flex items-center gap-2 border-b border-white/5 pb-4"><i class="fa-solid fa-database text-cyan-400"></i> Editar Registro</h3>
        
        <div class="space-y-4 overflow-y-auto max-h-[60vh] pr-2 hide-scrollbar">
            <div id="db-title-container">
                <label id="db-title-label" class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-1.5 block">Nombre / Título</label>
                <input type="text" id="db-title" class="w-full bg-black border border-white/10 p-3 rounded-lg text-white text-xs outline-none focus:border-cyan-400">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div id="db-price-container">
                    <label id="db-price-label" class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-1.5 block">Precio / Valor</label>
                    <input type="text" id="db-price" class="w-full bg-black border border-white/10 p-3 rounded-lg text-white text-xs outline-none focus:border-cyan-400">
                </div>
                <div id="db-cat-container">
                    <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-1.5 block">Categoría</label>
                    <select id="db-category" class="w-full bg-black border border-white/10 p-3 rounded-lg text-white text-xs outline-none focus:border-cyan-400">
                        <option value="mas-vendidos">Más Vendidos</option>
                        <option value="promocionales">Promocionales</option>
                        <option value="textil">Textil</option>
                        <option value="jarros">Jarros & Thermos</option>
                        <option value="imp-general">Imp. General</option>
                        <option value="packs">Packs</option>
                    </select>
                </div>
            </div>
            
            <div id="db-desc-container">
                <label id="db-desc-label" class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-1.5 block">Descripción</label>
                <textarea id="db-desc" rows="3" class="w-full bg-black border border-white/10 p-3 rounded-lg text-white text-xs outline-none focus:border-cyan-400 resize-none"></textarea>
            </div>
            
            <div id="db-img-container">
                <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider mb-1.5 block">URL Multimedia (Imagen / Video)</label>
                <div class="flex gap-2">
                    <input type="text" id="db-img" class="flex-1 bg-black border border-white/10 p-3 rounded-lg text-white text-xs outline-none focus:border-cyan-400 font-mono">
                    <button onclick="window.openGallery()" class="px-4 bg-white/5 border border-white/10 rounded-lg hover:bg-cyan-500/20 hover:text-cyan-400 hover:border-cyan-500/30 transition-all text-xs font-bold text-zinc-300 whitespace-nowrap"><i class="fa-solid fa-image mr-1"></i> Galería</button>
                </div>
            </div>

            <div id="db-check-container" class="flex items-center gap-3 bg-white/5 p-3 rounded-lg border border-white/5">
                <input type="checkbox" id="db-checkbox" class="w-4 h-4 accent-cyan-400 cursor-pointer">
                <label id="db-check-label" class="text-xs text-white font-medium cursor-pointer select-none" for="db-checkbox">Opción Especial</label>
            </div>
        </div>

        <div class="flex gap-3 mt-6 pt-4 border-t border-white/5">
            <button onclick="window.saveDbItem()" class="flex-1 bg-cyan-500 text-black font-bold py-3 rounded-xl hover:bg-cyan-400 transition-colors text-xs shadow-[0_0_15px_rgba(37,216,255,0.2)]">Guardar en Base de Datos</button>
            <button onclick="window.closeDbModal()" class="px-6 bg-transparent border border-white/10 text-zinc-400 font-bold py-3 rounded-xl hover:text-white transition-colors text-xs">Cancelar</button>
        </div>
    </div>
</div>

<div id="gallery-modal" class="hidden fixed inset-0 z-[10000] bg-black/95 backdrop-blur-xl items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="bg-[#0a0a0c] border border-white/10 w-full max-w-2xl rounded-2xl p-6 flex flex-col h-[70vh]">
        <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-3">
            <h3 class="text-white font-bold"><i class="fa-solid fa-folder-open text-amber-400 mr-2"></i> Explorador de Recursos</h3>
            <button onclick="window.closeGallery()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div id="gallery-grid" class="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 gap-3 hide-scrollbar pr-2">
            <!-- Rellenado dinámicamente -->
        </div>
    </div>
</div>

<div id="builder-ui">
    <div class="topbar">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 bg-cyan-500 rounded-lg flex items-center justify-center shadow-[0_0_10px_rgba(37,216,255,0.4)]">
                <i class="fa-solid fa-bolt text-black text-[12px]"></i>
            </div>
            <span class="font-bold text-[13px] tracking-wide text-white">Visual <span class="text-cyan-400">Builder</span></span>
        </div>
        
        <div class="flex items-center gap-1 bg-[#121215] p-1 border border-white/5 rounded-lg shadow-inner">
            <button class="device-btn active" onclick="window.setDevice('desktop', this)"><i class="fa-solid fa-desktop"></i></button>
            <button class="device-btn" onclick="window.setDevice('tablet', this)"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button class="device-btn" onclick="window.setDevice('mobile', this)"><i class="fa-solid fa-mobile-screen-button"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <button class="tool-btn bg-pink-500/10 border-pink-500/20 text-pink-400 hover:bg-pink-500 hover:text-white" onclick="window.toggleDragMode(this)">
                <i class="fa-solid fa-up-down-left-right"></i> <span class="hidden sm:inline">Mover / Ordenar</span>
            </button>
            <button class="tool-btn" id="publish-btn" onclick="window.publishChanges()">
                <i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span class="hidden sm:inline">Guardar Web</span>
            </button>
            <button class="tool-btn hover:bg-red-500/10 hover:text-red-500 hover:border-red-500/30 px-3" onclick="window.logout()" title="Cerrar Sesión"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
    
    <div class="workspace">
        <div class="sidebar">
            <div class="panel-header"><i class="fa-solid fa-compass"></i> Páginas</div>
            <button class="tool-btn w-full justify-start border-none bg-transparent hover:bg-white/5" onclick="window.callIframeFunction('navigate', 'catalog')"><div class="w-5 text-center"><i class="fa-solid fa-store text-zinc-500"></i></div> Catálogo</button>
            <button class="tool-btn w-full justify-start border-none bg-transparent hover:bg-white/5" onclick="window.callIframeFunction('navigate', 'courses')"><div class="w-5 text-center"><i class="fa-solid fa-graduation-cap text-zinc-500"></i></div> Academia</button>
            <button class="tool-btn w-full justify-start border-none bg-transparent hover:bg-white/5" onclick="window.callIframeFunction('navigate', 'about')"><div class="w-5 text-center"><i class="fa-solid fa-circle-info text-zinc-500"></i></div> Nosotros</button>
            <button class="tool-btn w-full justify-start border-none bg-transparent hover:bg-white/5" onclick="window.callIframeFunction('navigate', 'contact')"><div class="w-5 text-center"><i class="fa-regular fa-envelope text-zinc-500"></i></div> Contacto</button>
            
            <div class="h-[1px] bg-white/5 w-full my-2"></div>
            
            <div class="panel-header"><i class="fa-solid fa-server text-violet-400"></i> Inventario DB</div>
            <button class="tool-btn w-full justify-start border-pink-500/20 hover:border-pink-500" onclick="window.openDbModal({}, 'product')"><div class="w-5 text-center"><i class="fa-solid fa-box-open text-pink-400"></i></div> Nuevo Producto</button>
            <button class="tool-btn w-full justify-start border-cyan-500/20 hover:border-cyan-500" onclick="window.openDbModal({}, 'course')"><div class="w-5 text-center"><i class="fa-solid fa-laptop-file text-cyan-400"></i></div> Nuevo Curso</button>
            
            <div class="mt-auto p-3 bg-zinc-900/50 border border-white/5 rounded-lg text-[9px] text-zinc-500 leading-relaxed font-medium">
                Haz clic en cualquier texto o tarjeta en la vista previa para editar su contenido.
            </div>
            <button class="mt-2 text-[9px] text-red-400/50 hover:text-red-400 text-center uppercase tracking-widest py-2 transition-colors" onclick="window.resetTemplateConfirm()">Reset de Fábrica</button>
        </div>
        
        <div id="preview-container">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src=""></iframe>
            </div>
        </div>
        
        <div class="sidebar-right hide-scrollbar">
            <div id="properties-panel" class="w-full h-full flex flex-col items-center justify-center text-zinc-600 text-xs text-center p-6 bg-[#0a0a0c] m-auto">
                <i class="fa-solid fa-pen-nib text-3xl mb-3 text-white/5"></i>
                <p class="font-medium text-[11px] text-zinc-500">Selecciona un elemento<br>para inspeccionarlo.</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    const BUILDER_VERSION = '7.0.0'; 
    if (localStorage.getItem('admin_builder_version') !== BUILDER_VERSION) {
        localStorage.clear(); sessionStorage.clear();
        localStorage.setItem('admin_builder_version', BUILDER_VERSION);
        window.location.href = window.location.pathname + '?v=' + new Date().getTime();
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", authDomain: "multiprintt-cc0f1.firebaseapp.com", projectId: "multiprintt-cc0f1", storageBucket: "multiprintt-cc0f1.firebasestorage.app", messagingSenderId: "626369594335", appId: "1:626369594335:web:711aac8c65197a0dceba6a" };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = "multiprintt-web";

    let currentEditorType = '';
    let currentItemId = '';

    window.showToast = function(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        let icon = '<i class="fa-solid fa-check-circle text-cyan-400 text-base"></i>';
        toast.className = 'custom-toast';
        if (type === 'error') { toast.classList.add('error'); icon = '<i class="fa-solid fa-triangle-exclamation text-red-500 text-base"></i>'; } 
        toast.innerHTML = `${icon} <span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
    }

    onAuthStateChanged(auth, (user) => {
        if (user && !user.isAnonymous) {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('builder-ui').style.display = 'flex';
                const iframe = document.getElementById('site-frame');
                if (!iframe.src || iframe.src === window.location.href || iframe.src.includes('about:blank')) {
                    iframe.src = 'index.html?nocache=' + new Date().getTime();
                }
            }, 300);
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('auth-screen').style.opacity = '1';
            document.getElementById('builder-ui').style.display = 'none';
        }
    });

    window.attemptLogin = async function() {
        const email = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value; const btn = document.getElementById('btn-login');
        if (!email || !pass) return window.showToast("Datos inválidos.", "error");
        try { 
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true; 
            await setPersistence(auth, browserSessionPersistence); // Seguridad Sesión
            await signInWithEmailAndPassword(auth, email, pass); 
        } catch (error) { window.showToast("Acceso denegado.", "error"); btn.textContent = "Iniciar Sesión"; btn.disabled = false; }
    };

    window.logout = async function() { await signOut(auth); location.reload(); };

    window.setDevice = function(type, btn) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.getElementById('preview-wrapper').className = 'device-' + type;
    };
    
    window.callIframeFunction = function(fnName, ...args) {
        const iframe = document.getElementById('site-frame');
        if (iframe && iframe.contentWindow && typeof iframe.contentWindow[fnName] === 'function') iframe.contentWindow[fnName](...args);
    };

    let isDragMode = false;
    window.toggleDragMode = function(btn) {
        isDragMode = !isDragMode;
        if(isDragMode) { btn.classList.add('bg-pink-500', 'text-white', 'border-pink-400'); btn.classList.remove('bg-pink-500/10', 'text-pink-400'); } 
        else { btn.classList.remove('bg-pink-500', 'text-white', 'border-pink-400'); btn.classList.add('bg-pink-500/10', 'text-pink-400'); }
        document.getElementById('site-frame').contentWindow.postMessage({type: 'TOGGLE_DRAG', state: isDragMode}, '*');
    }

    window.publishChanges = function() {
        const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-cyan-400"></i> <span class="hidden sm:inline">Guardando...</span>';
        document.getElementById('site-frame').contentWindow.postMessage({type: 'SAVE_FULL_LAYOUT'}, '*');
    }

    window.resetTemplateConfirm = function() {
        if(confirm("⚠️ ¿Restablecer toda la web visual a valores de fábrica?")) { document.getElementById('site-frame').contentWindow.postMessage({type: 'RESET_TEMPLATE'}, '*'); }
    }

    window.openDbModal = function(data = {}, type = 'product', id = '') {
        currentEditorType = type; currentItemId = id || ('id_' + Date.now());
        
        const titleEl = document.getElementById('db-modal-title');
        const catContainer = document.getElementById('db-cat-container');
        const priceLabel = document.getElementById('db-price-label');
        const titleLabel = document.getElementById('db-title-label');
        const descLabel = document.getElementById('db-desc-label');
        const checkLabel = document.getElementById('db-check-label');
        
        document.getElementById('db-title').value = data.name || data.title || '';
        document.getElementById('db-desc').value = data.desc || data.quote || '';
        document.getElementById('db-price').value = data.price || data.role || '';
        document.getElementById('db-img').value = data.image || data.src || '';
        document.getElementById('db-category').value = data.category || 'mas-vendidos';
        document.getElementById('db-checkbox').checked = false;
        
        document.getElementById('db-price-container').style.display = 'block';
        document.getElementById('db-check-container').style.display = 'flex';

        if (type === 'product') {
            titleEl.innerHTML = '<i class="fa-solid fa-box-open text-pink-400"></i> Editor de Producto';
            catContainer.style.display = 'block';
            priceLabel.innerText = 'Precio ($)';
            titleLabel.innerText = 'Nombre';
            descLabel.innerText = 'Descripción';
            checkLabel.innerText = 'Marcar como Promoción';
            document.getElementById('db-checkbox').checked = !!data.isPromo;
        } else if (type === 'course') {
            titleEl.innerHTML = '<i class="fa-solid fa-graduation-cap text-cyan-400"></i> Editor de Curso';
            catContainer.style.display = 'none';
            document.getElementById('db-price-container').style.display = 'none'; // Sin precio en DB Curso
            titleLabel.innerText = 'Título';
            descLabel.innerText = 'Descripción Corta';
            checkLabel.innerText = 'Etiqueta Masterclass';
            document.getElementById('db-checkbox').checked = data.isMasterclass !== false;
        } else if (type === 'testimonial') {
            titleEl.innerHTML = '<i class="fa-solid fa-video text-violet-400"></i> Editor de Testimonio';
            catContainer.style.display = 'none';
            document.getElementById('db-check-container').style.display = 'none';
            priceLabel.innerText = 'Rol (Ej: Caso de Éxito)';
            titleLabel.innerText = 'Nombre del Alumno';
            descLabel.innerText = 'Frase Destacada';
            document.getElementById('db-title').value = data.name || '';
        }

        const m = document.getElementById('db-modal'); m.classList.remove('hidden'); m.classList.add('flex');
        setTimeout(() => { m.classList.add('opacity-100'); document.getElementById('db-content').classList.remove('scale-95'); }, 10);
    };

    window.closeDbModal = function() {
        const m = document.getElementById('db-modal'); m.classList.remove('opacity-100'); document.getElementById('db-content').classList.add('scale-95');
        setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300);
    };

    window.saveDbItem = async function() {
        let payload = {};
        if (currentEditorType === 'product') {
            payload = { name: document.getElementById('db-title').value, price: parseFloat(document.getElementById('db-price').value)||0, category: document.getElementById('db-category').value, image: document.getElementById('db-img').value, isPromo: document.getElementById('db-checkbox').checked };
        } else if (currentEditorType === 'course') {
            payload = { title: document.getElementById('db-title').value, desc: document.getElementById('db-desc').value, image: document.getElementById('db-img').value, isMasterclass: document.getElementById('db-checkbox').checked };
        } else if (currentEditorType === 'testimonial') {
            payload = { src: document.getElementById('db-img').value, name: document.getElementById('db-title').value, role: document.getElementById('db-price').value, quote: document.getElementById('db-desc').value };
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_TESTIMONIAL', data: payload }, '*');
            window.closeDbModal(); window.showToast('Testimonio Actualizado en UI'); return;
        }

        const colName = currentEditorType === 'product' ? 'products' : 'courses';
        try {
            await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', colName, currentItemId), payload, { merge: true });
            document.getElementById('site-frame').contentWindow.postMessage({type: 'DB_UPDATED', itemType: currentEditorType, id: currentItemId, data: payload}, '*');
            window.closeDbModal(); window.showToast('Registro guardado');
        } catch(e) { window.showToast(e.message, 'error'); }
    };

    window.deleteDbItem = async function(type, id) {
        const colName = type === 'product' ? 'products' : 'courses';
        try {
            await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', colName, id));
            document.getElementById('site-frame').contentWindow.postMessage({type: 'DB_DELETED_SUCCESS', itemType: type, id: id}, '*');
            window.showToast('Eliminado de la DB');
        } catch(e) { window.showToast(e.message, 'error'); }
    };

    window.openGallery = async function() {
        const m = document.getElementById('gallery-modal'); m.classList.remove('hidden'); m.classList.add('flex');
        setTimeout(() => m.classList.add('opacity-100'), 10);
        const grid = document.getElementById('gallery-grid'); grid.innerHTML = '<div class="col-span-full text-center py-10 text-zinc-500"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><br>Cargando...</div>';
        
        try {
            const res = await fetch('/recursos/imagenes.json');
            if(!res.ok) throw new Error();
            const data = await res.json();
            grid.innerHTML = data.map(img => `<img src="${img.url||img}" onclick="window.selectGalleryImage('${img.url||img}')" class="w-full h-24 object-cover rounded-lg cursor-pointer hover:border-2 hover:border-cyan-400 hover:scale-105 transition-all">`).join('');
        } catch(e) {
            grid.innerHTML = `<div class="col-span-full text-center text-[10px] text-zinc-500 mb-2">Imágenes por defecto (Fallback):</div>` + [1,2,3,4].map(i => `<img src="https://placehold.co/400x400/101014/ffffff?text=Muestra+${i}" onclick="window.selectGalleryImage('https://placehold.co/400x400/101014/ffffff?text=Muestra+${i}')" class="w-full h-24 object-cover rounded-lg cursor-pointer border border-white/5 hover:border-cyan-400 transition-all">`).join('');
        }
    };
    window.selectGalleryImage = function(url) { document.getElementById('db-img').value = url; window.closeGallery(); };
    window.closeGallery = function() { const m = document.getElementById('gallery-modal'); m.classList.remove('opacity-100'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300); };

    window.addEventListener('message', (event) => {
        const data = event.data;
        if (data.type === 'APP_READY') document.getElementById('site-frame').contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, '*');
        if (data.type === 'ELEMENT_SELECTED') renderPropertiesPanel(data);
        if (data.type === 'CLEAR_SELECTION') document.getElementById('properties-panel').innerHTML = '<i class="fa-solid fa-pen-nib text-3xl mb-3 text-white/5"></i><p class="font-medium text-[11px] text-zinc-500">Selecciona un elemento<br>para inspeccionarlo.</p>';
        
        if (data.type === 'OPEN_EDITOR') window.openDbModal(data.itemData, data.editorType, data.itemId);
        if (data.type === 'DELETE_DB_ITEM') { if(confirm('¿Borrar definitivamente de la Base de Datos?')) window.deleteDbItem(data.itemType, data.itemId); }
        
        if (data.type === 'RESIZE_UPDATE') {
            const wInput = document.getElementById('inp-width'); if(wInput) wInput.value = data.width;
            const hInput = document.getElementById('inp-height'); if(hInput) hInput.value = data.height;
        }
        if (data.type === 'SAVE_DONE') { 
            const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span class="hidden sm:inline">Guardar Web</span>'; 
            window.showToast(data.msg || '¡Cambios publicados!'); 
            document.getElementById('site-frame').src = document.getElementById('site-frame').src.split('?')[0] + '?v=' + new Date().getTime();
        }
        if (data.type === 'SAVE_ERROR') { 
            const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> <span class="hidden sm:inline">Guardar Web</span>'; 
            window.showToast('Error: ' + data.msg, 'error'); 
        }
    });

    window.updateText = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', text: val}, '*'); }
    window.updateHref = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', href: val}, '*'); }
    window.updateStyle = function(prop, val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_STYLE', prop: prop, value: val}, '*'); }
    window.deleteElement = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'DELETE_SELECTED_NODE'}, '*'); document.getElementById('properties-panel').innerHTML = '<i class="fa-solid fa-trash text-3xl mb-3 text-red-500/50"></i><p class="text-[11px] text-zinc-500">Eliminado</p>'; }
    window.selectParent = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_PARENT_NODE'}, '*'); }
    window.selectChild = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_CHILD_NODE'}, '*'); }
    window.toggleAccordion = function(el) { const item = el.parentElement; const isActive = item.classList.contains('active'); document.querySelectorAll('.acc-item').forEach(x => x.classList.remove('active')); if(!isActive) item.classList.add('active'); }

    function renderPropertiesPanel(data) {
        const panel = document.getElementById('properties-panel');
        let initialStyles = data.styles || {};
        
        let html = `
        <div class="w-full bg-[#0a0a0c] border-b border-white/5 p-4 flex items-center justify-between sticky top-0 z-20 shadow-md">
            <div class="text-left">
                <span class="text-cyan-400 font-bold text-[9px] uppercase tracking-widest block mb-0.5">Editando Nodo</span>
                <span class="text-white text-[11px] font-mono bg-white/5 px-2 py-0.5 rounded border border-white/10"><i class="fa-solid fa-code text-zinc-500 text-[10px] mr-1"></i> ${data.tagName}</span>
            </div>
            <div class="flex gap-1 bg-white/5 p-1 rounded-md">
                <button onclick="window.selectParent()" class="w-6 h-6 rounded bg-transparent hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-level-up-alt text-[10px]"></i></button>
                <button onclick="window.selectChild()" class="w-6 h-6 rounded bg-transparent hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-level-down-alt text-[10px]"></i></button>
            </div>
        </div>`;

        html += `<div class="acc-item active"><div class="acc-header" onclick="window.toggleAccordion(this)"><span class="flex items-center gap-2"><i class="fa-solid fa-pen-nib w-3"></i> Contenido</span> <i class="fa-solid fa-chevron-down text-[9px]"></i></div><div class="acc-content">`;
        if (!['IMG', 'VIDEO', 'SECTION', 'DIV', 'ARTICLE'].includes(data.tagName)) html += `<div><label class="inspector-label">Texto Visible</label><textarea oninput="window.updateText(this.value)" class="inspector-input min-h-[60px] resize-y">${data.text || ''}</textarea></div>`;
        if (['IMG', 'VIDEO', 'A', 'BUTTON'].includes(data.tagName) || data.href) html += `<div><label class="inspector-label">URL / Enlace</label><input type="text" oninput="window.updateHref(this.value)" value="${data.href || ''}" class="inspector-input font-mono"></div>`;
        html += `</div></div>`;

        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)"><span class="flex items-center gap-2"><i class="fa-solid fa-ruler-combined w-3"></i> Geometría</span> <i class="fa-solid fa-chevron-down text-[9px]"></i></div><div class="acc-content">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="inspector-label">W (Ancho)</label><input type="text" id="inp-width" oninput="window.updateStyle('width', this.value)" value="${initialStyles.width || ''}" class="inspector-input text-center"></div>
                    <div><label class="inspector-label">H (Alto)</label><input type="text" id="inp-height" oninput="window.updateStyle('height', this.value)" value="${initialStyles.height || ''}" class="inspector-input text-center"></div>
                </div></div></div>`;

        let rgbToHex = (r) => { if(!r || !r.includes('rgb')) return '#ffffff'; let a = r.split("(")[1].split(")")[0].split(","); return "#" + a.map(x=>{x=parseInt(x).toString(16);return (x.length==1)?"0"+x:x;}).join("").slice(0,6); };
        let initColor = rgbToHex(initialStyles.color); let initBg = (initialStyles.bg && initialStyles.bg.includes('rgb')) ? rgbToHex(initialStyles.bg) : '#000000';

        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)"><span class="flex items-center gap-2"><i class="fa-solid fa-palette w-3"></i> Estética</span> <i class="fa-solid fa-chevron-down text-[9px]"></i></div><div class="acc-content">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="inspector-label">Texto</label><input type="color" value="${initColor}" oninput="window.updateStyle('color', this.value)" class="w-full h-8 bg-black border border-white/10 rounded cursor-pointer p-0"></div>
                    <div><label class="inspector-label">Fondo</label><input type="color" value="${initBg}" oninput="window.updateStyle('bg', this.value)" class="w-full h-8 bg-black border border-white/10 rounded cursor-pointer p-0"></div>
                </div>`;
                
        if (data.hasTheme) {
            html += `<div class="mt-2"><label class="inspector-label">Tema Visual</label><select onchange="window.updateStyle('theme', this.value)" class="inspector-input"><option value="cyan" ${data.currentTheme==='cyan'?'selected':''}>Cyan Luminoso</option><option value="pink" ${data.currentTheme==='pink'?'selected':''}>Rosa Neón</option><option value="violet" ${data.currentTheme==='violet'?'selected':''}>Violeta</option><option value="amber" ${data.currentTheme==='amber'?'selected':''}>Ámbar</option><option value="emerald" ${data.currentTheme==='emerald'?'selected':''}>Esmeralda</option></select></div>`;
        }
        html += `</div></div><div class="p-4 mt-auto"><button onclick="window.deleteElement()" class="w-full py-2.5 rounded-lg bg-red-500/10 text-red-500 border border-red-500/20 text-[10px] font-bold hover:bg-red-500 hover:text-white transition-all"><i class="fa-solid fa-trash-can mr-1"></i> Eliminar Nodo</button></div>`;

        panel.innerHTML = html; panel.className = "w-full flex-1 overflow-y-auto bg-transparent rounded-none border-none max-h-none p-0";
    }
</script>
</body>
</html>
