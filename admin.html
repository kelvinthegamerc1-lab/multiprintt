<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Multiprintt | Visual Builder Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    body { background-color: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    #auth-screen { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .glass-panel { background: #0e0e11; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    .topbar { height: 54px; background: #0a0a0c; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 50;}
    
    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; background: #0a0a0c; border-right: 1px solid rgba(255,255,255,0.06); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; z-index:10; }
    .sidebar-right { width: 320px; background: #0a0a0c; border-left: 1px solid rgba(255,255,255,0.06); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; z-index:10; }
    
    #preview-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; padding: 20px; overflow: auto; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; }
    #preview-wrapper { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); background: #070709; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 30px 60px rgba(0,0,0,0.7); display: flex; flex-direction: column;}
    .device-desktop { width: 100% !important; min-width: 1024px; height: 100% !important; border-radius: 8px !important; border: 1px solid rgba(255,255,255,0.1) !important; margin: 10px; }
    .device-tablet { width: 820px !important; height: 1180px !important; border-radius: 16px; margin: auto; border: 10px solid #1a1a1a !important;}
    .device-mobile { width: 390px !important; height: 844px !important; border-radius: 36px; margin: auto; border: 12px solid #1a1a1a !important;}
    #site-frame { width: 100%; height: 100%; border: none; flex-grow: 1; background: #070709; border-radius: inherit;}
    
    .device-btn { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #737373; transition: all 0.2s; cursor: pointer; font-size: 14px;}
    .device-btn.active { background: rgba(37,216,255,0.15); color: #25d8ff; }
    #btn-mode-interact.active { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .device-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }

    .tool-btn { background: #121215; border: 1px solid rgba(255,255,255,0.08); padding: 10px 14px; border-radius: 8px; color: #e5e5e5; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500;}
    .tool-btn:hover { background: #1a1a1e; border-color: rgba(37,216,255,0.4); color: white;}
    .danger-btn { background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); color: #ef4444; }
    .danger-btn:hover { background: rgba(239,68,68,0.15); border-color: #ef4444; color: white;}
    
    .inspector-label { font-size: 10px; font-weight: 600; color: #737373; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block;}
    .inspector-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; color: white; outline: none; font-size: 12px; transition: 0.2s;}
    .inspector-input:focus { border-color: #25d8ff; background: #050505; box-shadow: 0 0 0 2px rgba(37,216,255,0.1);}
    
    .color-picker { width: 100%; height: 36px; padding: 2px; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer;}
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border: none; border-radius: 4px; }

    .panel-header { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #737373; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .divider { height: 1px; background: rgba(255,255,255,0.06); width: 100%; margin: 8px 0; }
    
    .align-btn.active { background: rgba(37,216,255,0.15); color: #25d8ff; }
</style>
</head>
<body>

<!-- Pantalla de Login -->
<div id="auth-screen">
    <div class="glass-panel p-10 w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(37,216,255,0.15)]">
            <i class="fa-solid fa-layer-group text-2xl text-cyan-400"></i>
        </div>
        <h1 class="text-xl font-bold mb-1">Visual Builder <span class="text-cyan-400 text-xs bg-cyan-500/10 px-2 py-0.5 rounded-full ml-1">PRO</span></h1>
        <p class="text-zinc-500 text-xs mb-8">Acceso Seguro Firebase Auth.</p>
        <div class="space-y-3">
            <input type="email" id="loginUser" placeholder="Correo Administrativo" class="w-full bg-black border border-white/10 p-3 rounded-lg text-sm text-white outline-none focus:border-cyan-400">
            <input type="password" id="loginPass" placeholder="Contraseña" class="w-full bg-black border border-white/10 p-3 rounded-lg text-sm text-white outline-none focus:border-pink-400">
            <button onclick="attemptLogin()" id="btn-login" class="w-full bg-white text-black font-semibold py-3 rounded-lg hover:bg-zinc-200 transition-colors shadow-lg text-sm mt-2">Iniciar Sesión</button>
        </div>
    </div>
</div>

<!-- Interfaz del Builder -->
<div id="builder-ui">
    <div class="topbar">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-gradient-to-br from-cyan-500 to-pink-500 rounded-lg flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-layer-group text-white text-sm"></i>
            </div>
            <span class="font-bold text-sm tracking-wide">Multiprintt <span class="text-zinc-500 font-normal">| Visual Builder</span></span>
        </div>
        
        <div class="flex items-center gap-2 bg-[#121215] p-1 border border-white/10 rounded-lg">
            <button class="device-btn active" onclick="setDevice('desktop', this)"><i class="fa-solid fa-desktop"></i></button>
            <button class="device-btn" onclick="setDevice('tablet', this)"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button class="device-btn" onclick="setDevice('mobile', this)"><i class="fa-solid fa-mobile-screen-button"></i></button>
        </div>

        <div class="flex items-center gap-3">
            <button class="tool-btn" onclick="toggleDragMode(this)"><i class="fa-solid fa-arrows-up-down-left-right"></i> Modo Arrastrar</button>
            <button class="tool-btn" id="publish-btn" onclick="publishChanges()"><i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> Publicar Cambios</button>
            <button class="tool-btn danger-btn" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
    
    <div class="workspace">
        <div class="sidebar">
            <div class="panel-header"><i class="fa-solid fa-boxes-stacked"></i> Tienda Base</div>
            <button class="tool-btn w-full justify-start" onclick="callIframeFunction('openEditor', 'product', null, this)"><i class="fa-solid fa-box-open"></i> Crear Producto</button>
            <button class="tool-btn w-full justify-start" onclick="callIframeFunction('openEditor', 'course', null, this)"><i class="fa-solid fa-graduation-cap"></i> Crear Curso</button>
            <div class="divider"></div>
            <div class="panel-header"><i class="fa-solid fa-sitemap"></i> Secciones</div>
            <button class="tool-btn w-full justify-start" onclick="callIframeFunction('navigate', 'catalog')"><i class="fa-solid fa-store"></i> Ir a Tienda</button>
            <button class="tool-btn w-full justify-start" onclick="callIframeFunction('navigate', 'courses')"><i class="fa-solid fa-book"></i> Ir a Academia</button>
            <button class="tool-btn w-full justify-start" onclick="callIframeFunction('navigate', 'contact')"><i class="fa-regular fa-envelope"></i> Ir a Contacto</button>
        </div>
        
        <div id="preview-container">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src="index.html"></iframe>
            </div>
        </div>
        
        <div class="sidebar-right">
            <div class="panel-header"><i class="fa-solid fa-sliders"></i> Propiedades Visuales</div>
            <div id="properties-panel" class="text-zinc-500 text-xs text-center py-10 px-4 bg-black/50 border border-white/5 rounded-lg border-dashed">
                Haz clic en cualquier elemento con borde punteado dentro de la vista previa para editar sus propiedades.
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", 
        authDomain: "multiprintt-cc0f1.firebaseapp.com", 
        projectId: "multiprintt-cc0f1", 
        storageBucket: "multiprintt-cc0f1.firebasestorage.app", 
        messagingSenderId: "626369594335", 
        appId: "1:626369594335:web:711aac8c65197a0dceba6a" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('builder-ui').style.display = 'flex';
        }
    });

    window.attemptLogin = async function() {
        const email = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;
        const btn = document.getElementById('btn-login');
        
        if (!email || !pass) {
            alert("Por favor, ingresa credenciales válidas.");
            return;
        }

        try {
            btn.textContent = "Iniciando...";
            btn.disabled = true;
            await signInWithEmailAndPassword(auth, email, pass);
            
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('builder-ui').style.display = 'flex';
            }, 500);
        } catch (error) {
            alert("Error: " + error.message);
            btn.textContent = "Iniciar Sesión";
            btn.disabled = false;
        }
    };

    window.logout = async function() {
        await signOut(auth);
        location.reload();
    };

    window.setDevice = function(type, btn) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const wrapper = document.getElementById('preview-wrapper');
        wrapper.className = 'device-' + type;
    };
    
    // Función segura para invocar metodos en el iframe
    window.callIframeFunction = function(fnName, ...args) {
        const iframe = document.getElementById('site-frame');
        if (iframe && iframe.contentWindow && typeof iframe.contentWindow[fnName] === 'function') {
            iframe.contentWindow[fnName](...args);
        }
    };

    // Funciones del Visual Builder
    let isDragMode = false;
    window.toggleDragMode = function(btn) {
        isDragMode = !isDragMode;
        if(isDragMode) {
            btn.classList.add('bg-pink-500/20', 'text-pink-400', 'border-pink-500/50');
            btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i> Arrastrar Activo';
        } else {
            btn.classList.remove('bg-pink-500/20', 'text-pink-400', 'border-pink-500/50');
            btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i> Modo Arrastrar';
        }
        document.getElementById('site-frame').contentWindow.postMessage({type: 'TOGGLE_DRAG', state: isDragMode}, '*');
    }

    window.publishChanges = function() {
        const btn = document.getElementById('publish-btn');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Guardando...';
        document.getElementById('site-frame').contentWindow.postMessage({type: 'SAVE_FULL_LAYOUT'}, '*');
    }

    // Funciones de postMessage que interactúan con el iframe
    window.updateText = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', text: val}, '*'); }
    window.updateHref = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', href: val}, '*'); }
    window.updateStyle = function(prop, val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_STYLE', prop: prop, value: val}, '*'); }
    window.deleteElement = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'DELETE_SELECTED_NODE'}, '*'); document.getElementById('properties-panel').innerHTML = 'Elemento eliminado.'; }
    window.selectParent = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_PARENT_NODE'}, '*'); }
    window.selectChild = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_CHILD_NODE'}, '*'); }

    // Función para resaltar el botón de alineación
    window.highlightAlign = function(btn) {
        document.querySelectorAll('.align-btn').forEach(b => {
            b.classList.remove('bg-cyan-500/20', 'text-cyan-400');
            b.classList.add('text-zinc-400');
        });
        btn.classList.remove('text-zinc-400');
        btn.classList.add('bg-cyan-500/20', 'text-cyan-400');
    }

    // Escuchamos los mensajes que envía el iframe (index.html)
    window.addEventListener('message', (event) => {
        const data = event.data;
        
        // Cuando el Iframe termina de cargar y está listo
        if (data.type === 'APP_READY') {
            const iframe = document.getElementById('site-frame');
            iframe.contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, '*');
        }
        
        // Cuando hacemos clic en un elemento dentro del Iframe
        if (data.type === 'ELEMENT_SELECTED') {
            renderPropertiesPanel(data);
        }
        
        // Cuando se deselecciona o deshabilita el builder
        if (data.type === 'CLEAR_SELECTION') {
            document.getElementById('properties-panel').innerHTML = '<div class="text-zinc-500 text-xs text-center py-10 px-4 bg-black/50 border border-white/5 rounded-lg border-dashed">Haz clic en cualquier elemento con borde punteado dentro de la vista previa para editar sus propiedades.</div>';
        }
        
        // Respuestas de guardado
        if (data.type === 'SAVE_DONE') {
            const btn = document.getElementById('publish-btn');
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> Publicar Cambios';
            alert('¡Cambios guardados correctamente en la base de datos!');
        }
        if (data.type === 'SAVE_ERROR') {
            const btn = document.getElementById('publish-btn');
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-cyan-400"></i> Publicar Cambios';
            alert('Error al guardar: ' + data.msg);
        }
    });

    // Renderizar panel dinámico según el elemento seleccionado
    function renderPropertiesPanel(data) {
        const panel = document.getElementById('properties-panel');
        let html = `<div class="mb-4 pb-4 border-b border-white/10">
            <div class="text-cyan-400 font-bold text-xs mb-1">Elemento Seleccionado</div>
            <div class="text-white text-sm bg-black/50 p-2 rounded border border-white/10 font-mono"><i class="fa-solid fa-code"></i> ${data.tagName}</div>
        </div>`;

        // Controles de Navegación de Nodos (Padre / Hijo)
        html += `<div class="flex gap-2 mb-4">
            <button onclick="selectParent()" class="flex-1 bg-[#1a1a1e] hover:bg-[#25252b] border border-white/10 py-2 rounded-lg text-[10px] text-white transition-colors shadow-sm font-semibold"><i class="fa-solid fa-arrow-up text-zinc-400"></i> Seleccionar Padre</button>
            <button onclick="selectChild()" class="flex-1 bg-[#1a1a1e] hover:bg-[#25252b] border border-white/10 py-2 rounded-lg text-[10px] text-white transition-colors shadow-sm font-semibold"><i class="fa-solid fa-arrow-down text-zinc-400"></i> Seleccionar Hijo</button>
        </div>`;

        // Edición de Texto
        if (!['IMG', 'VIDEO', 'SECTION', 'DIV', 'ARTICLE'].includes(data.tagName)) {
            html += `<div class="mb-4">
                <label class="inspector-label"><i class="fa-solid fa-font"></i> Texto</label>
                <textarea oninput="updateText(this.value)" class="inspector-input min-h-[100px]">${data.text || ''}</textarea>
            </div>`;
        }

        // Edición de Enlace/Media (Imágenes, Videos o Enlaces)
        if (['IMG', 'VIDEO', 'A'].includes(data.tagName) || data.href) {
            html += `<div class="mb-4">
                <label class="inspector-label"><i class="fa-solid fa-link"></i> URL / Origen de Medio</label>
                <input type="text" oninput="updateHref(this.value)" value="${data.href || ''}" class="inspector-input">
            </div>`;
        }

        // Edición de Temas de Color (Tarjetas de testimonio)
        if (data.hasTheme) {
            html += `<div class="mb-4">
                <label class="inspector-label"><i class="fa-solid fa-palette"></i> Tema de Color</label>
                <select onchange="updateStyle('theme', this.value)" class="inspector-input">
                    <option value="cyan" ${data.currentTheme === 'cyan' ? 'selected' : ''}>Cyan (Principal)</option>
                    <option value="pink" ${data.currentTheme === 'pink' ? 'selected' : ''}>Rosa</option>
                    <option value="violet" ${data.currentTheme === 'violet' ? 'selected' : ''}>Violeta</option>
                    <option value="yellow" ${data.currentTheme === 'yellow' ? 'selected' : ''}>Amarillo</option>
                    <option value="emerald" ${data.currentTheme === 'emerald' ? 'selected' : ''}>Esmeralda</option>
                </select>
            </div>`;
        }

        // Estilos Básicos (Color de texto y fondo)
        html += `<div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="inspector-label"><i class="fa-solid fa-fill-drip"></i> Texto Color</label>
                <input type="color" oninput="updateStyle('color', this.value)" class="color-picker">
            </div>
            <div>
                <label class="inspector-label"><i class="fa-solid fa-fill"></i> Fondo Color</label>
                <input type="color" oninput="updateStyle('bg', this.value)" class="color-picker">
            </div>
        </div>`;

        // Tipografía y Alineación
        html += `<div class="mb-4">
            <label class="inspector-label"><i class="fa-solid fa-align-left"></i> Alineación de Texto</label>
            <div class="flex gap-1 bg-black p-1 rounded-lg border border-white/10">
                <button onclick="updateStyle('textAlign', 'text-left'); highlightAlign(this)" class="flex-1 py-1.5 rounded text-zinc-400 hover:text-white align-btn"><i class="fa-solid fa-align-left"></i></button>
                <button onclick="updateStyle('textAlign', 'text-center'); highlightAlign(this)" class="flex-1 py-1.5 rounded text-zinc-400 hover:text-white align-btn"><i class="fa-solid fa-align-center"></i></button>
                <button onclick="updateStyle('textAlign', 'text-right'); highlightAlign(this)" class="flex-1 py-1.5 rounded text-zinc-400 hover:text-white align-btn"><i class="fa-solid fa-align-right"></i></button>
            </div>
        </div>`;

        // Tamaño texto y peso
        html += `<div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="inspector-label"><i class="fa-solid fa-text-height"></i> Tamaño</label>
                <select onchange="updateStyle('textSize', this.value)" class="inspector-input">
                    <option value="">Por defecto</option>
                    <option value="text-xs">Extra Pequeño</option>
                    <option value="text-sm">Pequeño</option>
                    <option value="text-base">Normal</option>
                    <option value="text-lg">Grande</option>
                    <option value="text-xl">XL</option>
                    <option value="text-2xl">2XL</option>
                    <option value="text-4xl">4XL</option>
                </select>
            </div>
            <div>
                <label class="inspector-label"><i class="fa-solid fa-bold"></i> Grosor</label>
                <select onchange="updateStyle('fontWeight', this.value)" class="inspector-input">
                    <option value="">Por defecto</option>
                    <option value="font-light">Ligero</option>
                    <option value="font-normal">Normal</option>
                    <option value="font-medium">Medio</option>
                    <option value="font-bold">Negrita</option>
                    <option value="font-extrabold">Extra Negrita</option>
                </select>
            </div>
        </div>`;

        // Bordes Redondeados y Opacidad
        html += `<div class="mb-4">
            <label class="inspector-label"><i class="fa-regular fa-square"></i> Bordes Redondeados</label>
            <input type="range" min="0" max="100" value="0" oninput="updateStyle('radius', this.value)" class="w-full accent-cyan-400">
        </div>`;

        html += `<div class="mb-6">
            <label class="inspector-label"><i class="fa-solid fa-eye-low-vision"></i> Opacidad</label>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="updateStyle('opacity', this.value)" class="w-full accent-cyan-400">
        </div>`;

        // Botón de Eliminar
        html += `<button onclick="deleteElement()" class="w-full py-3 rounded-lg bg-red-500/10 text-red-500 border border-red-500/30 text-xs font-bold hover:bg-red-500/20 transition-colors shadow-sm"><i class="fa-solid fa-trash mr-2"></i> Eliminar Elemento</button>`;

        panel.innerHTML = html;
    }
</script>
</body>
</html>
