<style>
    :root { --bg-dark: #000000; --panel: #09090b; --border: rgba(255,255,255,0.06); --accent: #25d8ff; }
    body { background-color: var(--bg-dark); color: #a1a1aa; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    #auth-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .glass-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }

    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    .topbar { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; z-index: 50; }
    .workspace { display: flex; flex: 1; min-height: 0; width: 100%; overflow: hidden; }
    .sidebar-left { width: 220px; background: var(--panel); border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex-shrink: 0; z-index: 20;}
    .sidebar-right { width: 280px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; z-index: 20;}

    .canvas-area { flex: 1; min-width: 0; background-color: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
    #preview-wrapper { transition: all 0.3s ease; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 60px rgba(0,0,0,0.6); }
    .device-desktop { width: 100%; height: 100%; max-width: 100%; border-radius: 0; border: none; box-shadow: none !important;}
    .device-tablet { width: 820px; height: 1180px; border-radius: 12px; margin: 40px auto; flex-shrink: 0; border: 8px solid #141417; }
    .device-mobile { width: 390px; height: 844px; border-radius: 20px; margin: 40px auto; flex-shrink: 0; border: 10px solid #141417; }
    #site-frame { width: 100%; height: 100%; border: none; flex-grow: 1; background: #070709; border-radius: inherit; }

    .device-btn { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #71717a; transition: all 0.2s; cursor: pointer; font-size: 12px;}
    .device-btn.active { background: rgba(37,216,255,0.1); color: var(--accent); }
    .device-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.03); }

    .tool-btn { background: transparent; border: 1px solid transparent; padding: 7px 10px; border-radius: 6px; color: #a1a1aa; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; width: 100%; text-align: left; }
    .tool-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .tool-btn.active { background: rgba(37,216,255,0.1); color: var(--accent); }

    .btn-primary { background: #fff; color: #000; font-weight: 600; border-radius: 6px; padding: 6px 14px; font-size: 11px; transition: all 0.2s; border: none; cursor: pointer; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid rgba(255,255,255,0.08); color: #e5e5e5; font-weight: 500; border-radius: 6px; padding: 6px 14px; font-size: 11px; transition: all 0.2s; cursor: pointer; }
    .btn-secondary:hover { background: rgba(255,255,255,0.04); color: #fff; }
    .btn-warning { background: transparent; border: 1px solid rgba(245, 158, 11, 0.3); color: #f59e0b; font-weight: 500; border-radius: 6px; padding: 6px 12px; font-size: 11px; transition: all 0.2s; cursor: pointer; }
    .btn-warning:hover { background: rgba(245, 158, 11, 0.1); }
    .btn-danger { background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; font-weight: 500; border-radius: 6px; padding: 6px 12px; font-size: 11px; transition: all 0.2s; cursor: pointer; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

    .panel-title { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: #52525b; font-weight: 700; margin: 12px 4px 4px 4px; display: flex; align-items: center; gap: 6px; }
    .divider { height: 1px; background: var(--border); width: 100%; margin: 6px 0; }
    .inp-field { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.08); padding: 7px 10px; border-radius: 6px; color: #fff; outline: none; font-size: 11px; transition: border-color 0.2s; }
    .inp-field:focus { border-color: var(--accent); }
    .lbl { font-size: 9px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: block; }

    .acc-item { border-bottom: 1px solid var(--border); }
    .acc-header { padding: 10px 14px; font-size: 10px; font-weight: 600; text-transform: uppercase; color: #71717a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: transparent; }
    .acc-header:hover { color: #fff; }
    .acc-item.active .acc-header { color: #fff; background: rgba(255,255,255,0.02); }
    .acc-content { padding: 12px 14px; display: none; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.3); }
    .acc-item.active .acc-content { display: flex; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.2s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }

    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .custom-toast { background: #18181b; border: 1px solid rgba(255,255,255,0.08); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 11px; font-weight: 500; transform: translateY(15px); opacity: 0; transition: all 0.3s ease; pointer-events: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .custom-toast.show { transform: translateY(0); opacity: 1; }

/* Multiprintt Admin 2027 quality layer */
html{color-scheme:dark;scrollbar-gutter:stable}
body{overscroll-behavior:none}
button,input,textarea,select{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
.status-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);border-radius:999px;padding:4px 8px;color:#a1a1aa;font-size:9px;font-weight:600}
.status-dot{width:6px;height:6px;border-radius:999px;background:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.5)}
.status-dot.ok{background:#34d399;box-shadow:0 0 10px rgba(52,211,153,.5)}
.status-dot.bad{background:#ef4444;box-shadow:0 0 10px rgba(239,68,68,.5)}

</style>

<body>

<div id="toast-container"></div>

<div id="auth-screen">
    <div class="glass-panel p-8 w-full max-w-sm text-center">

            <input type="email" id="loginUser" placeholder="Correo" class="inp-field">
            <input type="password" id="loginPass" placeholder="Contraseña" class="inp-field">

<div id="db-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="db-modal-title" class="text-white font-semibold text-xs mb-3">Editor</h3>
        <div id="db-modal-body" class="flex flex-col gap-3 mb-5"></div>
        <div class="flex gap-2 pt-2 border-t border-white/5">
            <button onclick="window.saveDbItem()" class="flex-1 btn-primary py-2">Guardar</button>
            <button onclick="document.getElementById('db-modal').classList.remove('active')" class="px-4 btn-secondary py-2">Cancelar</button>
        </div>
    </div>
</div>

<div id="icon-picker-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="text-white font-semibold text-xs mb-3">Añadir Red Social</h3>
        <div class="grid grid-cols-3 gap-2 mb-3">
            <button onclick="window.selectSocialIcon('fa-brands fa-facebook-f', 'facebook', this)" class="social-opt p-2.5 bg-black border border-white/10 rounded-lg text-zinc-400 hover:text-white text-xs"><i class="fa-brands fa-facebook-f mr-1"></i> FB</button>
            <button onclick="window.selectSocialIcon('fa-brands fa-instagram', 'instagram', this)" class="social-opt p-2.5 bg-black border border-white/10 rounded-lg text-zinc-400 hover:text-white text-xs"><i class="fa-brands fa-instagram mr-1"></i> IG</button>
            <button onclick="window.selectSocialIcon('fa-brands fa-whatsapp', 'whatsapp', this)" class="social-opt p-2.5 bg-black border border-white/10 rounded-lg text-zinc-400 hover:text-white text-xs"><i class="fa-brands fa-whatsapp mr-1"></i> WA</button>
        </div>
        <label class="lbl">URL de Destino</label>
        <input type="text" id="social-url-input" placeholder="https://..." class="inp-field mb-4">
        <div class="flex gap-2">
            <button onclick="window.confirmAddSocial()" class="flex-1 btn-primary py-2">Añadir</button>
            <button onclick="document.getElementById('icon-picker-modal').classList.remove('active')" class="px-4 btn-secondary py-2">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Galería / Explorador de Medios -->
<div id="gallery-modal" class="modal-overlay z-[10000]">
    <div class="modal-content" style="max-width: 650px;">
        <div class="flex justify-between items-center mb-3">
            <div><h3 class="text-white font-semibold text-xs">Seleccionar Archivo de Medios</h3><div id="gallery-source" class="text-[8px] text-zinc-500 mt-1 font-mono truncate max-w-[480px]"></div></div>
            <button onclick="document.getElementById('gallery-modal').classList.remove('active')" class="text-zinc-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex gap-2 mb-3">
            <button onclick="window.filterGallery('all')" class="tool-btn justify-center active" id="gal-filt-all">Todos</button>
            <button onclick="window.filterGallery('image')" class="tool-btn justify-center" id="gal-filt-img">Imágenes</button>
            <button onclick="window.filterGallery('video')" class="tool-btn justify-center" id="gal-filt-vid">Videos</button>
        </div>
        <div id="gallery-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-[350px] overflow-y-auto pr-1"></div>
    </div>
</div>

<div id="builder-ui">
    <div class="topbar">
        <div class="flex items-center gap-2">
            <span class="status-pill"><span id="save-status-dot" class="status-dot"></span><span id="save-status-label">Listo</span></span>
            <span class="font-bold text-[11px] text-white tracking-tight">Multiprintt</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-white/5 text-zinc-400 font-mono">Core 2027</span>
            <span id="save-status" class="status-pill hidden sm:inline-flex"><span class="status-dot" id="save-status-dot"></span><span id="save-status-label">Conectando</span></span>
        </div>
        <div class="flex items-center gap-1 bg-black p-0.5 border border-white/5 rounded-md">
            <button class="device-btn active" onclick="window.setDevice('desktop', this)"><i class="fa-solid fa-desktop"></i></button>
            <button class="device-btn" onclick="window.setDevice('tablet', this)"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button class="device-btn" onclick="window.setDevice('mobile', this)"><i class="fa-solid fa-mobile-screen-button"></i></button>
        </div>
        <div class="flex items-center gap-2">
            <button class="tool-btn active w-auto py-1.5 px-2.5" id="btn-drag" onclick="window.toggleDragMode(this)"><i class="fa-solid fa-arrows-up-down-left-right"></i> <span class="hidden sm:inline">Mover</span></button>
            <button class="btn-warning py-1.5 px-2.5" onclick="window.resetTemplateConfirm()"><i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline">Reset</span></button>
            <button class="btn-primary py-1.5 px-3 flex items-center gap-1.5" id="publish-btn" onclick="window.publishChanges()"><i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Desplegar</span></button>
            <button class="btn-secondary py-1.5 px-2 text-zinc-400 hover:text-white" onclick="window.logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
    
    <div class="workspace">
        <div class="sidebar-left hide-scrollbar">
            <div class="panel-title">Navegación</div>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'catalog')"><i class="fa-solid fa-store w-4"></i> Tienda</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'courses')"><i class="fa-solid fa-graduation-cap w-4"></i> Academia</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'about')"><i class="fa-solid fa-circle-info w-4"></i> Nosotros</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'contact')"><i class="fa-regular fa-envelope w-4"></i> Contacto</button>
            <div class="divider"></div>
            <div class="panel-title">Base de Datos</div>
            <button class="tool-btn text-pink-400" onclick="window.openDbEditor('product', null)"><i class="fa-solid fa-box-open w-4"></i> + Producto</button>
            <button class="tool-btn text-cyan-400" onclick="window.openDbEditor('course', null)"><i class="fa-solid fa-laptop-file w-4"></i> + Curso</button>
        </div>
        
        <div class="canvas-area">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src=""></iframe>
            </div>
        </div>
        
        <div class="sidebar-right hide-scrollbar">
            <div id="properties-panel" class="w-full h-full flex flex-col items-center justify-center text-zinc-500 p-6 text-center">
                <p class="font-medium text-[11px] text-zinc-500">Selecciona un elemento<br>en el lienzo.</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signInWithCustomToken, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", authDomain: "multiprintt-cc0f1.firebaseapp.com", projectId: "multiprintt-cc0f1", storageBucket: "multiprintt-cc0f1.firebasestorage.app", messagingSenderId: "626369594335", appId: "1:626369594335:web:711aac8c65197a0dceba6a" };
    const app = initializeApp(firebaseConfig);
window.MULTIPRINTT_SECURITY = { appCheckEnabled:false }; const auth = getAuth(app); const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
    const APP_ID = "multiprintt-web";
const SAME_ORIGIN = window.location.origin;
const ADMIN_VERSION='2027.09-commerce';
const setSaveStatus = (state,label) => {
    const dot=document.getElementById('save-status-dot'); const text=document.getElementById('save-status-label');
    if(!dot||!text) return;
    dot.className='status-dot'+(state==='ok'?' ok':state==='bad'?' bad':'');
    text.textContent=label;
};
const safeText = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const safeUrl = value => {
    try{
        const u=new URL(String(value||''), window.location.href);
        return ['http:','https:'].includes(u.protocol) ? u.href : '';
    }catch{return ''}
};

    window.showToast = function(msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 2500);
    }

    onAuthStateChanged(auth, (user) => {
        if (user && !user.isAnonymous) {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('builder-ui').style.display = 'flex';
                const iframe = document.getElementById('site-frame');
                if (!iframe.src || iframe.src === window.location.href) iframe.src = 'index.html?t=' + Date.now();
            }, 300);
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('auth-screen').style.opacity = '1';
            document.getElementById('builder-ui').style.display = 'none';
        }
    });

    window.attemptLogin = async function() {
        const email = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value;
        if (!email || !pass) return window.showToast("Datos incompletos.");
        try { 
            await setPersistence(auth, browserSessionPersistence);
            if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
            else await signInWithEmailAndPassword(auth, email, pass); 
        } catch (error) { window.showToast(error?.code==="auth/invalid-credential" ? "Correo o contraseña incorrectos." : "No se pudo iniciar sesión."); setSaveStatus("bad","Acceso rechazado"); }
    };

    window.logout = async function() { await signOut(auth); location.reload(); };
    window.setDevice = function(type, btn) { document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); document.getElementById('preview-wrapper').className = 'device-' + type; };
    window.callIframeFunction = function(fnName, ...args) { const iframe = document.getElementById('site-frame'); if (iframe && iframe.contentWindow && typeof iframe.contentWindow[fnName] === 'function') iframe.contentWindow[fnName](...args); };

    let isDragMode = true;
    window.toggleDragMode = function(btn) {
        isDragMode = !isDragMode;
        if(isDragMode) { btn.classList.add('active'); btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i> Mover'; } 
        else { btn.classList.remove('active'); btn.innerHTML = '<i class="fa-solid fa-lock"></i> Fijo'; }
        document.getElementById('site-frame').contentWindow.postMessage({type: 'TOGGLE_DRAG', state: isDragMode}, SAME_ORIGIN);
    }

    window.publishChanges = function() {
        document.getElementById('publish-btn').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        document.getElementById('site-frame').contentWindow.postMessage({type: 'SAVE_FULL_LAYOUT'}, SAME_ORIGIN);
    }

    window.resetTemplateConfirm = function() {
        if(confirm("¿Restaurar diseño base de fábrica?")) {
            window.showToast("Restaurando UI...");
            document.getElementById('site-frame').contentWindow.postMessage({type: 'RESET_TEMPLATE'}, SAME_ORIGIN);
        }
    }

    let currentDbItem = {};
    let activeMediaInput = null;
    let galleryDataCache = []; let gallerySource = ''; let galleryLoaded = false;

    window.openGallery = async function(inputId, filter = 'all') {
        activeMediaInput = inputId;
        const source = inputId === 'db-img' && currentDbItem.type === 'product'
            ? '/recursos/productos/imagenes.json'
            : '/recursos/imagenes.json';
        gallerySource = source;
        document.getElementById('gallery-modal').classList.add('active');
        const grid = document.getElementById('gallery-grid');
        const sourceEl = document.getElementById('gallery-source');
        if(sourceEl) sourceEl.textContent = source;
        grid.innerHTML = `<div class="col-span-full py-8 text-center text-zinc-500 text-xs"><i class="fa-solid fa-circle-notch fa-spin"></i> Leyendo catálogo multimedia…</div>`;

        try {
            const res = await fetch(source, { cache: 'no-store', credentials: 'same-origin' });
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            const raw = await res.json();
            const list = Array.isArray(raw) ? raw : (Array.isArray(raw.items) ? raw.items : Object.entries(raw).flatMap(([key,v]) => Array.isArray(v) ? v : [{...v, title:v.title||key}]));
            galleryDataCache = list.map((item, i) => {
                const url = item.url || item.src || item.image || item.path || item.href || item.file || '';
                const lower = String(url).toLowerCase();
                const type = item.type || (/(\.mp4|\.webm|\.mov|video)/i.test(lower) ? 'video' : 'image');
                return { ...item, url, type, title: item.title || item.name || item.alt || `Medio ${i+1}` };
            }).filter(item => item.url);
            galleryLoaded = true;
        } catch(e) {
            galleryDataCache = [];
            galleryLoaded = false;
            grid.innerHTML = `<div class="col-span-full py-10 text-center text-xs text-zinc-500"><i class="fa-solid fa-triangle-exclamation text-amber-400 mb-2"></i><br>No se pudo leer <strong class="text-white">${source}</strong>.<br>Verifica que el JSON exista en Firebase Hosting.</div>`;
            return;
        }
        window.filterGallery(filter);
    }

    window.filterGallery = function(type) {
        document.querySelectorAll('#gallery-modal .tool-btn').forEach(b => b.classList.remove('active'));
        if(type === 'all') document.getElementById('gal-filt-all').classList.add('active');
        if(type === 'image') document.getElementById('gal-filt-img').classList.add('active');
        if(type === 'video') document.getElementById('gal-filt-vid').classList.add('active');

        const grid = document.getElementById('gallery-grid');
        const filtered = galleryDataCache.filter(item => type === 'all' || item.type === type);
        let html = '';
        filtered.forEach(item => {
            const safeUrl = JSON.stringify(item.url);
            const safeTitle = String(item.title||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
            if(item.type === 'image') {
                html += `<button type="button" onclick='window.selectMedia(${safeUrl})' class="aspect-square bg-black border border-white/10 rounded-lg overflow-hidden cursor-pointer hover:border-cyan-400 relative group text-left"><img src="${item.url}" loading="lazy" class="w-full h-full object-cover opacity-70 group-hover:opacity-100" onerror="this.style.opacity=.2"><span class="absolute bottom-1 left-1 right-1 bg-black/80 text-white text-[8px] p-1 truncate rounded">${safeTitle}</span></button>`;
            } else {
                html += `<button type="button" onclick='window.selectMedia(${safeUrl})' class="aspect-square bg-black border border-white/10 rounded-lg overflow-hidden cursor-pointer hover:border-violet-400 relative group flex items-center justify-center text-left"><video src="${item.url}" muted preload="metadata" class="absolute inset-0 w-full h-full object-cover opacity-35 group-hover:opacity-60"></video><div class="relative z-10 w-10 h-10 rounded-full bg-black/60 border border-white/10 flex items-center justify-center"><i class="fa-solid fa-play text-xs text-violet-300"></i></div><span class="absolute bottom-1 left-1 right-1 bg-black/80 text-white text-[8px] p-1 truncate rounded z-10">${safeTitle}</span></button>`;
            }
        });
        grid.innerHTML = html || '<div class="col-span-full py-8 text-center text-xs text-zinc-500">Sin medios en esta fuente.</div>';
    }

    window.selectMedia = function(url) {
        if(activeMediaInput && document.getElementById(activeMediaInput)) {
            document.getElementById(activeMediaInput).value = url;
        }
        document.getElementById('gallery-modal').classList.remove('active');
    }

    window.openDbEditor = function(type, itemId, itemData = null) {
        currentDbItem = { type: type, id: itemId || 'new_' + Date.now() };
        let title = itemId ? 'Editar' : 'Nuevo'; let raw = itemData || {}; let d = new Proxy(raw,{get:(o,k)=>typeof o[k]==='string'?safeText(o[k]):o[k]});
        let formHtml = '';
        if (type === 'product') {
            title = itemId ? "Editar Producto" : "Nuevo Producto";
            formHtml = `
                <div><label class="lbl">Nombre</label><input type="text" id="db-name" value="${d.name||''}" class="inp-field"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="lbl">Categoría</label>
                        <select id="db-cat" class="inp-field">
                            <option value="textil" ${d.category==='textil'?'selected':''}>Textil</option>
                            <option value="jarros" ${d.category==='jarros'?'selected':''}>Jarros</option>
                            <option value="imp-general" ${d.category==='imp-general'?'selected':''}>General</option>
                            <option value="packs" ${d.category==='packs'?'selected':''}>Packs</option>
                        </select>
                    </div>
                    <div><label class="lbl">Precio ($)</label><input type="number" step="0.01" id="db-price" value="${d.price||'0.00'}" class="inp-field"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="lbl">Descuento (%)</label><input type="number" min="0" max="100" id="db-discount" value="${d.discount||'0'}" class="inp-field"></div>
                    <div class="flex items-end">
                        <label class="flex items-center gap-2 cursor-pointer mb-2">
                            <input type="checkbox" id="db-promo" class="w-4 h-4 rounded accent-cyan-400" ${d.isPromo?'checked':''}/>
                            <span class="text-[11px] text-white font-medium">Es Promoción</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="lbl">Imagen principal <button type="button" onclick="window.openGallery('db-img', 'image')" class="ml-2 text-cyan-400 hover:text-cyan-300"><i class="fa-solid fa-folder-open"></i> Explorar productos</button></label>
                    <input type="text" id="db-img" value="${d.image||((Array.isArray(d.images)&&d.images[0])||'')}" class="inp-field">
                </div>
                <div><label class="lbl">Imágenes adicionales <span class="text-zinc-600">(separadas por coma)</span></label><input type="text" id="db-images" value="${Array.isArray(d.images)?d.images.join(', '):''}" class="inp-field" placeholder="imagen2, imagen3…"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="lbl">Ventas registradas</label><input type="number" min="0" id="db-sales" value="${d.salesCount||0}" class="inp-field"></div>
                    <div class="flex items-end"><label class="flex items-center gap-2 cursor-pointer mb-2"><input type="checkbox" id="db-hot" class="w-4 h-4 rounded accent-red-500" ${d.isBestSeller?'checked':''}/><span class="text-[11px] text-white font-medium">🔥 Marcar más vendido</span></label></div>
                </div>
                <p class="text-[9px] text-zinc-500">El distintivo puede basarse en ventas registradas o marcarse manualmente.</p>
            `;
        } else if (type === 'course') {
            title = itemId ? "Editar Curso" : "Nuevo Curso";
            formHtml = `
                <div><label class="lbl">Título</label><input type="text" id="db-title" value="${d.title||''}" class="inp-field"></div>
                <div><label class="lbl">Descripción</label><textarea id="db-desc" class="inp-field h-16 resize-none">${d.desc||''}</textarea></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="lbl">Horario</label><input type="text" id="db-schedule" value="${d.schedule||''}" class="inp-field"></div>
                    <div><label class="lbl">Precio</label><input type="text" id="db-price" value="${d.price||''}" class="inp-field"></div>
                </div>
                <div>
                    <label class="lbl">Portada URL <button onclick="window.openGallery('db-img', 'image')" class="ml-2 text-cyan-400"><i class="fa-solid fa-folder-open"></i> Explorar</button></label>
                    <input type="text" id="db-img" value="${d.image||''}" class="inp-field">
                </div>
                <label class="flex items-center gap-2 mt-2 cursor-pointer">
                    <input type="checkbox" id="db-master" class="w-4 h-4 rounded accent-cyan-400" ${(d.isMasterclass!==false)?'checked':''}/>
                    <span class="text-[11px] text-white font-medium">Masterclass Premium</span>
                </label>
            `;
        } else if (type === 'testimonial_video' || type === 'testimonial_text') {
            title = type === 'testimonial_video' ? 'Editar Testimonio Video' : 'Editar Testimonio Texto';
            formHtml = `
                <div><label class="lbl">Nombre del Alumno</label><input type="text" id="db-name" value="${d.name||''}" class="inp-field"></div>
                <div><label class="lbl">Rol / Curso</label><input type="text" id="db-role" value="${d.role||''}" class="inp-field"></div>
                <div><label class="lbl">Frase / Cita</label><textarea id="db-quote" class="inp-field h-16 resize-none">${d.quote||''}</textarea></div>
            `;
            if(type === 'testimonial_video') {
                formHtml += `<div><label class="lbl">Video URL (.mp4) <button onclick="window.openGallery('db-vid', 'video')" class="ml-2 text-cyan-400"><i class="fa-solid fa-folder-open"></i> Explorar</button></label><input type="text" id="db-vid" value="${d.src||''}" class="inp-field"></div>`;
            }
            formHtml += `
                <div>
                    <label class="lbl">Color / Tema</label>
                    <select id="db-theme" class="inp-field">
                        <option value="cyan" ${d.theme==='cyan'?'selected':''}>Cyan</option>
                        <option value="pink" ${d.theme==='pink'?'selected':''}>Rosa</option>
                        <option value="violet" ${d.theme==='violet'?'selected':''}>Violeta</option>
                        <option value="amber" ${d.theme==='amber'?'selected':''}>Ámbar</option>
                    </select>
                </div>
            `;
        }
        document.getElementById('db-modal-title').innerHTML = title;
        document.getElementById('db-modal-body').innerHTML = formHtml;
        document.getElementById('db-modal').classList.add('active');
    }

    window.saveDbItem = function() {
        let t = currentDbItem.type; let payload = {};
        if(t === 'product') { 
            payload = { 
                name: document.getElementById('db-name').value, 
                category: document.getElementById('db-cat').value, 
                price: parseFloat(document.getElementById('db-price').value)||0, 
                discount: parseFloat(document.getElementById('db-discount').value)||0,
                image: document.getElementById('db-img').value,
                images: document.getElementById('db-images').value.split(',').map(v=>v.trim()).filter(Boolean),
                isPromo: document.getElementById('db-promo').checked,
                salesCount: Math.max(0, parseInt(document.getElementById('db-sales').value,10)||0),
                isBestSeller: document.getElementById('db-hot').checked 
            }; 
        }
        else if(t === 'course') { payload = { title: document.getElementById('db-title').value, desc: document.getElementById('db-desc').value, schedule: document.getElementById('db-schedule').value, price: document.getElementById('db-price').value, image: document.getElementById('db-img').value, isMasterclass: document.getElementById('db-master').checked }; }
        else if(t === 'testimonial_video') { payload = { name: document.getElementById('db-name').value, role: document.getElementById('db-role').value, quote: document.getElementById('db-quote').value, src: document.getElementById('db-vid').value, theme: document.getElementById('db-theme').value }; }
        else if(t === 'testimonial_text') { payload = { name: document.getElementById('db-name').value, role: document.getElementById('db-role').value, quote: document.getElementById('db-quote').value, theme: document.getElementById('db-theme').value }; }

        document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_SAVE_REQUEST', itemType: t, id: currentDbItem.id, data: payload }, SAME_ORIGIN);
        if(t === 'testimonial_video') document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_TESTIMONIAL', data: payload }, SAME_ORIGIN);
        if(t === 'testimonial_text') document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_TEXT_TESTIMONIAL', data: payload }, SAME_ORIGIN);
        
        document.getElementById('db-modal').classList.remove('active');
        window.showToast("Cambios guardados.");
    }

    let selNet = '', selIcon = '';
    window.selectSocialIcon = function(iconClass, network, btn) {
        document.querySelectorAll('.social-opt').forEach(b => b.classList.remove('border-white', 'text-white'));
        btn.classList.add('border-white', 'text-white'); selNet = network; selIcon = iconClass;
    }
    window.confirmAddSocial = function() {
        const url = safeUrl(document.getElementById('social-url-input').value);
        if(!url) return window.showToast('URL no válida. Usa https://');
        document.getElementById('site-frame').contentWindow.postMessage({ type: 'ADD_SOCIAL_ICON', url, iconClass: selIcon, network: selNet }, SAME_ORIGIN);
        document.getElementById('icon-picker-modal').classList.remove('active');
    }

    window.updateText = val => document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', text: val}, SAME_ORIGIN);
    window.updateHref = val => document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', href: val}, SAME_ORIGIN);
    window.updateStyle = (prop, val) => document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_STYLE', prop, value: val}, SAME_ORIGIN);
    window.deleteElement = () => { document.getElementById('site-frame').contentWindow.postMessage({type: 'DELETE_SELECTED_NODE'}, SAME_ORIGIN); document.getElementById('properties-panel').innerHTML = '<p class="text-zinc-500 text-[11px]">Nodo Eliminado.</p>'; }
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.modal-overlay.active').forEach(m=>m.classList.remove('active')); });
window.toggleAccordion = header => { const item = header.parentElement; const isActive = item.classList.contains('active'); document.querySelectorAll('.acc-item').forEach(el => el.classList.remove('active')); if(!isActive) item.classList.add('active'); }

    window.addEventListener('message', async (event) => {
        if(event.origin !== window.location.origin) return;
        const data = event.data;
        if (data.type === 'SAVE_FULL_LAYOUT') {
            if (data.layoutData) {
                try{
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'layout'), { zones:data.layoutData, prodOrder:data.prodOrder||[], courseOrder:data.courseOrder||[], updatedAt:Date.now() }, { merge:true });
                    document.getElementById('publish-btn').innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Desplegar</span>';
                    setSaveStatus('ok','Guardado'); window.showToast('Cambios publicados correctamente.');
                }catch(error){
                    document.getElementById('publish-btn').innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Desplegar</span>';
                    setSaveStatus('bad','Error al guardar'); window.showToast('No se pudo publicar.');
                    console.error(error);
                }
            }
        }
        if (data.type === 'DB_SAVE_REQUEST') {
            if (data.itemType === 'product' || data.itemType === 'course') {
                const col=data.itemType==='product'?'products':'courses';
                try{
                    await setDoc(doc(db,'artifacts',APP_ID,'public','data',col,data.id),{...data.data,updatedAt:Date.now()},{merge:true});
                    document.getElementById('site-frame').contentWindow.postMessage({type:'DB_UPDATED',itemType:data.itemType,id:data.id,data:data.data},SAME_ORIGIN);
                    setSaveStatus('ok','Guardado'); window.showToast('Elemento guardado.');
                }catch(error){setSaveStatus('bad','Error al guardar');window.showToast('No se pudo guardar.');console.error(error);}
            }
        }
        if (data.type === 'DELETE_DB_ITEM') {
            if (confirm("¿Eliminar elemento de la base de datos?")) {
                const col = data.itemType === 'product' ? 'products' : 'courses';
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', col, data.itemId));
                document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_DELETED_SUCCESS', itemType: data.itemType, id: data.itemId }, SAME_ORIGIN);
                window.showToast("Eliminado con éxito.");
            }
        }
        if (data.type === 'RESET_TEMPLATE') {
            await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'layout'));
            window.showToast("Plantilla restablecida.");
            setTimeout(() => location.reload(), 800);
        }
        if (data.type === 'APP_READY') { 
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, SAME_ORIGIN); 
            setTimeout(() => window.toggleDragMode(document.getElementById('btn-drag')), 800);
        }
        if (data.type === 'ELEMENT_SELECTED') renderPropertiesPanel(data);
        if (data.type === 'CLEAR_SELECTION') document.getElementById('properties-panel').innerHTML = '<p class="font-medium text-[11px] text-zinc-500">Selecciona un elemento en el lienzo.</p>';
        if (data.type === 'OPEN_ICON_PICKER') document.getElementById('icon-picker-modal').classList.add('active');
        if (data.type === 'OPEN_EDITOR') window.openDbEditor(data.editorType, data.itemId, data.itemData);
    });

    function renderPropertiesPanel(data) {
        const panel = document.getElementById('properties-panel');
        let html = `<div class="w-full bg-[#000] border-b border-white/5 p-3 mb-2 text-left"><span class="text-white font-bold text-[10px]">${data.tagName}</span></div>`;
        if (!['IMG', 'VIDEO', 'SECTION', 'DIV'].includes(data.tagName)) {
            html += `<div class="acc-item active"><div class="acc-header" onclick="window.toggleAccordion(this)">Texto</div><div class="acc-content"><textarea oninput="window.updateText(this.value)" class="inp-field min-h-[60px]">${data.text || ''}</textarea></div></div>`;
        }
        if (['IMG', 'VIDEO', 'A', 'BUTTON'].includes(data.tagName) || data.href) {
            html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)">Enlace / URL</div><div class="acc-content"><input type="text" oninput="window.updateHref(this.value)" value="${data.href || ''}" class="inp-field"></div></div>`;
        }
        if (data.hasTheme) {
            html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)">Tema de Color</div><div class="acc-content"><select onchange="window.updateStyle('theme', this.value)" class="inp-field"><option value="cyan">Cyan</option><option value="pink">Rosa</option><option value="violet">Violeta</option><option value="amber">Ámbar</option></select></div></div>`;
        }
        html += `<div class="p-4 mt-auto"><button onclick="window.deleteElement()" class="w-full btn-danger py-2">Eliminar Nodo</button></div>`;
        panel.innerHTML = html; panel.className = "w-full flex-1 overflow-y-auto bg-[#09090b] p-0 text-left";
    }
</script>
