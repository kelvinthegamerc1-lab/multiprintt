<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Multiprintt | Visual Builder Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    /* Estilo Ultra Minimalista (Vercel/Linear Vibes) */
    :root { --bg-dark: #000000; --panel: #09090b; --border: rgba(255,255,255,0.05); --accent: #ffffff; --accent-hover: #e5e5e5; }
    body { background-color: var(--bg-dark); color: #a1a1aa; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    #auth-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .glass-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 40px -10px rgba(0,0,0,1); }
    
    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    
    /* Layout */
    .topbar { height: 50px; background: var(--bg-dark); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; z-index: 50; }
    .workspace { display: flex; flex: 1; min-height: 0; width: 100%; overflow: hidden; }
    .sidebar-left { width: 220px; background: var(--panel); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex-shrink: 0; z-index: 20;}
    .sidebar-right { width: 280px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; z-index: 20;}
    
    /* Subtle dot pattern for canvas */
    .canvas-area { flex: 1; min-width: 0; background-color: #050505; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
    
    #preview-wrapper { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 60px rgba(0,0,0,0.6); }
    .device-desktop { width: 100%; height: 100%; max-width: 100%; border-radius: 0; border: none; box-shadow: none !important;}
    .device-tablet { width: 820px; height: 1180px; border-radius: 12px; margin: 40px auto; flex-shrink: 0;}
    .device-mobile { width: 390px; height: 844px; border-radius: 24px; margin: 40px auto; flex-shrink: 0;}
    #site-frame { width: 100%; height: 100%; border: none; flex-grow: 1; background: #070709; border-radius: inherit; }
    
    /* Buttons */
    .device-btn { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #52525b; transition: all 0.2s; cursor: pointer; font-size: 12px;}
    .device-btn.active { background: rgba(255,255,255,0.1); color: #fff;}
    .device-btn:hover:not(.active) { color: #fff; }

    .tool-btn { background: transparent; border: 1px solid transparent; padding: 8px 12px; border-radius: 6px; color: #71717a; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; width: 100%; text-align: left; }
    .tool-btn:hover { background: rgba(255,255,255,0.03); color: #e5e5e5; }
    .tool-btn.active { background: rgba(255,255,255,0.05); color: #fff; }
    
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; border-radius: 6px; padding: 6px 14px; font-size: 11px; transition: all 0.2s; border: none; cursor: pointer; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    
    .btn-secondary { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #e5e5e5; font-weight: 500; border-radius: 6px; padding: 6px 14px; font-size: 11px; transition: all 0.2s; cursor: pointer; }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    .btn-danger { background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; font-weight: 500; border-radius: 6px; padding: 6px 14px; font-size: 11px; transition: all 0.2s; cursor: pointer; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
    
    .panel-title { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #52525b; font-weight: 700; margin: 16px 6px 6px 6px; display: flex; align-items: center; gap: 6px; }
    .divider { height: 1px; background: var(--border); width: 100%; margin: 8px 0; }
    
    /* Inputs */
    .inp-field { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; color: #fff; outline: none; font-size: 11px; transition: all 0.2s; font-family: 'Inter', sans-serif; font-weight: 400;}
    .inp-field:focus { border-color: #fff; }
    .lbl { font-size: 9px; font-weight: 500; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
    
    /* Accordion Inspector */
    .acc-item { border-bottom: 1px solid var(--border); }
    .acc-header { padding: 12px 16px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #71717a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: transparent; transition: all 0.2s;}
    .acc-header:hover { color: #fff; }
    .acc-item.active .acc-header { color: #fff; }
    .acc-content { padding: 16px; display: none; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.2); }
    .acc-item.active .acc-content { display: flex; }
    
    .input-group { display: flex; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
    .input-group:focus-within { border-color: #fff; }
    .input-group input { width: 100%; background: transparent; border: none; padding: 6px 8px; color: #fff; outline: none; font-size: 11px; font-family: monospace;}
    
    .align-btn { flex: 1; padding: 6px; border-radius: 4px; color: #52525b; transition: all 0.2s; border: 1px solid transparent; display: flex; justify-content: center; align-items: center;}
    .align-btn:hover { color: #fff; }
    .align-btn.active { background: rgba(255,255,255,0.1); color: #fff; }

    /* Modals Minimalistas */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; transform: translateY(10px) scale(0.98); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }

    /* Toast Minimalista */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .custom-toast { background: #fff; color: #000; padding: 12px 16px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; transform: translateY(20px); opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; }
    .custom-toast.error { background: #ef4444; color: #fff; }
    .custom-toast.warning { background: #f59e0b; color: #fff; }
    .custom-toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="toast-container"></div>

<div id="auth-screen">
    <div class="glass-panel p-8 w-full max-w-sm text-center bg-[#09090b]">
        <h1 class="text-xl font-bold mb-1 text-white tracking-tight">Multiprintt</h1>
        <p class="text-zinc-500 text-[10px] mb-6">Portal Administrativo</p>
        <div class="space-y-3">
            <input type="email" id="loginUser" placeholder="Correo Administrativo" class="inp-field">
            <input type="password" id="loginPass" placeholder="Contraseña" class="inp-field">
            <button onclick="window.attemptLogin()" id="btn-login" class="w-full btn-primary mt-4 py-2.5">Ingresar</button>
        </div>
    </div>
</div>

<!-- Modal Base de Datos -->
<div id="db-modal" class="modal-overlay">
    <div class="modal-content p-6">
        <h3 id="db-modal-title" class="text-white font-medium text-sm mb-5 flex items-center gap-2">Editor</h3>
        <div id="db-modal-body" class="flex flex-col gap-4 mb-6">
            <!-- Formulario Inyectado Dinámicamente -->
        </div>
        <div class="flex gap-2 pt-4 border-t border-white/5">
            <button onclick="window.saveDbItem()" class="flex-1 btn-primary py-2.5">Guardar Cambios</button>
            <button onclick="document.getElementById('db-modal').classList.remove('active')" class="px-4 btn-secondary">Cancelar</button>
        </div>
    </div>
</div>

<div id="builder-ui">
    <div class="topbar">
        <div class="flex items-center gap-3">
            <div class="flex flex-col">
                <span class="font-bold text-[12px] text-white tracking-tight">Multiprintt <span class="font-normal text-zinc-400">Core</span></span>
            </div>
        </div>
        
        <div class="flex items-center gap-1 bg-[#09090b] p-1 border border-white/5 rounded-lg">
            <button class="device-btn active" onclick="window.setDevice('desktop', this)" title="Escritorio"><i class="fa-solid fa-desktop"></i></button>
            <button class="device-btn" onclick="window.setDevice('tablet', this)" title="Tablet"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button class="device-btn" onclick="window.setDevice('mobile', this)" title="Móvil"><i class="fa-solid fa-mobile-screen-button"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <button class="btn-secondary w-auto gap-2 flex items-center" id="btn-drag" onclick="window.toggleDragMode(this)">
                <i class="fa-solid fa-arrows-up-down-left-right"></i> <span class="hidden sm:inline">Mover</span>
            </button>
            <button class="btn-secondary text-amber-500 border-amber-500/20 hover:bg-amber-500/10 w-auto" onclick="window.resetTemplateConfirm()">
                <i class="fa-solid fa-rotate-left"></i> Restablecer UI
            </button>
            <button class="btn-primary w-auto flex items-center gap-2" id="publish-btn" onclick="window.publishChanges()">
                <i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Desplegar</span>
            </button>
            <button class="btn-secondary w-auto px-3 border-none hover:bg-white/5" onclick="window.logout()" title="Cerrar Sesión"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
    
    <div class="workspace">
        <div class="sidebar-left hide-scrollbar">
            <div class="panel-title">Navegación</div>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'catalog')">Tienda</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'courses')">Academia</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'about')">Nosotros</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'contact')">Contacto</button>
            
            <div class="divider"></div>
            
            <div class="panel-title">Base Datos</div>
            <button class="tool-btn" onclick="window.openDbEditor('product', null)">+ Añadir Producto</button>
            <button class="tool-btn" onclick="window.openDbEditor('course', null)">+ Añadir Curso</button>
            
            <div class="mt-auto p-3 bg-white/5 rounded-lg border border-white/5 text-center">
                <p class="text-[9px] text-zinc-400 leading-relaxed font-medium">Usa "Mover" para reorganizar o haz clic en textos para editarlos en vivo.</p>
            </div>
        </div>
        
        <div class="canvas-area">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src=""></iframe>
            </div>
        </div>
        
        <div class="sidebar-right hide-scrollbar">
            <div id="properties-panel" class="w-full h-full flex flex-col items-center justify-center text-zinc-500 p-6 text-center bg-[#09090b]">
                <p class="font-medium text-[11px] text-zinc-500">Selecciona un elemento en el lienzo para editar sus propiedades.</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signInWithCustomToken, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", authDomain: "multiprintt-cc0f1.firebaseapp.com", projectId: "multiprintt-cc0f1", storageBucket: "multiprintt-cc0f1.firebasestorage.app", messagingSenderId: "626369594335", appId: "1:626369594335:web:711aac8c65197a0dceba6a" };
    const app = initializeApp(firebaseConfig); 
    const auth = getAuth(app);
    const db = getFirestore(app);
    const APP_ID = "multiprintt-web";

    window.showToast = function(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `custom-toast ${type}`;
        
        let icon = type === 'success' ? '<i class="fa-solid fa-check"></i>' : 
                   type === 'error' ? '<i class="fa-solid fa-xmark"></i>' : 
                   '<i class="fa-solid fa-info"></i>';
                   
        toast.innerHTML = `${icon} <span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    onAuthStateChanged(auth, (user) => {
        if (user && !user.isAnonymous) {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('builder-ui').style.display = 'flex';
                const iframe = document.getElementById('site-frame');
                if (!iframe.src || iframe.src === window.location.href) {
                    iframe.src = 'index.html?t=' + Date.now();
                }
            }, 300);
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            setTimeout(() => document.getElementById('auth-screen').style.opacity = '1', 10);
            document.getElementById('builder-ui').style.display = 'none';
        }
    });

    window.attemptLogin = async function() {
        const email = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value; const btn = document.getElementById('btn-login');
        if (!email || !pass) return window.showToast("Datos incompletos.", "error");
        try { 
            btn.innerHTML = 'Ingresando...'; btn.disabled = true; 
            await setPersistence(auth, browserSessionPersistence);
            if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } 
            else { await signInWithEmailAndPassword(auth, email, pass); }
        } catch (error) { window.showToast("Acceso denegado.", "error"); btn.textContent = "Ingresar"; btn.disabled = false; }
    };

    window.logout = async function() { await signOut(auth); location.reload(); };

    window.setDevice = function(type, btn) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.getElementById('preview-wrapper').className = 'device-' + type;
    };
    
    window.callIframeFunction = function(fnName, ...args) {
        const iframe = document.getElementById('site-frame');
        if (iframe && iframe.contentWindow && typeof iframe.contentWindow[fnName] === 'function') iframe.contentWindow[fnName](...args);
    };

    let isDragMode = true; 
    window.toggleDragMode = function(btn) {
        isDragMode = !isDragMode;
        if(isDragMode) { 
            btn.classList.add('bg-white/10', 'text-white'); 
            btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i> <span class="hidden sm:inline">Mover</span>'; 
        } else { 
            btn.classList.remove('bg-white/10', 'text-white'); 
            btn.innerHTML = '<i class="fa-solid fa-lock text-zinc-500"></i> <span class="hidden sm:inline text-zinc-500">Fijo</span>'; 
        }
        document.getElementById('site-frame').contentWindow.postMessage({type: 'TOGGLE_DRAG', state: isDragMode}, '*');
    }

    window.publishChanges = function() {
        const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
        document.getElementById('site-frame').contentWindow.postMessage({type: 'SAVE_FULL_LAYOUT'}, '*');
    }

    window.resetTemplateConfirm = function() {
        if(confirm("¿Restaurar diseño base? Los productos no se borrarán.")) {
            window.showToast("Restaurando UI...", "warning");
            document.getElementById('site-frame').contentWindow.postMessage({type: 'RESET_TEMPLATE'}, '*');
        }
    }

    let currentDbItem = {};

    window.openDbEditor = function(type, itemId, itemData = null) {
        currentDbItem = { type: type, id: itemId || 'new_' + Date.now() };
        let title = type.includes('testimonial') ? "Editar Testimonio" : itemId ? "Editar" : "Nuevo"; 
        let d = itemData || {};
        
        let formHtml = '';
        if (type === 'product') {
            formHtml = `
                <div><label class="lbl">Nombre del Producto</label><input type="text" id="db-name" value="${d.name||''}" class="inp-field"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="lbl">Categoría</label>
                        <select id="db-cat" class="inp-field">
                            <option value="textil" ${d.category==='textil'?'selected':''}>Textil</option>
                            <option value="jarros" ${d.category==='jarros'?'selected':''}>Jarros</option>
                            <option value="imp-general" ${d.category==='imp-general'?'selected':''}>General</option>
                            <option value="packs" ${d.category==='packs'?'selected':''}>Packs</option>
                        </select>
                    </div>
                    <div><label class="lbl">Precio ($)</label><input type="number" step="0.01" id="db-price" value="${d.price||'0.00'}" class="inp-field"></div>
                </div>
                <div><label class="lbl">URL de Imagen</label><input type="text" id="db-img" value="${d.image||''}" class="inp-field"></div>
            `;
        } 
        else if (type === 'course') {
            formHtml = `
                <div><label class="lbl">Título</label><input type="text" id="db-title" value="${d.title||''}" class="inp-field"></div>
                <div><label class="lbl">Descripción</label><textarea id="db-desc" class="inp-field h-16 resize-none">${d.desc||''}</textarea></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Horario</label><input type="text" id="db-schedule" value="${d.schedule||''}" class="inp-field"></div>
                    <div><label class="lbl">Precio</label><input type="text" id="db-price" value="${d.price||''}" class="inp-field"></div>
                </div>
                <div><label class="lbl">Imagen Portada</label><input type="text" id="db-img" value="${d.image||''}" class="inp-field"></div>
            `;
        }
        else if (type === 'testimonial_video') {
            formHtml = `
                <div><label class="lbl">Nombre</label><input type="text" id="db-name" value="${d.name||''}" class="inp-field"></div>
                <div><label class="lbl">Rol / Subtítulo</label><input type="text" id="db-role" value="${d.role||''}" class="inp-field"></div>
                <div><label class="lbl">Cita</label><textarea id="db-quote" class="inp-field h-16 resize-none">${d.quote||''}</textarea></div>
                <div><label class="lbl">Video (.mp4)</label><input type="text" id="db-vid" value="${d.src||''}" class="inp-field"></div>
                <div>
                    <label class="lbl">Color del Componente</label>
                    <select id="db-theme" class="inp-field">
                        <option value="cyan" ${d.theme==='cyan'?'selected':''}>Cyan</option>
                        <option value="pink" ${d.theme==='pink'?'selected':''}>Rosa</option>
                        <option value="violet" ${d.theme==='violet'?'selected':''}>Violeta</option>
                        <option value="amber" ${d.theme==='amber'?'selected':''}>Ámbar</option>
                    </select>
                </div>
            `;
        }
        else if (type === 'testimonial_text') {
            formHtml = `
                <div><label class="lbl">Nombre</label><input type="text" id="db-name" value="${d.name||''}" class="inp-field"></div>
                <div><label class="lbl">Rol / Subtítulo</label><input type="text" id="db-role" value="${d.role||''}" class="inp-field"></div>
                <div><label class="lbl">Comentario</label><textarea id="db-quote" class="inp-field h-24 resize-none">${d.quote||''}</textarea></div>
                <div>
                    <label class="lbl">Color del Componente</label>
                    <select id="db-theme" class="inp-field">
                        <option value="pink" ${d.theme==='pink'?'selected':''}>Rosa</option>
                        <option value="cyan" ${d.theme==='cyan'?'selected':''}>Cyan</option>
                        <option value="violet" ${d.theme==='violet'?'selected':''}>Violeta</option>
                        <option value="amber" ${d.theme==='amber'?'selected':''}>Ámbar</option>
                    </select>
                </div>
            `;
        }

        document.getElementById('db-modal-title').innerHTML = title;
        document.getElementById('db-modal-body').innerHTML = formHtml;
        document.getElementById('db-modal').classList.add('active');
    }

    window.saveDbItem = function() {
        let t = currentDbItem.type; let payload = {};
        
        if(t === 'product') { payload = { name: document.getElementById('db-name').value, category: document.getElementById('db-cat').value, price: parseFloat(document.getElementById('db-price').value)||0, image: document.getElementById('db-img').value }; }
        else if(t === 'course') { payload = { title: document.getElementById('db-title').value, desc: document.getElementById('db-desc').value, schedule: document.getElementById('db-schedule').value, price: document.getElementById('db-price').value, image: document.getElementById('db-img').value }; }
        else if(t === 'testimonial_video') { payload = { name: document.getElementById('db-name').value, role: document.getElementById('db-role').value, quote: document.getElementById('db-quote').value, src: document.getElementById('db-vid').value, theme: document.getElementById('db-theme').value }; }
        else if(t === 'testimonial_text') { payload = { name: document.getElementById('db-name').value, role: document.getElementById('db-role').value, quote: document.getElementById('db-quote').value, theme: document.getElementById('db-theme').value }; }

        // Envía la orden al iframe para que renderice y nosotros procesamos Firebase aquí si es producto/curso
        document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_SAVE_REQUEST', itemType: t, id: currentDbItem.id, data: payload }, '*');
        
        // Lo mandamos a nosotros mismos para guardar directo en DB (productos/cursos)
        window.postMessage({ type: 'DB_SAVE_REQUEST', itemType: t, id: currentDbItem.id, data: payload }, '*');
        
        document.getElementById('db-modal').classList.remove('active');
    }

    // Interacciones con Iframe
    window.updateText = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', text: val}, '*'); }
    window.updateHref = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', href: val}, '*'); }
    window.updateStyle = function(prop, val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_STYLE', prop: prop, value: val}, '*'); }
    window.deleteElement = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'DELETE_SELECTED_NODE'}, '*'); document.getElementById('properties-panel').innerHTML = '<div class="text-zinc-500 text-[11px] p-6 text-center">Nodo Eliminado.</div>'; }
    window.toggleAccordion = function(headerEl) { const item = headerEl.parentElement; const isActive = item.classList.contains('active'); document.querySelectorAll('.acc-item').forEach(el => el.classList.remove('active')); if(!isActive) item.classList.add('active'); }

    // EVENT LISTENER CENTRAL (COMUNICACIÓN Y BASE DE DATOS)
    window.addEventListener('message', async (event) => {
        const data = event.data;
        
        // 1. Despliegue de Plantilla (Guarda HTML en DB)
        if (data.type === 'SAVE_FULL_LAYOUT') {
            if (data.layoutData) {
                try {
                    window.showToast("Guardando diseño...", "warning");
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'layout'), {
                        zones: data.layoutData,
                        prodOrder: data.prodOrder || [],
                        courseOrder: data.courseOrder || []
                    }, { merge: true });
                    
                    const btn = document.getElementById('publish-btn');
                    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Desplegar</span>';
                    window.showToast('¡Plantilla desplegada con éxito!', 'success');
                } catch (error) {
                    console.error(error);
                    const btn = document.getElementById('publish-btn');
                    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Desplegar</span>';
                    window.showToast('Error al guardar: ' + error.message, 'error');
                }
            }
        }
        
        // 2. Guardar Item en BD (Productos, Cursos)
        if (data.type === 'DB_SAVE_REQUEST') {
            try {
                if (data.itemType === 'product' || data.itemType === 'course') {
                    const colName = data.itemType === 'product' ? 'products' : 'courses';
                    await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', colName, data.id), data.data, { merge: true });
                    document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_UPDATED', itemType: data.itemType, id: data.id, data: data.data }, '*');
                    window.showToast(`Item guardado correctamente.`);
                } else {
                    // Testimonios no van a colecciones de DB, sino directo al HTML iframe
                    document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_TESTIMONIAL', data: data.data }, '*');
                    window.showToast('Actualizado. Haz clic en "Desplegar" para guardar el diseño.');
                }
            } catch (error) { window.showToast("Error guardando datos.", "error"); }
        }

        // 3. Eliminar de BD
        if (data.type === 'DELETE_DB_ITEM') {
            if (!confirm(`¿Eliminar permanentemente de la Base de Datos?`)) return;
            try {
                const colName = data.itemType === 'product' ? 'products' : 'courses';
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', colName, data.itemId));
                document.getElementById('site-frame').contentWindow.postMessage({ type: 'DB_DELETED_SUCCESS', itemType: data.itemType, id: data.itemId }, '*');
                window.showToast("Elemento eliminado.", "success");
            } catch(e) { window.showToast("Error al eliminar.", "error"); }
        }

        // 4. Reset Template
        if (data.type === 'RESET_TEMPLATE') {
            try {
                window.showToast("Limpiando plantilla...", "warning");
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'layout'));
                window.showToast("Plantilla restaurada.", "success");
                const iframe = document.getElementById('site-frame');
                setTimeout(() => { iframe.src = iframe.src.split('?')[0] + '?t=' + Date.now(); }, 800);
            } catch(e) { window.showToast("Error al restablecer.", "error"); }
        }

        // 5. Interfaz Builder 
        if (data.type === 'APP_READY') { 
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, '*'); 
            setTimeout(() => { if(!isDragMode) window.toggleDragMode(document.getElementById('btn-drag')); else document.getElementById('site-frame').contentWindow.postMessage({type: 'TOGGLE_DRAG', state: true}, '*'); }, 1000);
        }
        
        if (data.type === 'ELEMENT_SELECTED') { renderPropertiesPanel(data); }
        if (data.type === 'CLEAR_SELECTION') { document.getElementById('properties-panel').innerHTML = '<p class="font-medium text-[11px] text-zinc-500">Selecciona un elemento en el lienzo para editar sus propiedades.</p>'; }
        
        // Interceptor para abrir editor desde iframe
        if (data.type === 'OPEN_EDITOR') { window.openDbEditor(data.editorType, data.itemId, data.itemData); }
        if (data.type === 'RESIZE_UPDATE') { const w = document.getElementById('inp-width'); if(w) w.value = data.width; const h = document.getElementById('inp-height'); if(h) h.value = data.height; }
    });

    function renderPropertiesPanel(data) {
        const panel = document.getElementById('properties-panel');
        let initialStyles = data.styles || {};
        
        let html = `
        <div class="w-full bg-[#09090b] border-b border-white/5 p-4 flex flex-col gap-2 sticky top-0 z-20">
            <span class="text-white font-semibold text-[10px] tracking-wider block">Elemento Seleccionado</span>
            <div class="flex items-center justify-between">
                <span class="text-zinc-400 text-[10px] font-mono bg-black px-2 py-1 rounded border border-white/10">${data.tagName}</span>
                <div class="flex gap-1">
                    <button onclick="document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_PARENT_NODE'}, '*')" class="w-7 h-7 rounded border border-white/5 hover:bg-white/5 text-zinc-400 hover:text-white transition-colors"><i class="fa-solid fa-level-up-alt text-[10px]"></i></button>
                    <button onclick="document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_CHILD_NODE'}, '*')" class="w-7 h-7 rounded border border-white/5 hover:bg-white/5 text-zinc-400 hover:text-white transition-colors"><i class="fa-solid fa-level-down-alt text-[10px]"></i></button>
                </div>
            </div>
        </div>`;

        html += `<div class="acc-item active"><div class="acc-header" onclick="window.toggleAccordion(this)">Contenido</div><div class="acc-content">`;
        if (!['IMG', 'VIDEO', 'SECTION', 'DIV', 'ARTICLE'].includes(data.tagName)) {
            html += `<div><label class="lbl">Texto</label><textarea oninput="window.updateText(this.value)" class="inp-field min-h-[80px] resize-y">${data.text || ''}</textarea></div>`;
        }
        if (['IMG', 'VIDEO', 'A', 'BUTTON'].includes(data.tagName) || data.href) {
            html += `<div><label class="lbl">URL / Link</label><input type="text" oninput="window.updateHref(this.value)" value="${data.href || ''}" class="inp-field font-mono text-[10px]"></div>`;
        }
        html += `</div></div>`;

        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)">Tipografía</div><div class="acc-content">
            <div><label class="lbl">Tamaño y Grosor</label>
            <div class="flex gap-2">
                <select onchange="window.updateStyle('textSize', this.value)" class="inp-field p-1.5 flex-1">
                    <option value="">Auto</option><option value="text-xs">XS</option><option value="text-sm">SM</option><option value="text-base">Base</option><option value="text-lg">LG</option><option value="text-xl">XL</option><option value="text-3xl">3XL</option>
                </select>
                <select onchange="window.updateStyle('fontWeight', this.value)" class="inp-field p-1.5 flex-1">
                    <option value="">Auto</option><option value="font-light">Ligero</option><option value="font-normal">Normal</option><option value="font-bold">Bold</option><option value="font-extrabold">ExtraBold</option>
                </select>
            </div></div>
            <div><label class="lbl">Alineación</label>
                <div class="flex bg-black p-1 rounded border border-white/10 gap-1">
                    <button onclick="window.updateStyle('textAlign', 'text-left'); this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active')); this.classList.add('active');" class="align-btn active"><i class="fa-solid fa-align-left text-[10px]"></i></button>
                    <button onclick="window.updateStyle('textAlign', 'text-center'); this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active')); this.classList.add('active');" class="align-btn"><i class="fa-solid fa-align-center text-[10px]"></i></button>
                    <button onclick="window.updateStyle('textAlign', 'text-right'); this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('active')); this.classList.add('active');" class="align-btn"><i class="fa-solid fa-align-right text-[10px]"></i></button>
                </div>
            </div></div></div>`;

        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)">Diseño y Espacio</div><div class="acc-content">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="lbl">Ancho</label><div class="input-group"><input type="text" id="inp-width" oninput="window.updateStyle('width', this.value)" value="${initialStyles.width || ''}" placeholder="auto"></div></div>
                <div><label class="lbl">Alto</label><div class="input-group"><input type="text" id="inp-height" oninput="window.updateStyle('height', this.value)" value="${initialStyles.height || ''}" placeholder="auto"></div></div>
                <div><label class="lbl">Padding</label><div class="input-group"><input type="text" oninput="window.updateStyle('padding', this.value)" value="${initialStyles.padding || ''}" placeholder="0px"></div></div>
                <div><label class="lbl">Margen</label><div class="input-group"><input type="text" oninput="window.updateStyle('margin', this.value)" value="${initialStyles.margin || ''}" placeholder="0px"></div></div>
            </div></div></div>`;

        let rgbToHex = (rgbStr) => { if(!rgbStr || !rgbStr.includes('rgb')) return '#ffffff'; let a = rgbStr.split("(")[1].split(")")[0].split(","); return "#" + a.map(x => { x = parseInt(x).toString(16); return (x.length==1) ? "0"+x : x; }).join("").slice(0,6); };
        
        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)">Colores</div><div class="acc-content">
            <div class="grid grid-cols-2 gap-3 mb-2">
                <div><label class="lbl">Texto</label><input type="color" value="${rgbToHex(initialStyles.color)}" oninput="window.updateStyle('color', this.value)" class="w-full h-8 bg-transparent border border-white/10 rounded cursor-pointer p-0"></div>
                <div><label class="lbl">Fondo</label><input type="color" value="${initialStyles.bg&&initialStyles.bg.includes('rgb')?rgbToHex(initialStyles.bg):'#000000'}" oninput="window.updateStyle('bg', this.value)" class="w-full h-8 bg-transparent border border-white/10 rounded cursor-pointer p-0"></div>
            </div>`;
        if (data.hasTheme) {
            html += `<div><label class="lbl">Tema de Tarjeta</label>
                <select onchange="window.updateStyle('theme', this.value)" class="inp-field" style="color: ${data.currentTheme === 'pink' ? '#ff2da8' : data.currentTheme === 'violet' ? '#735cff' : data.currentTheme === 'amber' ? '#f59e0b' : '#25d8ff'}">
                    <option value="cyan" ${data.currentTheme === 'cyan' ? 'selected' : ''}>Cyan Lumninoso</option><option value="pink" ${data.currentTheme === 'pink' ? 'selected' : ''}>Rosa Neón</option><option value="violet" ${data.currentTheme === 'violet' ? 'selected' : ''}>Violeta</option><option value="amber" ${data.currentTheme === 'amber' ? 'selected' : ''}>Ámbar Oro</option>
                </select></div>`;
        }
        html += `</div></div>`;

        html += `<div class="p-4 mt-auto"><button onclick="window.deleteElement()" class="w-full btn-danger py-2.5 flex items-center justify-center gap-2"><i class="fa-solid fa-trash"></i> Eliminar Nodo</button></div>`;
        panel.innerHTML = html; panel.className = "w-full flex-1 overflow-y-auto bg-[#09090b] p-0 text-left";
    }
</script>
</body>
</html>
