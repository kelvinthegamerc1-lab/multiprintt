<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Multiprintt | Visual Builder Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    body { background-color: #070709; color: #fff; font-family: 'DM Sans', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    #auth-screen { position: fixed; inset: 0; background: #070709; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    .glass-panel { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    
    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    .topbar { height: 60px; background: #101014; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 50;}
    .workspace { display: flex; flex: 1; overflow: hidden; }
    
    .sidebar { width: 280px; background: #0b0b0e; border-right: 1px solid rgba(255,255,255,0.05); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    .sidebar-right { width: 300px; background: #0b0b0e; border-left: 1px solid rgba(255,255,255,0.05); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    
    /* Contenedores arreglados para Previsualización Exacta */
    #preview-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; padding: 20px; overflow: auto; }
    #preview-wrapper { transition: all 0.3s ease; background: #070709; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
    
    .device-desktop { width: 100%; height: 100%; border-radius: 0 !important; border: none !important; }
    .device-tablet { width: 820px; height: 1180px; }
    .device-mobile { width: 390px; height: 844px; }
    
    #site-frame { width: 100%; height: 100%; border: none; }
    
    .device-btn { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; transition: all 0.2s; cursor: pointer; }
    .device-btn.active { background: rgba(37,216,255,0.1); color: #25d8ff; }

    .tool-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px 15px; border-radius: 8px; color: white; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: bold;}
    .tool-btn:hover { background: rgba(37,216,255,0.2); border-color: #25d8ff; }
    .tool-btn:active { transform: scale(0.97); }
    .danger-btn { background: rgba(255,45,45,0.05); border: 1px solid rgba(255,45,45,0.2); color: #ff6b6b; }
    .danger-btn:hover { background: rgba(255,45,45,0.2); border-color: #ff2d2d; color: white;}
    
    .inspector-input { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: white; outline: none; margin-top: 5px; font-size: 13px; }
    .inspector-input:focus { border-color: #25d8ff; }
</style>
</head>
<body>

<div id="auth-screen">
    <div class="glass-panel p-10 w-full max-w-md text-center">
        <div class="w-20 h-20 bg-cyan-500/10 border border-cyan-500/30 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(37,216,255,0.2)]">
            <i class="fa-solid fa-code text-3xl text-cyan-400"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2">Visual Builder <span class="text-cyan-400 text-sm">PRO</span></h1>
        <p class="text-zinc-500 text-sm mb-8">Acceso Maestro a la Plataforma.</p>
        <input type="text" id="loginUser" placeholder="Usuario" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-4 outline-none focus:border-cyan-400">
        <input type="password" id="loginPass" placeholder="Contraseña" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-6 outline-none focus:border-pink-400">
        <button onclick="attemptLogin()" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-zinc-200 transition-colors shadow-lg">Entrar</button>
        <p id="auth-error" class="text-red-500 text-xs mt-4 hidden font-bold">Credenciales incorrectas.</p>
    </div>
</div>

<div id="builder-ui">
    <header class="topbar">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded bg-gradient-to-br from-pink-500 to-cyan-500 flex items-center justify-center text-black font-black text-sm">M</div>
            <span class="font-bold text-sm tracking-widest uppercase text-zinc-300">Visual <span class="text-cyan-400">Builder</span></span>
        </div>
        
        <div class="flex items-center bg-[#0b0b0e] border border-white/5 rounded-lg p-1">
            <button onclick="setDevice('desktop')" class="device-btn active" id="btn-desktop"><i class="fa-solid fa-desktop"></i></button>
            <button onclick="setDevice('tablet')" class="device-btn" id="btn-tablet"><i class="fa-solid fa-tablet-screen-button"></i></button>
            <button onclick="setDevice('mobile')" class="device-btn" id="btn-mobile"><i class="fa-solid fa-mobile-screen"></i></button>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="reloadIframe()" class="w-10 h-10 rounded-lg border border-white/10 hover:bg-white/10 text-zinc-400 hover:text-white transition-colors" title="Recargar"><i class="fa-solid fa-rotate"></i></button>
            <div class="w-[1px] h-6 bg-white/10 mx-2"></div>
            <button onclick="saveLayoutAndPositions()" class="bg-cyan-500 hover:bg-cyan-400 text-black px-6 py-2 rounded-lg font-bold text-sm transition-all shadow-[0_0_15px_rgba(37,216,255,0.4)] flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> Publicar Sitio
            </button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold mb-2">Diseño y Estructura</div>
            <button onclick="toggleDraggable()" class="tool-btn" id="drag-btn">
                <i class="fa-solid fa-arrows-up-down-left-right w-5 text-center text-cyan-400"></i> Habilitar Movimiento
            </button>
            
            <div class="w-full h-[1px] bg-white/10 my-4"></div>
            
            <div class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold mb-2">Bases de Datos Vivas</div>
            <button onclick="alert('Navega al Catálogo. Haz clic en (+ Añadir Nuevo) o usa los botones Editar en las tarjetas.')" class="tool-btn">
                <i class="fa-solid fa-box-open w-5 text-center text-violet-400"></i> Gestor de Productos
            </button>
            <button onclick="alert('Navega a la Academia. Haz clic en (+ Añadir Curso) o usa los botones Editar en las tarjetas.')" class="tool-btn">
                <i class="fa-solid fa-graduation-cap w-5 text-center text-yellow-400"></i> Gestor de Academia
            </button>

            <div class="mt-auto">
                <div class="text-[10px] uppercase tracking-[0.2em] text-red-500 font-bold mb-2">Opciones de Emergencia</div>
                <button onclick="resetLayout()" class="tool-btn danger-btn w-full">
                    <i class="fa-solid fa-triangle-exclamation w-5 text-center"></i> Borrar Caché y Restaurar
                </button>
            </div>
        </aside>

        <!-- PREVIEW WRAPPER AÑADIDO PARA SIMULAR TAMAÑOS EXACTOS -->
        <main id="preview-container">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src=""></iframe>
            </div>
        </main>

        <aside class="sidebar-right">
            <div class="text-[10px] uppercase tracking-[0.2em] text-cyan-400 font-bold mb-2"><i class="fa-solid fa-sliders"></i> Inspector</div>
            
            <div id="no-selection" class="text-xs text-zinc-500 text-center mt-10">
                <i class="fa-solid fa-hand-pointer text-3xl mb-3 opacity-50 block"></i>
                Haz doble clic en cualquier enlace, botón o texto para editarlo.
            </div>

            <div id="inspector-tools" class="hidden flex-col gap-4">
                <div id="prop-text-group">
                    <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Texto Visual</label>
                    <textarea id="prop-text" rows="4" class="inspector-input"></textarea>
                </div>
                
                <div id="prop-link-group" class="hidden">
                    <label class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Enlace (URL) / Imagen</label>
                    <input type="text" id="prop-link" class="inspector-input" placeholder="https://...">
                </div>
            </div>
        </aside>
    </div>
</div>

<script>
    let dragEnabled = false;

    function attemptLogin() {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        if(u === 'admin' && p === 'adminMultiprintt2026') {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('builder-ui').style.display = 'flex';
                reloadIframe(); 
            }, 500);
        } else {
            document.getElementById('auth-error').classList.remove('hidden');
        }
    }
    document.getElementById('loginPass').addEventListener('keypress', e => { if(e.key === 'Enter') attemptLogin(); });

    // Carga de Iframe con sello de tiempo (Bloquea Caché)
    function reloadIframe() {
        const iframe = document.getElementById('site-frame');
        const timestamp = new Date().getTime(); 
        iframe.src = `index.html?v=${timestamp}`;
    }

    // Centrado y tamaño perfecto de dispositivos
    function setDevice(device) {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + device).classList.add('active');
        const wrapper = document.getElementById('preview-wrapper');
        wrapper.className = `device-${device}`;
    }

    function toggleDraggable() {
        dragEnabled = !dragEnabled;
        const btn = document.getElementById('drag-btn');
        const iframe = document.getElementById('site-frame');
        if(dragEnabled) {
            btn.style.background = 'rgba(37,216,255,0.2)'; btn.style.borderColor = '#25d8ff';
            btn.innerHTML = '<i class="fa-solid fa-check w-5 text-center text-cyan-400"></i> Movimiento Habilitado';
            iframe.contentWindow.postMessage({ type: 'TOGGLE_DRAG', state: true }, '*');
        } else {
            btn.style.background = 'rgba(255,255,255,0.05)'; btn.style.borderColor = 'rgba(255,255,255,0.1)';
            btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right w-5 text-center text-cyan-400"></i> Habilitar Movimiento';
            iframe.contentWindow.postMessage({ type: 'TOGGLE_DRAG', state: false }, '*');
        }
    }

    function saveLayoutAndPositions() {
        const btn = document.querySelector('.fa-cloud-arrow-up').parentElement;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Publicando...';
        document.getElementById('site-frame').contentWindow.postMessage({ type: 'SAVE_FULL_LAYOUT' }, '*');
    }

    function resetLayout() {
        if(confirm("ATENCIÓN: ¿Estás seguro? \n\nEsto borrará la plantilla visual dañada en Firebase y forzará al sitio a cargar desde cero. Todo volverá a la normalidad.")) {
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'RESET_LAYOUT' }, '*');
        }
    }

    // ========================================================
    // COMUNICACIÓN PERFECTA CON IFRAME
    // ========================================================
    const propText = document.getElementById('prop-text');
    const propLink = document.getElementById('prop-link');

    window.addEventListener('message', (e) => {
        
        // 1. Cuando el iframe dice que Firebase terminó de cargar
        if(e.data.type === 'APP_READY') {
            document.getElementById('site-frame').contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, '*');
        }
        
        // 2. Cuando guardó exitosamente en Firebase
        if(e.data.type === 'SAVE_DONE') {
            const btn = document.querySelector('.fa-spin').parentElement;
            btn.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> ¡Sitio Publicado!';
            setTimeout(() => { 
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Publicar Sitio'; 
                reloadIframe(); 
            }, 2000);
        }

        // 3. Cuando reseteó la plantilla
        if(e.data.type === 'LAYOUT_RESET_DONE') {
            alert("Base de datos visual purgada. El editor se recargará limpio.");
            window.location.reload(true);
        }

        // 4. Cuando el usuario seleccionó un elemento en el iframe
        if (e.data.type === 'ELEMENT_SELECTED') {
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('inspector-tools').style.display = 'flex';
            
            const tag = e.data.tagName;
            propText.value = e.data.text;
            
            if (tag === 'A' || tag === 'IMG' || tag === 'VIDEO') {
                document.getElementById('prop-link-group').style.display = 'block';
                propLink.value = e.data.href;
            } else {
                document.getElementById('prop-link-group').style.display = 'none';
            }
        }
    });

    propText.addEventListener('input', () => {
        document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_ELEMENT', text: propText.value }, '*');
    });

    propLink.addEventListener('input', () => {
        document.getElementById('site-frame').contentWindow.postMessage({ type: 'UPDATE_ELEMENT', href: propLink.value }, '*');
    });
</script>
</body>
</html>
