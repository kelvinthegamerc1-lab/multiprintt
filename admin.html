<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Multiprintt | Workspace</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    :root { --bg-dark: #050505; --panel: #0a0a0c; --border: rgba(255,255,255,0.06); --accent: #25d8ff; }
    body { background-color: var(--bg-dark); color: #e5e5e5; font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(37,216,255,0.5); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    #auth-screen { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
    #builder-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; }
    
    .topbar { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; z-index: 50; }
    
    /* Strict Flexbox for No Overlap */
    .workspace { display: flex; flex: 1; min-height: 0; width: 100%; overflow: hidden; }
    
    .sidebar-left { width: 220px; background: var(--panel); border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex-shrink: 0; z-index: 20;}
    .sidebar-right { width: 260px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; z-index: 20;}
    
    /* El lienzo centrado */
    .canvas-area { flex: 1; min-width: 0; background: #000; position: relative; overflow: auto; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 20px 20px; }
    
    #preview-wrapper { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; display: flex; flex-direction: column; background: var(--bg-dark); box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 20px 50px rgba(0,0,0,0.8); }
    .device-desktop { width: 100%; height: 100%; max-width: 100%; border-radius: 0; border: none; box-shadow: none !important;}
    .device-tablet { width: 820px; height: 1180px; border-radius: 20px; margin: 40px auto; border: 10px solid #1a1a1a; flex-shrink: 0;}
    .device-mobile { width: 390px; height: 844px; border-radius: 36px; margin: 40px auto; border: 12px solid #1a1a1a; flex-shrink: 0;}
    #site-frame { width: 100%; height: 100%; border: none; flex-grow: 1; background: #070709; border-radius: inherit; }
    
    .tool-btn { background: transparent; border: 1px solid transparent; padding: 8px 12px; border-radius: 8px; color: #a1a1aa; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; width: 100%; text-align: left; }
    .tool-btn:hover { background: rgba(255,255,255,0.03); color: #fff; border-color: rgba(255,255,255,0.05); }
    .tool-btn.active { background: rgba(37,216,255,0.1); color: var(--accent); border-color: rgba(37,216,255,0.2); }
    
    .btn-primary { background: var(--accent); color: #000; font-weight: 700; border-radius: 8px; padding: 8px 16px; font-size: 11px; transition: opacity 0.2s; border: none; box-shadow: 0 0 15px rgba(37,216,255,0.2); }
    .btn-primary:hover { opacity: 0.8; }
    
    .panel-title { font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; color: #52525b; font-weight: 800; margin: 12px 4px 4px 4px; }
    
    .inp-field { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; color: white; outline: none; font-size: 11px; transition: all 0.2s; font-family: 'Inter', sans-serif; }
    .inp-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,216,255,0.1); }
    .lbl { font-size: 9px; font-weight: 600; color: #737373; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; display: block; }
    
    /* Inspector Accordions */
    .acc-item { border-bottom: 1px solid var(--border); }
    .acc-header { padding: 12px 16px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #71717a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: transparent; transition: all 0.2s; }
    .acc-header:hover { color: #fff; }
    .acc-item.active .acc-header { color: var(--accent); background: rgba(37,216,255,0.02); }
    .acc-content { padding: 16px; display: none; background: #050505; flex-direction: column; gap: 12px; }
    .acc-item.active .acc-content { display: flex; }
    
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 99999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); transform: scale(0.95); transition: transform 0.3s; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-backdrop.show .modal-content { transform: scale(1); }
</style>
</head>
<body>

<div id="auth-screen">
    <div class="bg-[#0a0a0c] border border-white/5 p-8 rounded-2xl w-full max-w-sm text-center shadow-2xl">
        <i class="fa-solid fa-code text-3xl text-cyan-400 mb-4 block"></i>
        <h1 class="text-xl font-bold mb-1">Core Workspace</h1>
        <p class="text-zinc-500 text-xs mb-6">Acceso Administrativo Protegido</p>
        <div class="space-y-3">
            <input type="email" id="loginUser" placeholder="Correo Administrativo" class="inp-field">
            <input type="password" id="loginPass" placeholder="Contraseña" class="inp-field">
            <button onclick="window.attemptLogin()" id="btn-login" class="btn-primary w-full mt-2 py-2.5">Acceder al Panel</button>
        </div>
    </div>
</div>

<div id="builder-ui">
    <div class="topbar">
        <div class="flex items-center gap-3">
            <div class="w-7 h-7 bg-white/10 rounded-md flex items-center justify-center border border-white/5"><i class="fa-solid fa-layer-group text-[12px]"></i></div>
            <span class="font-bold text-xs tracking-wide">Multiprintt <span class="text-zinc-500 font-normal">Workspace</span></span>
        </div>
        
        <div class="flex items-center gap-1 bg-[#000] p-1 border border-white/5 rounded-lg">
            <button class="w-7 h-7 rounded flex items-center justify-center text-zinc-500 hover:text-white transition-colors bg-white/10 text-white" onclick="window.setDevice('desktop', this)"><i class="fa-solid fa-desktop text-[11px]"></i></button>
            <button class="w-7 h-7 rounded flex items-center justify-center text-zinc-500 hover:text-white transition-colors" onclick="window.setDevice('tablet', this)"><i class="fa-solid fa-tablet-screen-button text-[11px]"></i></button>
            <button class="w-7 h-7 rounded flex items-center justify-center text-zinc-500 hover:text-white transition-colors" onclick="window.setDevice('mobile', this)"><i class="fa-solid fa-mobile-screen-button text-[11px]"></i></button>
        </div>

        <div class="flex items-center gap-2">
            <button class="btn-primary flex items-center gap-2 bg-transparent text-pink-400 border border-pink-500/30 hover:bg-pink-500/10 shadow-none" id="btn-drag" onclick="window.toggleDragMode(this)">
                <i class="fa-solid fa-arrows-up-down-left-right"></i> Arrastre Off
            </button>
            <button class="btn-primary flex items-center gap-2" id="publish-btn" onclick="window.publishChanges()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Publicar Cambios
            </button>
            <button class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5 text-red-500 transition-colors" onclick="window.logout()" title="Cerrar Sesión"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>
    
    <div class="workspace">
        <div class="sidebar-left hide-scrollbar">
            <div class="panel-title">Navegación</div>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'catalog')"><i class="fa-solid fa-store w-4"></i> Tienda</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'courses')"><i class="fa-solid fa-graduation-cap w-4"></i> Academia</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'about')"><i class="fa-solid fa-circle-info w-4"></i> Nosotros</button>
            <button class="tool-btn" onclick="window.callIframeFunction('navigate', 'contact')"><i class="fa-regular fa-envelope w-4"></i> Contacto</button>
            
            <div class="h-px bg-white/5 my-2"></div>
            
            <div class="panel-title text-cyan-400">Base de Datos</div>
            <button class="tool-btn hover:text-pink-400" onclick="window.openUniversalDBEditor('product')"><i class="fa-solid fa-box-open w-4"></i> Añadir Producto</button>
            <button class="tool-btn hover:text-cyan-400" onclick="window.openUniversalDBEditor('course')"><i class="fa-solid fa-laptop-file w-4"></i> Añadir Curso</button>
            
            <div class="mt-auto p-3 bg-white/5 border border-white/5 rounded-lg text-[9px] text-zinc-400 leading-relaxed">
                <i class="fa-solid fa-circle-info text-cyan-400 mb-1 block text-[10px]"></i> Haz clic en los textos o tarjetas del centro para editarlos aquí.
            </div>
        </div>
        
        <div class="canvas-area">
            <div id="preview-wrapper" class="device-desktop">
                <iframe id="site-frame" src=""></iframe>
            </div>
        </div>
        
        <div class="sidebar-right hide-scrollbar" id="properties-panel">
            <div class="w-full h-full flex flex-col items-center justify-center text-zinc-600 text-[10px] text-center p-6">
                <i class="fa-solid fa-wand-magic-sparkles text-xl mb-2 opacity-50"></i>
                <p>Selecciona un nodo en el lienzo para inspeccionarlo.</p>
            </div>
        </div>
    </div>
</div>

<div id="universal-modal" class="modal-backdrop">
    <div class="modal-content max-w-lg p-6">
        <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
            <h2 id="um-title" class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-database text-cyan-400"></i> Editor de Registro</h2>
            <button onclick="window.closeUniversalModal()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="um-body" class="space-y-4"></div>
        <div class="flex items-center justify-end gap-3 border-t border-white/10 pt-4 mt-6">
            <button onclick="window.closeUniversalModal()" class="px-4 py-2 rounded-lg text-[11px] font-bold text-zinc-400 hover:text-white">Cancelar</button>
            <button id="um-save-btn" class="btn-primary">Guardar Datos</button>
        </div>
    </div>
</div>

<div id="gallery-modal" class="modal-backdrop z-[999999]">
    <div class="modal-content max-w-3xl h-[70vh] flex flex-col">
        <div class="p-4 border-b border-white/10 flex justify-between items-center bg-[#0a0a0c]">
            <h2 class="text-sm font-bold"><i class="fa-regular fa-folder-open text-cyan-400 mr-2"></i> Galería de Medios</h2>
            <button onclick="window.closeGallery()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 bg-[#050505]" id="gallery-grid">
            <div class="text-xs text-zinc-500 col-span-full text-center py-10"><i class="fa-solid fa-circle-notch fa-spin text-cyan-400 text-lg mb-2 block"></i> Cargando recursos...</div>
        </div>
    </div>
</div>

<script type="module">
    // Control de versiones para evitar caché
    const BUILDER_VERSION = '7.0.0'; 
    if (localStorage.getItem('admin_builder_version') !== BUILDER_VERSION) {
        localStorage.clear(); sessionStorage.clear();
        localStorage.setItem('admin_builder_version', BUILDER_VERSION);
        window.location.href = window.location.pathname + '?v=' + new Date().getTime();
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyCng7KX1SxTPlFon4A1bnl_Hu1xaJEhvlY", authDomain: "multiprintt-cc0f1.firebaseapp.com", projectId: "multiprintt-cc0f1", storageBucket: "multiprintt-cc0f1.firebasestorage.app", messagingSenderId: "626369594335", appId: "1:626369594335:web:711aac8c65197a0dceba6a" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app);

    setPersistence(auth, browserSessionPersistence).then(() => {
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('builder-ui').style.display = 'flex';
                    const iframe = document.getElementById('site-frame');
                    if (!iframe.src || iframe.src.includes('about:blank')) iframe.src = 'index.html?v=' + new Date().getTime();
                }, 400);
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('auth-screen').style.opacity = '1';
                document.getElementById('builder-ui').style.display = 'none';
            }
        });
    });

    window.attemptLogin = async function() {
        const email = document.getElementById('loginUser').value; const pass = document.getElementById('loginPass').value; const btn = document.getElementById('btn-login');
        if (!email || !pass) { alert("Ingresa credenciales."); return; }
        try { btn.innerHTML = 'Verificando...'; btn.disabled = true; await signInWithEmailAndPassword(auth, email, pass); } 
        catch (error) { alert("Error de autenticación."); btn.textContent = "Acceder al Panel"; btn.disabled = false; }
    };
    window.logout = async function() { await signOut(auth); location.reload(); };

    window.setDevice = function(type, btn) {
        document.querySelectorAll('.topbar button.bg-white\\/10').forEach(b => { b.classList.remove('bg-white/10', 'text-white'); b.classList.add('text-zinc-500'); }); 
        btn.classList.add('bg-white/10', 'text-white'); btn.classList.remove('text-zinc-500');
        document.getElementById('preview-wrapper').className = 'device-' + type;
    };
    
    window.callIframeFunction = function(fnName, ...args) {
        const iframe = document.getElementById('site-frame');
        if (iframe && iframe.contentWindow && typeof iframe.contentWindow[fnName] === 'function') iframe.contentWindow[fnName](...args);
    };

    let isDragMode = false;
    window.toggleDragMode = function(btn) {
        isDragMode = !isDragMode;
        if(isDragMode) { btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right fa-spin"></i> Arrastre On'; btn.style.background = 'rgba(255,45,168,0.2)'; btn.style.color = '#fff'; } 
        else { btn.innerHTML = '<i class="fa-solid fa-arrows-up-down-left-right"></i> Arrastre Off'; btn.style.background = 'transparent'; btn.style.color = '#f472b6'; }
        document.getElementById('site-frame').contentWindow.postMessage({type: 'TOGGLE_DRAG', state: isDragMode}, '*');
    }

    window.publishChanges = function() {
        const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Guardando...';
        document.getElementById('site-frame').contentWindow.postMessage({type: 'SAVE_FULL_LAYOUT'}, '*');
    }

    let currentDBEditorContext = null;
    let activeGalleryInput = null;

    window.openGallery = function(inputId) {
        activeGalleryInput = inputId;
        const modal = document.getElementById('gallery-modal'); modal.classList.add('show');
        const grid = document.getElementById('gallery-grid');
        
        fetch('recursos/imagenes.json')
            .then(res => res.json())
            .then(data => {
                grid.innerHTML = '';
                const allFiles = [...(data.productos||[]), ...(data.banners||[]), ...(data.ui||[]), ...(data.videos||[])];
                if(allFiles.length === 0) grid.innerHTML = '<div class="col-span-full text-center text-xs text-zinc-500">No hay archivos en imagenes.json</div>';
                allFiles.forEach(url => {
                    const isVideo = url.toLowerCase().endsWith('.mp4');
                    let thumb = isVideo ? `<div class="w-full h-full bg-black flex flex-col items-center justify-center border border-white/5"><i class="fa-solid fa-film text-2xl text-cyan-500 mb-2"></i><span class="text-[8px] text-zinc-400 break-all px-2 text-center">${url.split('/').pop()}</span></div>` : `<img src="${url}" class="w-full h-full object-cover">`;
                    
                    grid.innerHTML += `<div onclick="window.selectGalleryItem('${url}')" class="aspect-square bg-black border border-white/10 rounded-lg overflow-hidden cursor-pointer hover:border-cyan-400 transition-colors relative group">${thumb}<div class="absolute inset-0 bg-cyan-500/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity"><i class="fa-solid fa-check text-white text-xl"></i></div></div>`;
                });
            })
            .catch(e => {
                grid.innerHTML = '<div class="col-span-full text-center text-xs text-amber-500">No se encontró recursos/imagenes.json. Usa URLs externas.</div>';
            });
    }

    window.closeGallery = function() { document.getElementById('gallery-modal').classList.remove('show'); activeGalleryInput = null; }
    window.selectGalleryItem = function(url) { if(activeGalleryInput) { document.getElementById(activeGalleryInput).value = url; window.closeGallery(); } }

    window.openUniversalDBEditor = function(type, id = null, data = {}) {
        currentDBEditorContext = { type, id, isLayoutNode: ['testimonial_text', 'testimonial_video', 'social_icon'].includes(type) };
        const modal = document.getElementById('universal-modal'); const body = document.getElementById('um-body'); const title = document.getElementById('um-title');
        body.innerHTML = '';
        
        if (type === 'product') {
            title.innerHTML = `<i class="fa-solid fa-box-open text-pink-400"></i> ${id ? 'Editar Producto' : 'Nuevo Producto'}`;
            body.innerHTML = `
                <div><label class="lbl">ID Único</label><input type="text" id="db-id" value="${id||'prod_'+Date.now()}" ${id?'disabled':''} class="inp-field opacity-50"></div>
                <div><label class="lbl">Nombre del Producto</label><input type="text" id="db-name" value="${data.name||''}" class="inp-field"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Categoría</label><select id="db-cat" class="inp-field"><option value="mas-vendidos">Más Vendidos</option><option value="promocionales">Promocionales</option><option value="textil">Textil</option><option value="jarros">Jarros & Thermos</option><option value="imp-general">Imp. General</option><option value="packs">Packs</option></select></div>
                    <div><label class="lbl">Precio ($)</label><input type="number" step="0.01" id="db-price" value="${data.price||0}" class="inp-field"></div>
                </div>
                <div><label class="lbl">Imagen Primaria (URL)</label><div class="flex gap-2"><input type="text" id="db-img" value="${data.image||data.images?.[0]||''}" class="inp-field"><button onclick="window.openGallery('db-img')" class="px-3 bg-white/10 rounded-lg hover:bg-white/20"><i class="fa-regular fa-image"></i></button></div></div>
                <label class="flex items-center gap-2 mt-4 cursor-pointer"><input type="checkbox" id="db-promo" ${data.isPromo?'checked':''} class="w-4 h-4 accent-pink-500"><span class="text-xs text-white font-bold">Activar Etiqueta "Promo"</span></label>
            `;
            if(data.category) setTimeout(()=>document.getElementById('db-cat').value = data.category, 10);
        }
        else if (type === 'course') {
            title.innerHTML = `<i class="fa-solid fa-laptop-file text-cyan-400"></i> ${id ? 'Editar Curso' : 'Nuevo Curso'}`;
            body.innerHTML = `
                <div><label class="lbl">ID Único</label><input type="text" id="db-id" value="${id||'course_'+Date.now()}" ${id?'disabled':''} class="inp-field opacity-50"></div>
                <div><label class="lbl">Título del Curso</label><input type="text" id="db-title" value="${data.title||''}" class="inp-field"></div>
                <div><label class="lbl">Descripción Corta</label><textarea id="db-desc" class="inp-field h-20 resize-none">${data.desc||''}</textarea></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Horarios (Ej: Mar y Jue)</label><input type="text" id="db-schedule" value="${data.schedule||''}" class="inp-field"></div>
                    <div><label class="lbl">Inversión (Ej: $150)</label><input type="text" id="db-price" value="${data.price||''}" class="inp-field"></div>
                </div>
                <div><label class="lbl">Imagen Portada (URL)</label><div class="flex gap-2"><input type="text" id="db-img" value="${data.image||''}" class="inp-field"><button onclick="window.openGallery('db-img')" class="px-3 bg-white/10 rounded-lg hover:bg-white/20"><i class="fa-regular fa-image"></i></button></div></div>
                <label class="flex items-center gap-2 mt-4 cursor-pointer"><input type="checkbox" id="db-masterclass" ${data.isMasterclass!==false?'checked':''} class="w-4 h-4 accent-cyan-500"><span class="text-xs text-white font-bold">Es Masterclass (Insignia Diamante)</span></label>
            `;
        }
        else if (type === 'testimonial_video') {
            title.innerHTML = `<i class="fa-solid fa-video text-cyan-400"></i> Configurar Testimonio (Video)`;
            body.innerHTML = `
                <div><label class="lbl">Archivo de Video (.mp4)</label><div class="flex gap-2"><input type="text" id="db-src" value="${data.src||''}" class="inp-field"><button onclick="window.openGallery('db-src')" class="px-3 bg-white/10 rounded-lg hover:bg-white/20"><i class="fa-solid fa-film"></i></button></div></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="lbl">Nombre del Alumno</label><input type="text" id="db-name" value="${data.name||''}" class="inp-field"></div>
                    <div><label class="lbl">Rol / Curso</label><input type="text" id="db-role" value="${data.role||''}" class="inp-field"></div>
                </div>
                <div><label class="lbl">Cita Destacada (Frase corta)</label><textarea id="db-quote" class="inp-field h-16 resize-none">${data.quote||''}</textarea></div>
                <div><label class="lbl">Tema Visual</label><select id="db-theme" class="inp-field font-bold text-cyan-400"><option value="cyan">Cyan Luminoso</option><option value="pink">Rosa Neón</option><option value="violet">Violeta Profundo</option></select></div>
            `;
            if(data.theme) setTimeout(()=>document.getElementById('db-theme').value = data.theme, 10);
        }
        else if (type === 'testimonial_text') {
            title.innerHTML = `<i class="fa-solid fa-comment-dots text-pink-400"></i> Configurar Comentario`;
            body.innerHTML = `
                <div><label class="lbl">Nombre del Alumno</label><input type="text" id="db-name" value="${data.name||''}" class="inp-field"></div>
                <div><label class="lbl">Rol / Etiqueta Inferior</label><input type="text" id="db-role" value="${data.role||''}" class="inp-field"></div>
                <div><label class="lbl">Testimonio Completo</label><textarea id="db-quote" class="inp-field h-24 resize-none">${data.quote||''}</textarea></div>
                <div><label class="lbl">Tema Visual</label><select id="db-theme" class="inp-field font-bold text-pink-400"><option value="pink">Rosa Neón</option><option value="cyan">Cyan Luminoso</option><option value="violet">Violeta Profundo</option><option value="amber">Ámbar (Dorado)</option></select></div>
            `;
            if(data.theme) setTimeout(()=>document.getElementById('db-theme').value = data.theme, 10);
        }
        
        document.getElementById('um-save-btn').onclick = saveUniversalDB;
        modal.classList.add('show');
    }

    window.closeUniversalModal = function() { document.getElementById('universal-modal').classList.remove('show'); currentDBEditorContext = null; }

    function saveUniversalDB() {
        const ctx = currentDBEditorContext; if(!ctx) return;
        const iframeMsg = { type: 'DB_SAVE_REQUEST', itemType: ctx.type, id: ctx.id, data: {} };
        
        if (ctx.type === 'product') {
            iframeMsg.id = document.getElementById('db-id').value;
            iframeMsg.data = { name: document.getElementById('db-name').value, category: document.getElementById('db-cat').value, price: parseFloat(document.getElementById('db-price').value)||0, image: document.getElementById('db-img').value, isPromo: document.getElementById('db-promo').checked };
        } 
        else if (ctx.type === 'course') {
            iframeMsg.id = document.getElementById('db-id').value;
            iframeMsg.data = { title: document.getElementById('db-title').value, desc: document.getElementById('db-desc').value, schedule: document.getElementById('db-schedule').value, price: document.getElementById('db-price').value, image: document.getElementById('db-img').value, isMasterclass: document.getElementById('db-masterclass').checked };
        }
        else if (ctx.type === 'testimonial_video') {
            iframeMsg.data = { src: document.getElementById('db-src').value, name: document.getElementById('db-name').value, role: document.getElementById('db-role').value, quote: document.getElementById('db-quote').value, theme: document.getElementById('db-theme').value };
        }
        else if (ctx.type === 'testimonial_text') {
            iframeMsg.data = { name: document.getElementById('db-name').value, role: document.getElementById('db-role').value, quote: document.getElementById('db-quote').value, theme: document.getElementById('db-theme').value };
        }

        document.getElementById('site-frame').contentWindow.postMessage(iframeMsg, '*');
        window.closeUniversalModal();
    }

    window.addEventListener('message', (event) => {
        const data = event.data;
        if (data.type === 'APP_READY') { document.getElementById('site-frame').contentWindow.postMessage({ type: 'ENABLE_BUILDER' }, '*'); }
        
        if (data.type === 'OPEN_EDITOR') { window.openUniversalDBEditor(data.editorType, data.itemId, data.itemData || {}); }
        
        if (data.type === 'ELEMENT_SELECTED') { renderPropertiesPanel(data); }
        if (data.type === 'CLEAR_SELECTION') { document.getElementById('properties-panel').innerHTML = '<div class="w-full h-full flex flex-col items-center justify-center text-zinc-600 text-[10px] text-center p-6"><i class="fa-solid fa-wand-magic-sparkles text-xl mb-2 opacity-50"></i><p>Selecciona un nodo en el lienzo para inspeccionarlo.</p></div>'; }
        
        if (data.type === 'SAVE_DONE') { 
            const btn = document.getElementById('publish-btn'); btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Publicar Cambios'; 
            alert('¡Guardado en la base de datos de producción con éxito!');
        }
    });

    window.updateText = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', text: val}, '*'); }
    window.updateHref = function(val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_ELEMENT', href: val}, '*'); }
    window.updateStyle = function(prop, val) { document.getElementById('site-frame').contentWindow.postMessage({type: 'UPDATE_STYLE', prop: prop, value: val}, '*'); }
    window.deleteElement = function() { document.getElementById('site-frame').contentWindow.postMessage({type: 'DELETE_SELECTED_NODE'}, '*'); window.postMessage({type: 'CLEAR_SELECTION'}, '*'); }

    window.toggleAccordion = function(headerEl) { const item = headerEl.parentElement; const isActive = item.classList.contains('active'); document.querySelectorAll('.acc-item').forEach(el => el.classList.remove('active')); if(!isActive) item.classList.add('active'); }

    function renderPropertiesPanel(data) {
        const panel = document.getElementById('properties-panel');
        let initialStyles = data.styles || {};
        
        let html = `
        <div class="w-full bg-[#0d0d11] border-b border-white/5 p-4 flex items-center justify-between sticky top-0 z-20">
            <div>
                <span class="text-cyan-400 font-extrabold text-[9px] uppercase tracking-widest block mb-0.5">Nodo Activo</span>
                <span class="text-white text-xs font-mono font-bold">${data.tagName}</span>
            </div>
            <div class="flex gap-1 bg-black p-1 rounded-md border border-white/5">
                <button onclick="document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_PARENT_NODE'}, '*')" class="w-6 h-6 rounded bg-transparent hover:bg-white/10 text-zinc-500 hover:text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-arrow-up"></i></button>
                <button onclick="document.getElementById('site-frame').contentWindow.postMessage({type: 'SELECT_CHILD_NODE'}, '*')" class="w-6 h-6 rounded bg-transparent hover:bg-white/10 text-zinc-500 hover:text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
        </div>`;

        // Content Accordion
        html += `<div class="acc-item active"><div class="acc-header" onclick="window.toggleAccordion(this)"><span><i class="fa-solid fa-pen-nib mr-1"></i> Contenido</span> <i class="fa-solid fa-chevron-down"></i></div><div class="acc-content">`;
        if (!['IMG', 'VIDEO', 'SECTION', 'DIV', 'ARTICLE'].includes(data.tagName)) {
            html += `<div><label class="lbl">Texto Visible</label><textarea oninput="window.updateText(this.value)" class="inp-field h-20 resize-none">${data.text || ''}</textarea></div>`;
        }
        if (['IMG', 'VIDEO', 'A', 'BUTTON'].includes(data.tagName) || data.href) {
            html += `<div><label class="lbl">Enlace / Origen</label><input type="text" oninput="window.updateHref(this.value)" value="${data.href || ''}" class="inp-field"></div>`;
        }
        html += `</div></div>`;

        // Typography Accordion
        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)"><span><i class="fa-solid fa-font mr-1"></i> Tipografía</span> <i class="fa-solid fa-chevron-down"></i></div><div class="acc-content">
            <div><label class="lbl">Tamaño</label><select onchange="window.updateStyle('textSize', this.value)" class="inp-field"><option value="">Heredado</option><option value="text-xs">Extra Pequeño</option><option value="text-sm">Pequeño</option><option value="text-base">Normal</option><option value="text-lg">Grande</option><option value="text-2xl">Título 2XL</option><option value="text-4xl">Título 4XL</option></select></div>
            <div><label class="lbl">Grosor</label><select onchange="window.updateStyle('fontWeight', this.value)" class="inp-field"><option value="">Heredado</option><option value="font-light">Ligero</option><option value="font-normal">Normal</option><option value="font-bold">Negrita</option><option value="font-extrabold">Extra Negrita</option></select></div>
        </div></div>`;

        // Design Accordion
        html += `<div class="acc-item"><div class="acc-header" onclick="window.toggleAccordion(this)"><span><i class="fa-solid fa-ruler-combined mr-1"></i> Layout</span> <i class="fa-solid fa-chevron-down"></i></div><div class="acc-content">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="lbl">Ancho (W)</label><input type="text" id="inp-width" oninput="window.updateStyle('width', this.value)" value="${initialStyles.width || ''}" class="inp-field" placeholder="auto, 100%"></div>
                <div><label class="lbl">Alto (H)</label><input type="text" id="inp-height" oninput="window.updateStyle('height', this.value)" value="${initialStyles.height || ''}" class="inp-field" placeholder="auto, 200px"></div>
                <div><label class="lbl">Padding</label><input type="text" oninput="window.updateStyle('padding', this.value)" value="${initialStyles.padding || ''}" class="inp-field" placeholder="10px"></div>
                <div><label class="lbl">Margin</label><input type="text" oninput="window.updateStyle('margin', this.value)" value="${initialStyles.margin || ''}" class="inp-field" placeholder="0 auto"></div>
            </div>
        </div></div>`;

        html += `<div class="p-4"><button onclick="window.deleteElement()" class="w-full py-2.5 rounded-lg bg-red-500/10 text-red-500 border border-red-500/20 text-[10px] font-bold hover:bg-red-500 hover:text-white transition-all"><i class="fa-solid fa-trash-can mr-1"></i> Purgar Nodo</button></div>`;

        panel.innerHTML = html;
        panel.className = "sidebar-right hide-scrollbar p-0";
    }
</script>
</body>
</html>
