name: Deploy to Firebase Hosting

on:
  # Se publica solo cuando cambian archivos del sitio en main.
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'admin.html'
      - 'firebase.json'
      - '*.ico'
      - '*.png'
      - '*.webp'
      - '*.jpg'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'fonts/**'
      - 'assets/**'
  # Y se puede seguir publicando a mano desde la pestaña Actions.
  # Con otro canal (por ejemplo "prueba") se crea una vista previa sin tocar la web real.
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de Firebase ("live" = web real)'
        required: false
        default: 'live'

concurrency:
  group: firebase-deploy-${{ github.event.inputs.channel || 'live' }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Revisar que el HTML no esté roto
        run: |
          for f in index.html admin.html; do
            grep -qi '</html>' "$f" || { echo "$f parece incompleto"; exit 1; }
          done

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: multiprintt-cc0f1
          channelId: ${{ github.event.inputs.channel || 'live' }}
          expires: 7d
