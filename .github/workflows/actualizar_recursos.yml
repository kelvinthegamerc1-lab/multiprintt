name: Actualizar JSON y Renombrar Recursos

on:
  push:
    branches:
      - main
    paths:
      - 'recursos/**'
      - '!recursos/imagenes.json'  # Evita bucles infinitos si el bot modifica el JSON
      - '!recursos/productos/**'   # La carpeta productos tiene su propio workflow
  workflow_dispatch:

# Si llegan varios push seguidos, solo corre uno a la vez y en orden.
concurrency:
  group: recursos-main
  cancel-in-progress: false

jobs:
  procesar_recursos:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install --quiet pillow

      - name: Optimizar imágenes nuevas (convierte a WebP y reduce las muy pesadas)
        run: python .github/scripts/optimizar_imagenes.py recursos --no-recursivo --excluir favicon.webp,logo_mejorado.webp

      - name: Renombrar testimonios y generar imagenes.json
        run: |
          cat << 'EOF2' > /tmp/procesar_recursos.py
          import os, json, re

          recursos_dir = 'recursos'
          testimonio_dir = os.path.join(recursos_dir, 'testimonio')
          json_path = os.path.join(recursos_dir, 'imagenes.json')
          ext_img_validas = ('.webp', '.jpg', '.jpeg', '.png', '.gif')
          # Archivos del sitio que no son fotos de la galería
          archivos_excluidos = {'favicon.webp', 'favicon.png', 'logo_mejorado.webp', 'logo_mejorado.png', 'imagenes.json'}

          os.makedirs(testimonio_dir, exist_ok=True)

          # 1. Renombrar videos nuevos .mp4 de testimonio a testimonioN.mp4 (los existentes no cambian)
          patron = re.compile(r'^testimonio(\d+)\.mp4$', re.IGNORECASE)
          max_idx, nuevos = -1, []
          for f in sorted(os.listdir(testimonio_dir)):
              if not os.path.isfile(os.path.join(testimonio_dir, f)):
                  continue
              m = patron.match(f)
              if m:
                  max_idx = max(max_idx, int(m.group(1)))
              elif f.lower().endswith('.mp4'):
                  nuevos.append(f)
          for f in nuevos:
              max_idx += 1
              nuevo = f'testimonio{max_idx}.mp4'
              os.rename(os.path.join(testimonio_dir, f), os.path.join(testimonio_dir, nuevo))
              print(f'-> Renombrado video: {f} -> {nuevo}')

          # 2. Lista de la galería en orden natural (dtf2 antes que dtf10)
          def natural(n):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)', n)]

          lista = [f for f in sorted(os.listdir(recursos_dir), key=natural)
                   if os.path.isfile(os.path.join(recursos_dir, f))
                   and f.lower() not in archivos_excluidos
                   and f.lower().endswith(ext_img_validas)]
          lista += [f'testimonio/{f}' for f in sorted(os.listdir(testimonio_dir), key=natural)
                    if f.lower().endswith('.mp4')]

          with open(json_path, 'w', encoding='utf-8') as fh:
              json.dump(lista, fh, indent=4, ensure_ascii=False)
              fh.write('\n')
          print(f'-> imagenes.json con {len(lista)} elementos')
          EOF2
          python /tmp/procesar_recursos.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A recursos/
          if git diff --cached --quiet; then
            echo "No hay archivos nuevos ni cambios para hacer commit."
            exit 0
          fi
          git commit -m "chore: optimizar recursos y actualizar imagenes.json [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
