name: Actualizar JSON y Renombrar Recursos

on:
  # Se ejecuta automáticamente cuando subes algo a la carpeta recursos
  push:
    branches:
      - main
    paths:
      - 'recursos/**'
      - '!recursos/imagenes.json' # Evita un bucle infinito si el bot modifica el JSON
  # Te habilita un botón en GitHub para ejecutarlo manualmente cuando quieras
  workflow_dispatch: 

jobs:
  procesar_recursos:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script de renombrado y generación de JSON
        run: |
          cat << 'EOF' > procesar_recursos.py
          import os, json, re

          recursos_dir = 'recursos'
          testimonios_dir = os.path.join(recursos_dir, 'testimonios')
          json_path = os.path.join(recursos_dir, 'imagenes.json')

          # Asegurar que las carpetas existan
          if not os.path.exists(recursos_dir): os.makedirs(recursos_dir)
          if not os.path.exists(testimonios_dir): os.makedirs(testimonios_dir)

          data = {"recursos_general": [], "testimonios": {}}

          # 1. Procesar y renombrar archivos en 'testimonios'
          testimonio_archivos = os.listdir(testimonios_dir)
          # Patrón para identificar imágenes con el formato resinaX.ext
          resina_pattern = re.compile(r'^resina(\d+)\.(jpg|jpeg|png)$', re.IGNORECASE)

          max_idx = -1
          archivos_para_renombrar = []

          # Buscar el número más alto existente (ej. resina3.jpg) y separar los archivos nuevos
          for f in testimonio_archivos:
              filepath = os.path.join(testimonios_dir, f)
              if not os.path.isfile(filepath): continue
              
              match = resina_pattern.match(f)
              if match:
                  max_idx = max(max_idx, int(match.group(1)))
              elif f.lower().endswith(('.jpg', '.jpeg', '.png')):
                  # Es una imagen que no tiene el formato "resinaX", hay que renombrarla
                  archivos_para_renombrar.append(f)

          # Renombrar los archivos nuevos siguiendo la secuencia
          for f in archivos_para_renombrar:
              ext = f.split('.')[-1].lower()
              max_idx += 1
              nuevo_nombre = f"resina{max_idx}.{ext}"
              os.rename(os.path.join(testimonios_dir, f), os.path.join(testimonios_dir, nuevo_nombre))
              print(f"Renombrado: {f} -> {nuevo_nombre}")

          # Volver a leer la carpeta después de los renombrados
          testimonio_archivos_actualizados = sorted(os.listdir(testimonios_dir))
          data["testimonios"]["imagenes"] = [f for f in testimonio_archivos_actualizados if f.lower().endswith(('.jpg', '.jpeg', '.png'))]
          data["testimonios"]["videos"] = [f for f in testimonio_archivos_actualizados if f.lower().endswith(('.mp4', '.webm'))]
          data["testimonios"]["total_testimonios"] = len(data["testimonios"]["imagenes"]) + len(data["testimonios"]["videos"])

          # 2. Leer archivos en la raíz de 'recursos' (excluyendo carpetas y el propio JSON)
          for f in sorted(os.listdir(recursos_dir)):
              if os.path.isfile(os.path.join(recursos_dir, f)) and f != 'imagenes.json':
                  data["recursos_general"].append(f)

          # 3. Guardar el JSON
          with open(json_path, 'w', encoding='utf-8') as json_file:
              json.dump(data, json_file, indent=4, ensure_ascii=False)

          print(f"JSON actualizado exitosamente con {data['testimonios']['total_testimonios']} testimonios en total.")
          EOF
          python procesar_recursos.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add recursos/
          
          # Verificar si hay cambios en el repositorio
          if git diff-index --quiet HEAD; then
            echo "No hay imágenes nuevas ni cambios para hacer commit."
          else
            git commit -m "chore: renombrar imágenes nuevas y actualizar imagenes.json [skip ci]"
            git push
          fi
