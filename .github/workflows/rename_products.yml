name: Renombrar Imágenes de Productos

on:
  workflow_dispatch: # Te permite ejecutar el workflow manualmente desde la pestaña 'Actions' en GitHub
  push:
    paths:
      - 'recursos/productos/**' # Se ejecuta automáticamente si subes nuevas imágenes a esta carpeta

jobs:
  rename-images:
    runs-on: ubuntu-latest

    steps:
      - name: Chequear el repositorio
        uses: actions/checkout@v4

      - name: Renombrar imágenes numeradas
        run: |
          cd recursos/productos
          
          count=1
          shopt -s nullglob
          
          # Renombrar a un nombre temporal para evitar sobrescribir imágenes existentes durante el bucle
          for file in *.{jpg,jpeg,png,webp,gif,JPG,JPEG,PNG,WEBP,GIF}; do
            ext="${file##*.}"
            mv "$file" "temp_${count}.${ext}"
            count=$((count+1))
          done

          # Renombrar de temporales al nombre final definitivo (producto1, producto2, etc.)
          count=1
          for temp_file in temp_*; do
            if [ -f "$temp_file" ]; then
              ext="${temp_file##*.}"
              mv "$temp_file" "producto${count}.${ext}"
              count=$((count+1))
            fi
          done

      - name: Generar lista de imágenes en JSON
        run: |
          cd recursos/productos
          shopt -s nullglob
          
          # Crear o vaciar el archivo JSON
          echo "[" > imagenes.json
          
          first=true
          for file in *.{jpg,jpeg,png,webp,gif,JPG,JPEG,PNG,WEBP,GIF}; do
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> imagenes.json
            fi
            # Agrega el nombre del archivo en formato JSON
            echo "  \"$file\"" >> imagenes.json
          done
          
          echo "]" >> imagenes.json

      - name: Confirmar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add recursos/productos/
          
          if git diff --staged --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "chore: renombrar imágenes y actualizar lista JSON"
            git push
          fi
