name: Convertir imágenes antiguas a WebP

# Antes este workflow borraba todos los .jpg/.png del repositorio.
# Ahora los convierte a .webp dentro de recursos/ y solo borra el original
# cuando la copia .webp quedó bien. Los íconos del sitio en la raíz no se tocan.
on:
  workflow_dispatch:

concurrency:
  group: recursos-main
  cancel-in-progress: false

jobs:
  convert-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install --quiet pillow

      - name: Convertir jpg, jpeg, png y gif de recursos/ a WebP
        run: python .github/scripts/optimizar_imagenes.py recursos

      - name: Hacer commit y push de los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A recursos/
          if git diff --cached --quiet; then
            echo "No se encontraron imágenes para convertir."
            exit 0
          fi
          git commit -m "chore: convertir imágenes antiguas a webp"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
